name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: host
        run: echo "ref=$(cat HOST_REF)" >> "$GITHUB_OUTPUT"
      - name: Check out the host profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Smana/cloud-native-ref
          ref: ${{ steps.host.outputs.ref }}
          path: .host
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5
      - run: flux plugin install schema@0.11.0
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml
      - run: sudo apt-get update && sudo apt-get install -y jq
      # ci.yaml's key: a tag run restores the cache main's CI saved, so the render pulls no chart
      # from ECR Public, which rations anonymous pulls per runner IP (429 on v0.1.11).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/helm
          key: helm-${{ hashFiles('HOST_REF', '**/*helmrelease*.yaml', 'flux/sources/**') }}
          restore-keys: helm-
      # A tag can point at a commit that never passed CI.
      - run: task check
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: ./scripts/ci/push-artifact.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}"
