---
# One preemptible pod holding a warm agents-gvisor node with the run images pulled
# (cache and costs CP4). KEDA scales it on weekdays; the base and gcp-0 stay off.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agents-headroom
  namespace: flux-system
spec:
  prune: true
  interval: 5m0s
  timeout: 2m0s
  path: ./infrastructure/aws-0/karpenter-nodepools-agents/headroom
  sourceRef:
    kind: OCIRepository
    name: ai-native-ref
  dependsOn:
    - name: infrastructure
    - name: agents-nodepool
    - name: runtimeclass-gvisor
