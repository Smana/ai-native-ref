---
# Kyverno admission and GC for agent runs. Needs Kyverno (in `security`) and the
# maku.ogenki.io AgentRun CRD its DeletingPolicy names (agent-factory-crds, R3).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-policies
  namespace: flux-system
spec:
  prune: true
  interval: 5m0s
  timeout: 2m0s
  path: ./security/base/agent-policies
  sourceRef:
    kind: OCIRepository
    name: ai-native-ref
  dependsOn:
    - name: security
    - name: agent-factory-crds
