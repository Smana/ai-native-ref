---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: merge-gate-secrets
  namespace: flux-system
spec:
  prune: true
  interval: 5m0s
  timeout: 2m0s
  path: ./security/base/merge-gate-secrets
  sourceRef:
    kind: OCIRepository
    name: ai-native-ref
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: eks-aws-0-vars
  dependsOn:
    - name: security
