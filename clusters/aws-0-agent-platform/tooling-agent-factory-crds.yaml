---
# The agent factory's CRDs (all six maku.ogenki.io kinds), before the agent policies, the room
# broker (its run-controller reconciles AgentRuns), the factory and its resources, which all
# dependsOn this child. No dependsOn room-broker any more (R3): that ordering only let Flux label the
# Room CRD before Helm adopted it (runbook 26), done once, and it would now be a cycle. wait: the
# children after it start only once every CRD is established.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-factory-crds
  namespace: flux-system
spec:
  prune: true
  interval: 10m0s
  retryInterval: 30s
  timeout: 5m0s
  path: ./tooling/base/agent-factory/crds
  sourceRef:
    kind: OCIRepository
    name: ai-native-ref
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: agent-factory-crds
      namespace: agent-system
