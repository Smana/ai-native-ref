---
# The agent factory's Slack App (runbook 22), as gcp-0's. One Slack App has one Request URL: only the
# cloud it points at receives Slack's events (runbook 22, "Which cloud serves Slack").
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tooling-factory-slack-app
  namespace: flux-system
spec:
  prune: true
  interval: 5m0s
  retryInterval: 30s
  timeout: 5m0s
  path: ./tooling/aws-0/agent-factory/slack-app
  sourceRef:
    kind: OCIRepository
    name: ai-native-ref
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: eks-aws-0-vars
  # The host's H2 Kustomizations only (AGENTS.md), plus its siblings: its ExternalSecrets read the
  # agents store, it calls the broker and the factory.
  dependsOn:
    - name: agent-secrets
    - name: room-broker
    - name: agent-factory
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: factory-slack-app
      namespace: agent-system
