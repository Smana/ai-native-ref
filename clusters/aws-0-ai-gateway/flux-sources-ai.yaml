---
# The 10 AI-owned Flux sources (flux/sources/, listed in ./sources). The host's flux-sources child
# applies them until S3 retargets it; this child takes them over then. It sits in the
# ai-gateway umbrella because llm-platform and agent-platform depend on it. No postBuild:
# the sources substitute nothing, and assert-cloud-shape.py refuses gke vars on a shared path.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ai-sources
  namespace: flux-system
spec:
  prune: true
  # Removing ai-sources (e.g. a rollback) must not delete the 10 sources the host also defines.
  deletionPolicy: Orphan
  interval: 5m0s
  path: ./clusters/aws-0-ai-gateway/sources
  sourceRef:
    kind: OCIRepository
    name: ai-native-ref
  dependsOn:
    - name: crds
