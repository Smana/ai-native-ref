---
# One preemptible pod holding a warm agents-gvisor node with the run images pulled
# (warm-sandboxes design step 1), as on aws-0: GKE's sandbox pool scales from zero
# too. GKE's RuntimeClass `gvisor` places it; its PriorityClass (-10) is the lowest
# GKE's autoscaler still scales up for. It holds one e2-standard-8 up while live.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agents-headroom
  namespace: flux-system
spec:
  prune: true
  interval: 5m0s
  timeout: 2m0s
  path: ./infrastructure/base/karpenter-nodepools-agents/headroom
  sourceRef:
    kind: OCIRepository
    name: ai-native-ref
  dependsOn:
    - name: agent-sandbox
