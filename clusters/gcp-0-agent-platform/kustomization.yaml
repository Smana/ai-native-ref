apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Flat list of gcp-0's agent-platform children: aws-0's minus its node-pool
# child and its gVisor RuntimeClass child (GKE Sandbox provides both, GCP
# parity GP-9). A child that substitutes gke-gcp-0-vars points at a */gcp-0/*
# overlay (assert-cloud-shape.py).
resources:
  - infrastructure-agent-sandbox.yaml
  - infrastructure-agent-runtime.yaml
  - security-agent-policies.yaml
  - security-agent-secrets.yaml
  - infrastructure-agent-router.yaml
  - infrastructure-agentgateway.yaml
  - infrastructure-agent-gateway.yaml
  - infrastructure-model-gateway.yaml
  - security-octo-sts.yaml
  - security-merge-gate-secrets.yaml
  - infrastructure-agent-mcp.yaml
  - infrastructure-room-broker.yaml
  - tooling-agent-factory-crds.yaml
  - tooling-agent-factory.yaml
  - tooling-agent-factory-resources.yaml
  - tooling-factory-slack-app.yaml
  - tooling-policy-bot.yaml
  - observability-agent-platform.yaml
  - observability-runlore-factory.yaml
