---
# RunLore's notifier and intake token, gated with the platform (SP3 §1). RunLore itself
# runs outside the umbrella; only its values merge happens here, through the optional
# valuesFrom in observability/base/runlore/helmrelease.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: runlore-factory
  namespace: flux-system
spec:
  prune: true
  interval: 5m0s
  timeout: 2m0s
  path: ./observability/gcp-0/agent-platform/runlore-factory
  sourceRef:
    kind: OCIRepository
    name: ai-native-ref
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gke-gcp-0-vars
  dependsOn:
    - name: agent-factory
