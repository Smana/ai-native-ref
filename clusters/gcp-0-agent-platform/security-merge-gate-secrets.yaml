---
# merge-gate's namespaced SecretStore (SP3, C1): the `merge-gate` mount only (R44).
# After security-openbao, which installs the ESO webhook's stores and the openbao endpoint.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: merge-gate-secrets
  namespace: flux-system
spec:
  prune: true
  interval: 5m0s
  retryInterval: 30s
  timeout: 3m0s
  path: ./security/gcp-0/merge-gate-secrets
  sourceRef:
    kind: OCIRepository
    name: ai-native-ref
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gke-gcp-0-vars
  dependsOn:
    - name: security-openbao
  # Flux evaluates healthCheckExprs only for resources named in healthChecks.
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: SecretStore
      name: merge-gate-secrets
      namespace: merge-gate
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: SecretStore
      current: status.conditions.filter(c, c.type == 'Ready').all(c, c.status == 'True')
      failed: status.conditions.filter(c, c.type == 'Ready').all(c, c.status == 'False')
