---
# The agent factory's CRDs (all six maku.ogenki.io kinds), before the factory and its resources,
# which both dependsOn this child. After room-broker: its vendored Room CRD carries this release's
# ownership metadata, which Helm needs to adopt it (runbook 26). wait: the factory and its
# resources start only once every CRD is established.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-factory-crds
  namespace: flux-system
spec:
  prune: true
  interval: 10m0s
  retryInterval: 30s
  timeout: 5m0s
  path: ./tooling/base/agent-factory/crds
  sourceRef:
    kind: OCIRepository
    name: ai-native-ref
  dependsOn:
    - name: room-broker
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: agent-factory-crds
      namespace: agent-system
