---
# policy-bot (SP3 §5): posts `policy-bot: main` on every PR, which the factory's merge gate
# reads (row 3); without it every decision is human/policy_absent.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policy-bot
  namespace: flux-system
spec:
  prune: true
  interval: 5m0s
  retryInterval: 30s
  timeout: 5m0s
  path: ./tooling/gcp-0/policy-bot
  sourceRef:
    kind: OCIRepository
    name: ai-native-ref
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gke-gcp-0-vars
  dependsOn:
    - name: merge-gate-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: policy-bot
      namespace: merge-gate
