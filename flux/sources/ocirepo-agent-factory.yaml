# The factory's signed chart (SP3 §4). Signatures: release.yaml tags only (R20).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agent-factory
  namespace: agent-system
spec:
  interval: 12h
  url: oci://ghcr.io/smana/charts/agent-factory
  # Flux pulls the digest (it wins over the tag), so a re-pushed tag changes nothing. The tag
  # stays for Renovate and for readers.
  ref:
    tag: "0.17.1"  # agent-platform v0.17.1
    digest: sha256:b623c3ceebad24f2403f08a22ed346a2a566655f1582a6b7b588437d6a66b2e4
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: "^https://token\\.actions\\.githubusercontent\\.com$"
        subject: "^https://github\\.com/Smana/agent-platform/\\.github/workflows/release\\.yaml@refs/tags/v.*$"
