# The factory's signed chart (SP3 §4). Signatures: release.yaml tags only (R20).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agent-factory
  namespace: agent-system
spec:
  interval: 12h
  url: oci://ghcr.io/smana/charts/agent-factory
  # Flux pulls the digest (it wins over the tag), so a re-pushed tag changes nothing. The tag
  # stays for Renovate and for readers.
  ref:
    tag: "0.15.4"  # agent-platform v0.15.4
    digest: sha256:c8d37ba2197a57e3c572fdd2a303f2ddd3e37b27df7f43c354e2a801298622b7
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: "^https://token\\.actions\\.githubusercontent\\.com$"
        subject: "^https://github\\.com/Smana/agent-platform/\\.github/workflows/release\\.yaml@refs/tags/v.*$"
