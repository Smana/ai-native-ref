# The proxy's Google credential on aws-0: an ADC external_account config, which Maku's chart mounts
# and names with GOOGLE_APPLICATION_CREDENTIALS (gcpCredentials.source external). No secret in it:
# the pool provider to exchange at, and where the AWS subject token comes from. The token itself is
# a GetCallerIdentity request the proxy signs with the Pod Identity session the aws-creds sidecar
# serves on loopback (aws-creds/server.py); Google's STS replays it and checks the role.
#
# No service_account_impersonation_url: the federated principal holds the Vertex role directly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-gateway-gcp-credentials
  namespace: agent-gateway
data:
  credentials.json: |
    {
      "type": "external_account",
      "audience": "${gcp_vertex_wif_audience}",
      "subject_token_type": "urn:ietf:params:aws:token-type:aws4_request",
      "token_url": "https://sts.googleapis.com/v1/token",
      "credential_source": {
        "environment_id": "aws1",
        "url": "http://127.0.0.1:8099/latest/meta-data/iam/security-credentials",
        "regional_cred_verification_url": "https://sts.{region}.amazonaws.com?Action=GetCallerIdentity&Version=2011-06-15"
      }
    }
