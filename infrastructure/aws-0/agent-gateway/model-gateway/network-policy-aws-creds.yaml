# The aws-creds sidecar's one dial: the EKS Pod Identity agent, 169.254.170.23:80 on the node's host
# network, which Cilium classifies as the host entity (toCIDR never matches it; host security/AGENTS.md
# rule 3). Added beside the chart's policy and ../../../base's overlay: Cilium allow rules add up.
# Google's STS and the Vertex host are the chart's (gcpCredentials.source external, the vertex preset).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: model-gateway-aws-creds
  namespace: agent-gateway
spec:
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: model-gateway
  egress:
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
