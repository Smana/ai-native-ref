apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/karpenter-nodepools-agents/headroom
  - scaledobject.yaml

# KEDA owns replicas: Flux must not reset the schedule to the base's zero.
patches:
  - target: {kind: Deployment, name: agents-headroom}
    patch: |-
      - op: remove
        path: /spec/replicas
