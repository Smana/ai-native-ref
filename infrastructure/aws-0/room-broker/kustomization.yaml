apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A render root of its own, so CI renders this base with aws-0's fixture values
# (GCP parity GP-14). The Flux child for aws-0 points here.
resources:
  - ../../base/room-broker
  # RunLore's session switch (RK15), off: list externalsecret-webhook-runlore.yaml here, so nothing syncs a key
  # nobody seeded (runbook 25).
  # - externalsecret-webhook-runlore.yaml

# This config.yaml is base's plus the Slack App's keys, the planner on and two session switches (its header says which).
configMapGenerator:
  - name: room-broker-config
    namespace: agent-system
    behavior: replace
    files:
      - config.yaml

patches:
  # The webhook egress, generated from config.yaml's webhooks: scripts/ci/gen-webhook-egress.py --write.
  - path: network-policy-webhooks-patch.yaml
  # Gemini on Vertex AI (Gemini design G6, G7; cloud-native-ref's aws-vertex-federation design): the
  # model gateway serves its two aliases on aws-0's public listener too
  # (infrastructure/aws-0/agent-gateway/model-gateway), so the run-controller may mint a public run's
  # token for them. Never internal, never a default. `test` pins the list; same patch as gcp-0's.
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: room-broker
    patch: |-
      - op: test
        path: /spec/values/runController/model/gateway/aliases/public/6
        value: mistral-light
      - op: add
        path: /spec/values/runController/model/gateway/aliases/public/-
        value: gemini-standard
      - op: add
        path: /spec/values/runController/model/gateway/aliases/public/-
        value: gemini-light
