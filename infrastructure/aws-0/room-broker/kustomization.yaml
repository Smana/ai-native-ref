apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A render root of its own, so CI renders this base with aws-0's fixture values
# (GCP parity GP-14). The Flux child for aws-0 points here.
resources:
  - ../../base/room-broker

# This config.yaml is base's plus human.mcp.sessionStart, a session switch (runbook 19).
configMapGenerator:
  - name: room-broker-config
    namespace: agent-system
    behavior: replace
    files:
      - config.yaml
