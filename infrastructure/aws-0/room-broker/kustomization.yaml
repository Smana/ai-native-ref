apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A render root of its own, so CI renders this base with aws-0's fixture values
# (GCP parity GP-14). The Flux child for aws-0 points here.
resources:
  - ../../base/room-broker
  # RunLore's session switch (RK15), on for a session (runbook 25).
  - externalsecret-webhook-runlore.yaml

# This config.yaml is base's plus the Slack App's keys, the planner on and two session switches (its header says which).
configMapGenerator:
  - name: room-broker-config
    namespace: agent-system
    behavior: replace
    files:
      - config.yaml

patches:
  # The webhook egress, generated from config.yaml's webhooks: scripts/ci/gen-webhook-egress.py --write.
  - path: network-policy-webhooks-patch.yaml
