# Generated by scripts/ci/gen-webhook-egress.py --write from the broker's config.yaml `webhooks`
# (factory interfaces F6, R21): edit the config, never this file. test-room-broker-webhook-egress
# fails on any difference. The DNS rule toFQDNs needs is in network-policy.yaml; Cilium unions the two.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: room-broker-webhooks
  namespace: agent-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: room-broker
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: agent-system
        app.kubernetes.io/name: factory-slack-app
    toPorts:
    - ports:
      - port: '8081'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: runlore
        app.kubernetes.io/name: runlore
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
