apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The model gateway from Maku's maku-gateway chart (v4 step 4, ANR follow-up 1), beside agent-router,
# and the ANR-side overlay for what the chart does not render: the provider keys in its namespace,
# budgets B1, B2 and B6, and the probe and budget-server rules of its network policy.
resources:
  - ocirepository.yaml
  - helmrelease.yaml
  - provider-keys.yaml
  - policy-budgets.yaml
  - network-policy.yaml
