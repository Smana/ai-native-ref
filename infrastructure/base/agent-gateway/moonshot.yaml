# moonshot on agentgateway, public listener only (feature 15, F15). Selectable, never a default:
# only a call that pins one of its aliases in x-ar-model reaches it (llm.yaml's header-matched
# rule), and policy-capabilities.yaml refuses the alias to any role whose profile does not list it.
# The key is the agents' OWN, read from OpenBao agents/moonshot (the ExternalSecret below).
#
# The owner's Kimi Code subscription (provider kimi-code-plan-global in their OpenCode), a flat-rate plan:
# api.moonshot.ai answers 401 for this key. Tokens are metered and the marginal USD is 0; the price row is
# nominal (helm-values-configmap.yaml). Owner-accepted risk: the plan's terms aim at coding tools and its
# rate limits are personal. Moonshot processes in China: public data only, never for internal.
# k3.1-pro thinks always: reasoning_content spends max_tokens before content.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: moonshot
  namespace: agent-system
spec:
  ai:
    provider:
      custom:
        # The catalog key (agent-model-catalog) and the series' provider label.
        providerOverride: moonshot
        formats:
          - type: Completions
            path: /coding/v1/chat/completions
      host: api.kimi.ai
      port: 443
  policies:
    auth:
      secretRef:
        name: agents-moonshot-api-key
        key: apiKey
    tls:
      sni: api.kimi.ai
    ai:
      routes:
        /v1/chat/completions: Completions
      modelAliases:
        kimi-frontier: k3.1-pro
      transformations:
        - field: model
          expression: '("x-ar-model" in request.headers ? request.headers["x-ar-model"] : llmRequest.model).with(m, m in ["kimi-frontier"] ? m : null)'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agents-moonshot-api-key
  namespace: agent-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  target:
    name: agents-moonshot-api-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: apiKey  # pragma: allowlist secret
      remoteRef:
        key: moonshot
        property: api_key  # pragma: allowlist secret
