# Default deny in agent-gateway (`- {}` selects no peer: it switches enforcement
# on and allows nothing), then the data plane's own peers and its phase C
# upstreams, its telemetry, then the rate-limit server.
# Valkey's own policy comes with its KVStore: 6379 from this namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: agent-gateway
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
# Selected by Gateway name in the Gateway's own namespace: any namespace can name
# a Gateway `agent-router` (CC-1).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-router-data-plane
  namespace: agent-gateway
spec:
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: agent-router
  ingress:
    # Sandbox pods only, as on the Envoy data plane. Runs cannot reach it yet:
    # the run CNP gains this peer at the cutover (CC-AGW1).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agents
          matchExpressions:
            - key: agents.ogenki.io/run-id
              operator: Exists
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8081"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "15021"
              protocol: TCP
    # The proxy scrape (vmpodscrape.yaml).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "15020"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # xDS from the controller, which also fetches the JWKS: the proxies never call the issuer.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agentgateway-system
            app.kubernetes.io/name: agentgateway
      toPorts:
        - ports:
            - port: "9978"
              protocol: TCP
    # The agents' providers: Z.ai, Kimi Code and Mistral for public (llm.yaml, moonshot.yaml,
    # mistral.yaml), Anthropic for internal (anthropic.yaml). Only they: the controller fetches the JWKS. Resolved
    # through the kube-dns rule above, whose DNS inspection toFQDNs needs.
    - toFQDNs:
        - matchName: api.z.ai
        - matchName: api.kimi.ai
        - matchName: api.mistral.ai
        - matchName: api.anthropic.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # The internal listener's read-only GitHub route (github.yaml): smart-HTTP git only.
    - toFQDNs:
        - matchName: github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # The MCP targets (mcp.yaml).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agent-system
            app.kubernetes.io/name: flux-operator-mcp
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agent-system
            app.kubernetes.io/name: mcp-victoriametrics
        - matchLabels:
            io.kubernetes.pod.namespace: agent-system
            app.kubernetes.io/name: mcp-victorialogs
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # RunLore's knowledge MCP (runlore-kb, RK12): read-only public text, no token (K10).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: runlore
            app.kubernetes.io/name: runlore
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Spans (policy-frontend.yaml), to the collector's platform port.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: agent-traces-collector
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
    # Budget checks (policy-budgets.yaml). Fail open: a dropped check admits the call.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agent-ratelimit
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-ratelimit
  namespace: agent-gateway
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agent-ratelimit
  ingress:
    # Both Gateways' proxies: model-gateway's budgets (model-gateway/policy-budgets.yaml) share
    # agent-router's buckets.
    - fromEndpoints:
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: agent-router
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: model-gateway
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # Kubelet probes on /healthcheck.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "19001"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: valkey
            app.kubernetes.io/instance: xplane-agent-ratelimit-valkey
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
