# agentgateway speaks Envoy's RLS v3 but bundles no server (gap G1): this is
# envoyproxy/ratelimit, the image and digest Envoy Gateway runs for ai-gateway,
# with a static config instead of Envoy Gateway's xDS.
#
# Limits are in reference tokens (design D11: USD / $1.70 per M), sized so the
# gateway never refuses before the factory would (agent-factory values, gate AG8):
# B1 5M per run per day ($8.50) is above every tier's run cap (frontier: runUSD
# $6.80, runTokens 4M); B2 41M for the fleet per day ($69.70) is
# budgets.factoryDaily plus caps.concurrentRuns runs at the frontier cap
# (25M + 4 x 4M). B6 is a provider cap the factory does not know.
#
# The flag is SHADOW_MODE on the Deployment below: "true" counts and admits,
# "false" refuses with 429. It is the only switch: no descriptor sets
# shadow_mode (gate AG8), so the flip is one line. Runbook 04, Part D.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-ratelimit-config
  namespace: agent-gateway
data:
  config.yaml: |
    domain: agent-router
    descriptors:
      # B1: one bucket per verified sub, i.e. per run (policy-budgets.yaml).
      - key: agent
        rate_limit:
          unit: day
          requests_per_unit: 5000000
      # B2: one bucket for every agent call.
      - key: fleet
        value: agents
        rate_limit:
          unit: day
          requests_per_unit: 41000000
      # B6: Anthropic's share of B2, in reference tokens: 10M = $17/day.
      - key: provider
        value: anthropic
        rate_limit:
          unit: day
          requests_per_unit: 10000000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-ratelimit
  namespace: agent-gateway
automountServiceAccountToken: false
---
# One replica: the policy fails open, so a restart costs a few uncounted
# requests, enforcing or not: one uncounted window per restart beats a refusal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-ratelimit
  namespace: agent-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-ratelimit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-ratelimit
    spec:
      serviceAccountName: agent-ratelimit
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ratelimit
          image: docker.io/envoyproxy/ratelimit:0482748e@sha256:5fdd8e3ae335ab6d64316f8d2fd9a886830075cbbb40a1d8065c869275909162
          command: ["/bin/ratelimit"]
          env:
            # THE FLAG (runbook 04, Part D). Shadow until the owner flips it.
            - name: SHADOW_MODE
              value: "true"
            # Reads /data/ratelimit/config/*.yaml; watching the subdirectory
            # picks up a ConfigMap update without a restart.
            - name: RUNTIME_ROOT
              value: /data
            - name: RUNTIME_SUBDIRECTORY
              value: ratelimit
            - name: RUNTIME_WATCH_ROOT
              value: "false"
            - name: RUNTIME_IGNOREDOTFILES
              value: "true"
            - name: LOG_LEVEL
              value: info
            - name: LOG_FORMAT
              value: json
            - name: USE_STATSD
              value: "false"
            - name: USE_PROMETHEUS
              value: "true"
            - name: PROMETHEUS_ADDR
              value: ":19001"
            - name: REDIS_SOCKET_TYPE
              value: tcp
            - name: REDIS_URL
              value: xplane-agent-ratelimit-valkey.agent-gateway.svc.cluster.local:6379
            - name: REDIS_AUTH
              valueFrom:
                secretKeyRef:
                  name: agent-ratelimit-valkey
                  key: REDIS_PASSWORD
          ports:
            - name: grpc
              containerPort: 8081
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 19001
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /data/ratelimit/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: agent-ratelimit-config
---
apiVersion: v1
kind: Service
metadata:
  name: agent-ratelimit
  namespace: agent-gateway
spec:
  selector:
    app.kubernetes.io/name: agent-ratelimit
  ports:
    - name: grpc
      port: 8081
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
---
# Counters per bucket (key1): total_hits, over_limit (reference tokens over a
# budget), and global_shadow_mode (calls SHADOW_MODE admitted over one).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: agent-ratelimit
  namespace: agent-gateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-ratelimit
  namespaceSelector:
    matchNames:
      - agent-gateway
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
