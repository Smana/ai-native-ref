---
# The agents' Anthropic key (ADR-0054), for the internal listener only: a
# dedicated workspace with its own spend limit, never the platform's key. Here
# beside the Z.ai key for the same reason (kustomization.yaml). No prune
# annotation: that one marks the Z.ai key's S3 handover, and this object was
# born here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agents-anthropic-api-key
  namespace: agent-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  target:
    name: agents-anthropic-api-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: apiKey  # pragma: allowlist secret
      remoteRef:
        key: anthropic
        property: api_key  # pragma: allowlist secret
