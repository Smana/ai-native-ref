apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Phase H removed Envoy's agent-router; the router is agentgateway's
# (infrastructure/base/agent-gateway). This child keeps the agents' provider keys,
# which agentgateway's backends read: moving an ExternalSecret to another child
# would let this one's prune delete the Secret under every run.
resources:
  - externalsecret-zai.yaml
  - externalsecret-anthropic.yaml
