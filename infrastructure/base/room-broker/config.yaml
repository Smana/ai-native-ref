# The broker's one config file (agent-platform internal/config), Flux-substituted.
# Decoded strictly: an unknown key fails the rollout. tls is left to its default,
# /etc/room-broker/tls/tls.{crt,key}, where the chart mounts room-broker-tls.
# The broker reads it once at startup: kustomization.yaml's configMapGenerator rolls
# the pods on a change.
publicURL: https://rooms.${private_domain_name}
# The run-controller's runs (R3): maku.ogenki.io AgentRuns named run-<id> in agents. This file
# replaces the chart's config, so it restates the HelmRelease's runs, runIssuer and roomTools:
# test-room-broker-run-kind.py fails when they differ.
runs:
  group: maku.ogenki.io
  namespace: agents
  namePrefix: run-
# The only run issuer is this cluster's, asked through TokenReview (the HelmRelease binds
# system:auth-delegator): no JWKS fetch, and the run's subject maps to its id.
runIssuers:
  - mode: tokenreview
    subPattern: '^system:serviceaccount:agents:run-([a-z2-7]{8})$'
# The agents' room tools on :8090 verify each run's own token through the run issuer above.
roomTools:
  enabled: true
  auth: tokenreview
  # RunLore's knowledge base for runs (Maku EX11): :8090 forwards kb_search and kb_get to RunLore's
  # read-only /mcp, for triager runs only (RunLore's investigate tasks). It replaces runlore-kb through
  # agent-router's federation, which R3's runs no longer call. The HelmRelease's
  # broker.roomTools.knowledge says the same and opens the egress: test-room-broker-knowledge.py.
  knowledge:
    url: http://runlore.runlore.svc.cluster.local:8080/mcp
    tools: [kb_search, kb_get]
    roles: [triager]
# System callers present audience rooms-system (ruling P3).
systemIssuer:
  issuer: ${oidc_issuer_url}
  jwksURL: ${oidc_jwks_uri}
# SP3's factory (FR-1): system callers present audience rooms-system (ruling P3).
systemPrincipals:
  system:serviceaccount:agent-system:agent-factory: system:factory
# SP3 phase 5: runs for hand to role, fork and add agent come from the factory, with the
# human's own token; the broker no longer renders a claim for the owner (C3).
factoryURL: http://agent-factory.agent-system.svc.cluster.local:8082
# Merge policy stage `manage` (Maku v0.50.0 replaced the switches with one stage; `promotion: true`
# was this stage): the settings pages (policy editor, evidence, promotion records) and their API,
# read with the factory's own key. They change no class: a maintainer's pull request does. Operators
# approve a promotion exception below the evidence minimum.
policyManagement: {stage: manage, operators: [Smana]}
# The hop stays plain HTTP, as it was. Maku v0.33.0 requires that to be stated (it forwards each human's token
# here); TLS follows in its own change.
factoryInsecure: true
# Humans, through oauth2-proxy (phase 2). Required by the broker. The ids are
# files, never literals: gcp-0 mints a fresh ZITADEL every build (ruling AS-a).
human:
  # ZITADEL's token rules, said explicitly (Maku v4 step 5 ANR follow-up 1): the project id in every
  # token's aud, the groups claim or the project roles, token use access. Unset is the same preset.
  preset: zitadel
  issuer: ${identity_provider_url}
  jwksURL: ${identity_provider_url}/oauth/v2/keys
  clientIDFile: /etc/room-broker/oidc/client-id
  roomctlClientIDFile: /etc/room-broker/roomctl/client-id
  projectIDFile: /etc/room-broker/oidc/project-id
  origin: https://rooms.${private_domain_name}
  groups:
    admin: agents-admin
    member: agents-member
  # The room page's Dashboards chip (agent-platform v0.29.3): the browser fills {room} and {run}
  # with the room's own ids; a {run} link shows only once the room has a run. v0.29.2's strict
  # decoder refuses this key, so it only ever lands with the v0.29.3 pin.
  dashboards:
    - label: Room metrics
      url: https://grafana.${private_domain_name}/d/agent-room/agent-room?var-room={room}
    - label: Run
      url: https://grafana.${private_domain_name}/d/agent-run/agent-run?var-run={run}
  # D7: room access is the caller's GitHub login, read from the GitHub account link below, then
  # write on the repository asked of GitHub. An account with no link has no access.
  access:
    ttl: 5m
  # The GitHub account link (Maku docs/github-link.md): each human links their GitHub account once
  # on /link/github; it is the only source of a login (Maku v0.50.0 removed the ZITADEL reader and refuses
  # human.access.readerFile).
  # The factory App's OAuth client, its callback https://rooms.${private_domain_name}/link/github/callback,
  # read at use from helmrelease.yaml's optional mount: until externalsecret-github-link.yaml syncs,
  # the broker starts and /link/github answers 503. Not the chart's /etc/room-broker/github-link,
  # whose files v0.48.0 requires at start (helmrelease.yaml says why).
  githubLink:
    clientIDFile: /etc/room-broker/github-link-client/client_id
    clientSecretFile: /etc/room-broker/github-link-client/client_secret
    activeWindow: 168h
  # The governed planner (v3.x conversational intake): intake_plan and plan_check on /mcp, off. Its
  # candidate set is the write check human.access above carries and both tools live on /mcp, so it
  # needs human.mcp.enabled too. repositories is the allowlist a plan may ever name (CD5) and is
  # deliberately not human.mcp.sessionStart; classes is the roles and the money every plan gets, never
  # the model's choice (CD17). The model call goes to agent-gateway/model-gateway's clients
  # listener (:8082), whose route forces tier-frontier to Z.ai glm-5.3, with the projected token
  # helmrelease.yaml's broker.modelGateway mounts (audience maku-gateway.client.planner): no static key.
  intake:
    plan:
      enabled: false            # on in the clouds' copies, for one repository (ADR-0060)
      url: http://model-gateway.agent-gateway.svc.cluster.local:8082/clients/planner/v1
      model: tier-frontier
      apiKeyFile: /var/run/secrets/maku/model-gateway/planner
      deadline: 20s
      reasoningEffort: low       # glm-5.3 always reasons: at its default a plan needs over 20 s (Maku #372)
      dailyPlans: 50
      fallback: "off"
      repositories: [Smana/ai-native-ref, Smana/runlore-kb, Smana/runlore, Smana/cloud-native-ref]      # the public repositories this boundary may plan for
      classes:
        docs-links: {roles: [scoper, implementer, reviewer], ceilingUSD: 2.00, source: "class:docs-links.taskUSD"}
        # docs and scripts are the ai-native-ref classes a plan may suggest (Factory loops: scoper on both,
        # pair template). docs is priced like docs-links; scripts at the standard tier's taskUSD.
        docs: {roles: [scoper, implementer, reviewer], ceilingUSD: 2.00, source: "class:docs.taskUSD"}
        scripts: {roles: [scoper, implementer, reviewer], ceilingUSD: 5.10, source: "class:scripts.taskUSD"}
        review: {roles: [implementer, reviewer], ceilingUSD: 2.00, source: "class:review.taskUSD"}  # cloud-native-ref declares it; the pair template
  # needs/v1 (CD21, CD28): one list, read by /api/needs and by the CLI. Read-only, so it ships on.
  needs:
    enabled: true
  # The developer's MCP server (roomctl mcp, ADR-0059): only roomctl's token and sponsored principals
  # are admitted. sessionStart lists the repositories whose issue_file form offers "start the factory
  # now", applied with the developer's own gh (FA5); none here (D4), a session lists one in its cloud's copy (runbook 19).
  mcp:
    enabled: true
    sessionStart: []
    # Sponsored principals (factory interfaces part 2), none declared (D4): each cloud declares the
    # Slack App in its own copy (runbook 22). It needs factoryURL above, and the same `name` as the
    # factory's api.sponsored entry. clientIDFile is a machine client's id, in the whole-Secret mount
    # helmrelease.yaml adds (room-broker-sponsored), the same id the factory reads:
    # sponsored:
    #   - name: slack-app
    #     clientIDFile: /etc/room-broker/sponsored/slack-app-client-id
# Webhooks (factory interfaces F6), none declared (D4): each cloud declares the Slack App's, in
# its own copy (runbook 22). The event names are the full room.* ones (the broker refuses a short one);
# the key is a file the whole-Secret mount helmrelease.yaml adds provides. A change applies at restart, and
# scripts/ci/gen-webhook-egress.py renders the network rule from the entries (--write).
#
# webhooks:
#   - name: slack-app
#     network: cluster
#     url: http://factory-slack-app.agent-system.svc.cluster.local:8081/webhooks
#     events: [room.task_triaged, room.run_started, room.waiting_for_human, room.pr_opened,
#              room.verdict_posted, room.merged, room.reverted, room.budget_reached, room.ended]
#     secretFile: /etc/room-broker/webhooks/slack-app/signing-key
#     repositories: [Smana/cloud-native-ref]
