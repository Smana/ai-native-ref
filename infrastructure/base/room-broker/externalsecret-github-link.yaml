# The GitHub account link's OAuth client (Maku docs/github-link.md, v4 step 5 ANR follow-up 2): the
# factory App's client id and a client secret GitHub issues, so the owner writes them once:
#   bao kv put -mount=agents github-link client_id=<id> client_secret=-
# Not ready until then. helmrelease.yaml mounts it optional, so the broker starts without it and
# /link/github answers 503 until it syncs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: room-broker-github-link
  namespace: agent-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  target:
    name: room-broker-github-link
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client_id  # pragma: allowlist secret
      remoteRef:
        key: github-link
        property: client_id
    - secretKey: client_secret  # pragma: allowlist secret
      remoteRef:
        key: github-link
        property: client_secret  # pragma: allowlist secret
