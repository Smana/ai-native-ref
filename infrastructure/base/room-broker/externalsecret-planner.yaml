---
# The broker's copy of the planner's client key (CD18): one remote entry, read through the
# store both namespaces can reach. The same value is envoy-ai-gateway-system's
# ai-gateway-planner-key, because the gateway authenticates the call the broker makes.
#
# A namespaced ExternalSecret in each namespace, never a cross-namespace Secret read: a pod
# mounts Secrets from its own namespace only. `openbao-apps` is cluster-scoped, so both copies
# read `apps/planner` through the same identity (agent-system's own store reads the `agents`
# mount, which the gateway cannot reach and which holds no application key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: room-broker-planner
  namespace: agent-system
spec:
  # A key that no longer syncs is a planner that 401s; short enough that a rotation reaches
  # both copies the same hour.
  refreshInterval: 20m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-apps
  data:
    - secretKey: api-key # pragma: allowlist secret
      remoteRef: {key: planner, property: apiKey}
  target:
    name: room-broker-planner
    creationPolicy: Owner
    deletionPolicy: Retain
