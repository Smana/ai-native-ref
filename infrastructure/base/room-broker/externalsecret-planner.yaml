---
# The broker's copy of the planner's client key (CD18). The broker reads it through its own
# namespace's store, `agents-secrets`, so agent-system keeps reading the `agents` mount only
# (S9) — never the cluster-scoped `openbao-apps` the gateway uses.
#
# The VALUE is the same one envoy-ai-gateway-system holds as `ai-gateway-planner-key`: the
# gateway authenticates the call the broker makes, comparing the bearer against its own copy.
# Two stores, one mount each (the vault provider takes exactly one), so the owner writes the
# same value to both entries (`agents/planner` and `apps/planner`, runbook 19 §2.3) — never a
# cross-namespace Secret read, and never a literal.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: room-broker-planner
  namespace: agent-system
spec:
  # A key that no longer syncs is a planner that 401s; short enough that a rotation reaches
  # both copies the same hour.
  refreshInterval: 20m
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  data:
    - secretKey: api-key # pragma: allowlist secret
      remoteRef: {key: planner, property: apiKey}
  target:
    name: room-broker-planner
    creationPolicy: Owner
    deletionPolicy: Retain
