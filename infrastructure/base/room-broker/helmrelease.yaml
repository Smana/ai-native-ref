# The room broker from Maku's `maku` chart (R1, Maku v4 step 6 follow-up 2 and step 5 follow-up 4),
# in place of the App claim. Same image, database, roles, identity, Service name and policies: the
# table in the R1 pull request maps every hand-written object to a value here or an overlay kept
# beside it. Since R3 the chart's run-controller runs the agents: maku.ogenki.io AgentRuns named
# run-<id>, in place of the Crossplane XR.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: room-broker
  namespace: agent-system
spec:
  interval: 30m
  releaseName: room-broker
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: maku
    namespace: agent-system
  # The Room and AgentRun CRDs are agent-factory-crds' (crd-rooms.yaml hands Rooms over). Since Maku
  # v0.49.0 this chart ships no crds/, so Skip is a no-op kept as a guard: two releases never own one.
  # No take-ownership: an object the cut-over left in place fails the install by name instead of
  # being adopted and then pruned by Flux.
  install:
    crds: Skip
    disableTakeOwnership: true
    remediation: {retries: 3}
  upgrade:
    crds: Skip
    disableTakeOwnership: true
    remediation: {retries: 3, remediateLastFailure: true}
  values:
    # The run-controller's run kind (R3). The broker's config.yaml says the same, since it replaces the
    # chart's: test-room-broker-run-kind.py fails when they differ.
    runs:
      group: maku.ogenki.io
      namespace: agents
      namePrefix: run-
    # The namespace is the host's, and so is its Cilium default-deny (agent-runtime).
    createRunsNamespace: false
    # Plain NetworkPolicies (owner ruling Q11): one per run from the run-controller, the egress proxy
    # that holds each run's HTTPS to its own hosts, and the chart's policies for the broker, the
    # controller and the proxy. Cilium enforces them beside the CiliumNetworkPolicies, whose allows
    # add up with theirs: network-policy.yaml stays the broker's own.
    networkPolicies:
      mode: kubernetes
    # The run's sandbox: GKE Sandbox's RuntimeClass on gcp-0, runtimeclass-gvisor's on aws-0.
    sandbox:
      runtimeClassName: gvisor
    # The size of the two ClusterQueues Kueue had before R3 (16 + 8 CPU, 64 + 32Gi, 4 + 4 runs): one
    # run is one pod. Limits leave a small run's 2.15 CPU and 4.1Gi room eight times over.
    runsQuota:
      hard:
        pods: "8"
        requests.cpu: "24"
        requests.memory: 96Gi
        limits.cpu: "32"
        limits.memory: 64Gi
    # Maku's copies of the Kyverno rules R3 deletes (agentrun-one-creator, agentrun-factory-patch-limit):
    # the factory alone creates runs, and patches only its three annotations. Break-glass (a run by
    # hand while the factory is down): `flux suspend helmrelease -n agent-system room-broker`, then
    # `kubectl delete validatingadmissionpolicybinding maku-agent-system-agentrun-creators`; resuming
    # the release puts the binding back.
    agentRunPolicies:
      creators: [system:serviceaccount:agent-system:agent-factory]
      factoryServiceAccount: agent-factory
      namespaces: [agents]
    runController:
      enabled: true
      # maku v0.50.0, by digest, as the broker's image.
      image:
        repository: ghcr.io/smana/maku-run-controller
        tag: "v0.50.0@sha256:14bc88b9b33f76920333a0eddbcb664f1b54b87736e4663447965b733a040b91"
      images:
        harness:
          repository: ghcr.io/smana/maku-harness
          tag: "v0.50.0@sha256:0db6b6f94d441452255298deaa06cefbe1ab1c05eed4caa3673e8cfd504428d9"
        bridge:
          repository: ghcr.io/smana/maku-bridge
          tag: "v0.50.0@sha256:f94b93579e3a3604dd6c85648915986655ba61e1aff8be1ae2b5ba68fbef54b8"
      # Runs call the model gateway (agent-gateway/model-gateway, the maku-gateway release) with their
      # own projected token: no provider key in agents. The aliases are that release's aliases.
      model:
        mode: gateway
        gateway:
          service: model-gateway
          namespace: agent-gateway
          aliases:
            public: [agent-default, tier-light, tier-standard, tier-frontier, kimi-frontier, mistral-standard, mistral-light]
            internal: [agent-default, tier-light, tier-standard, tier-frontier]
      # Each run mounts its own <run>-git Secret, minted by the factory from the agents App
      # (runTokens.perRun in the factory's values): Maku v0.49.0 removed the shared token and its keys
      # (gitTokens, gitReadSecret), so per-run is the only mode.
      # Each run's span, under its task's trace, to the collector's OTLP/HTTP port, which admits run pods.
      tracing:
        otlpEndpoint: http://agent-traces-collector.observability.svc.cluster.local:4318
        collector:
          namespace: observability
          labels: {app.kubernetes.io/name: agent-traces-collector, app.kubernetes.io/instance: agent-traces}
    broker:
      image:
        repository: ghcr.io/smana/maku-broker
        # maku v0.50.0, by digest. Move it with ocirepository.yaml (the chart), crd-rooms.yaml and
        # sqlinstance.yaml's atlasSchema.ref together.
        tag: "v0.50.0@sha256:23709ecda22ed61d1af4456fa27340bef65810d7f20205cd88de12d26976c2d0"
      # Two (§9): the leader lease picks the controller, and every replica serves humans through the
      # LISTEN/NOTIFY hub (ruling AT). pdb.yaml keeps one through a drain.
      replicas: 2
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: 500m, memory: 256Mi}
      publicURL: https://rooms.${private_domain_name}
      # A run's token is checked by the apiserver (TokenReview, through system:auth-delegator), on :8443
      # and on :8090. The broker reads config.yaml (below), which says the same.
      runIssuer:
        mode: tokenreview
      factoryURL: http://agent-factory.agent-system.svc.cluster.local:8082
      factoryInsecure: true
      # The composition's roles (step 5 follow-up 4). The owner's DSN turns on the migrate init
      # container: it adopts the Atlas operator's ledger and grants rooms_broker its read, which Maku
      # v0.49.0's broker requires at start (an unreadable ledger is refused). Its Secret is the
      # database owner's (xplane-rooms-cnpg-rooms, user rooms_owner).
      database:
        ownerSecret: xplane-rooms-cnpg-rooms  # pragma: allowlist secret
        brokerSecret: xplane-rooms-cnpg-role-rooms-broker  # pragma: allowlist secret
        retentionSecret: xplane-rooms-cnpg-role-rooms-retention  # pragma: allowlist secret
        secretKey: uri  # pragma: allowlist secret
        # CNPG's CA, mounted for sslmode=verify-full; the composition's DSNs keep their sslmode.
        caSecret: xplane-rooms-cnpg-cluster-ca  # pragma: allowlist secret
      retention:
        schedule: "17 3 * * *"
      # tls.yaml's Certificate fills it (no issuerRef here: the chart then renders none).
      tls:
        secretName: room-broker-tls  # pragma: allowlist secret
        # The run-controller's copy of the CA that signs room-broker-tls (ca.crt only): agent-secrets'
        # openbao-ca, the chain the factory trusts too.
        caSecretName: openbao-ca  # pragma: allowlist secret
      # :8090 verifies each run's own token (R3): the chart opens it on the Service and hands the
      # run-controller its URL. agent-router's federation no longer reaches it (owner ruling Q12).
      roomTools:
        enabled: true
        auth: tokenreview
        # RunLore's knowledge base for triager runs (Maku EX11), as config.yaml's roomTools.knowledge.
        # The chart's NetworkPolicy opens the broker's egress to RunLore's pods on 8080; network-policy.yaml
        # says the same, and RunLore's ingress admits room-broker (host contract H8).
        knowledge:
          url: http://runlore.runlore.svc.cluster.local:8080/mcp
          tools: [kb_search, kb_get]
          roles: [triager]
          networkPolicy:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: runlore
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: runlore
      # The planner's model call (v4 step 4, ANR follow-up 3): model-gateway's clients listener, with a
      # projected token per client (audience maku-gateway.client.planner, 3600 s, re-read at each call),
      # mounted at /var/run/secrets/maku/model-gateway. config.yaml's human.intake.plan names that URL and
      # token, since it replaces the chart's config: test-room-broker-run-kind.py fails when they differ.
      # The chart's NetworkPolicy reaches the gateway's pods on 8082; network-policy.yaml says the same.
      modelGateway:
        service: model-gateway
        namespace: agent-gateway
        port: 8082
        audiencePrefix: maku-gateway
      extraEnv:
        # The factory App's key (verdict comments, §3). Empty until the owner writes it.
        - name: ROOMS_GITHUB_APP_DIR
          value: /var/run/secrets/factory-app
      # config is the generated room-broker-config-<hash> (kustomizeconfig.yaml rewrites the name), so
      # a config change rolls the pods; postRenderers below drop the chart's own config volume.
      # The rest are the App claim's mounts, unchanged: each file is re-read at use, and each optional
      # Secret is inert until it exists. 0440 is readable through the pod's fsGroup.
      extraVolumes:
        - name: config
          configMap: {name: room-broker-config}
        - name: oidc
          secret: {secretName: room-broker-oidc}  # pragma: allowlist secret
        - name: factory-app
          secret: {secretName: room-broker-factory-app, optional: true, defaultMode: 0440}  # pragma: allowlist secret
        - name: roomctl
          secret: {secretName: room-broker-roomctl, optional: true}  # pragma: allowlist secret
        - name: sponsored
          secret: {secretName: room-broker-sponsored, optional: true, defaultMode: 0440}  # pragma: allowlist secret
        - name: webhook-slack-app
          secret: {secretName: room-broker-webhook-slack-app, optional: true, defaultMode: 0440}  # pragma: allowlist secret
        - name: webhook-runlore
          secret: {secretName: room-broker-webhook-runlore, optional: true, defaultMode: 0440}  # pragma: allowlist secret
        # The GitHub link's OAuth client (externalsecret-github-link.yaml), not through
        # broker.githubLink.existingSecret: v0.48.0 refuses to start when a file under the chart's
        # /etc/room-broker/github-link mount is missing, and mounts that Secret non-optional, so an
        # unwritten OpenBao key would stop the rollout. Here it is read at use (a 503 on /link/github
        # until it exists), and the chart adds no any-public-address :443 NetworkPolicy egress beside
        # network-policy.yaml's github.com and api.github.com.
        - name: github-link
          secret: {secretName: room-broker-github-link, optional: true, defaultMode: 0440}  # pragma: allowlist secret
      extraVolumeMounts:
        - {name: oidc, mountPath: /etc/room-broker/oidc, readOnly: true}
        - {name: factory-app, mountPath: /var/run/secrets/factory-app, readOnly: true}
        - {name: roomctl, mountPath: /etc/room-broker/roomctl, readOnly: true}
        - {name: sponsored, mountPath: /etc/room-broker/sponsored, readOnly: true}
        - {name: webhook-slack-app, mountPath: /etc/room-broker/webhooks/slack-app, readOnly: true}
        - {name: webhook-runlore, mountPath: /etc/room-broker/webhooks/runlore, readOnly: true}
        - {name: github-link, mountPath: /etc/room-broker/github-link-client, readOnly: true}
  # What v0.50.0's values cannot say. Each patch tests what it replaces, so a chart that moves it
  # fails the release instead of patching the wrong field.
  postRenderers:
    - kustomize:
        patches:
          # config.yaml stays this repository's file: the chart's ConfigMap carries no top-level
          # policyManagement, webhooks or coordination. The chart's config volume (the first)
          # goes; the generated one in extraVolumes takes its name and mount.
          - target: {kind: Deployment, name: room-broker}
            patch: |-
              - op: test
                path: /spec/template/spec/volumes/0/configMap/name
                value: room-broker-config
              - op: remove
                path: /spec/template/spec/volumes/0
          - target: {kind: ConfigMap, name: room-broker-config}
            patch: |-
              $patch: delete
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: room-broker-config
          # No patch on AgentRuns: the chart grants it for the suspend trigger, which this platform does
          # not run (owner ruling Q10).
          - target: {kind: Role, name: room-broker, namespace: agents}
            patch: |-
              - op: test
                path: /rules/0/verbs
                value: [get, list, watch, delete, patch]
              - op: replace
                path: /rules/0/verbs
                value: [get, list, watch, delete]
