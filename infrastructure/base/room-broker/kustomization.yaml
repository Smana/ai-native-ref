apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The room broker (SP2): the log of record for every AgentRun with a roomRef.
resources:
  - crd-rooms.yaml
  - tls.yaml
  # The broker itself, from Maku's chart (R1): its Deployment, Service, ServiceAccount, RBAC and
  # retention CronJob. pdb.yaml and the policies below are this repository's overlays.
  - ocirepository.yaml
  - helmrelease.yaml
  - pdb.yaml
  - network-policy.yaml
  - network-policy-webhooks.yaml
  - sqlinstance.yaml
  - network-policy-cnpg.yaml
  - vmservicescrape.yaml
  - externalsecret-rooms-proxy.yaml
  - externalsecret-roomctl.yaml
  - oauth2-proxy.yaml
  - network-policy-oauth2-proxy.yaml
  - httproute.yaml
  - externalsecret-factory-app.yaml
  - externalsecret-zitadel-reader.yaml
  # The planner's client key (CD18), mounted by helmrelease.yaml.
  - externalsecret-planner.yaml

# The broker reads its config once at startup, so the ConfigMap is generated: a change
# moves the content-hash suffix, the HelmRelease's volume reference follows it through
# kustomizeconfig.yaml, and the chart's Deployment rolls (#2274). Flux substitutes
# after the build, so a change in a cluster variable alone does not roll it.
configMapGenerator:
  - name: room-broker-config
    namespace: agent-system
    files:
      - config.yaml
configurations:
  - kustomizeconfig.yaml
