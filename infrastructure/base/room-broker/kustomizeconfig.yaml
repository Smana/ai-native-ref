# Kustomize rewrites generated names only in the built-in kinds' fields. The HelmRelease is a CRD:
# without this, its config volume keeps the bare name and a config change rolls nothing.
nameReference:
  - kind: ConfigMap
    version: v1
    fieldSpecs:
      - kind: HelmRelease
        group: helm.toolkit.fluxcd.io
        path: spec/values/broker/extraVolumes/configMap/name
