---
# The room broker (SP2 §9). Default deny; one allow per flow. It listens on :8443
# (bridges, system API), :8080 (humans), :8090 (agents' room tools) and :9090
# (metrics, probes). The chart's NetworkPolicy room-broker (networkPolicies.mode kubernetes)
# selects the same pods; Cilium adds the two policies' allows up.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: room-broker
  namespace: agent-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: room-broker
  ingress:
    # Run bridges on :8443, and the harnesses' room tools on :8090 (R3: roomTools.auth tokenreview,
    # each call carrying the run's own token, which the broker asks the apiserver about).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agents
          matchExpressions:
            - key: agents.ogenki.io/run-id
              operator: Exists
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
            - port: "8090"
              protocol: TCP
    # SP3's factory: the system API (reads the log, appends task_state).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agent-system
            app.kubernetes.io/name: agent-factory
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    # Humans, through oauth2-proxy only (§9).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agent-system
            app.kubernetes.io/name: oauth2-proxy
            app.kubernetes.io/instance: rooms-oauth2-proxy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The Slack App's /mcp calls as a sponsored principal (R13). Dormant: no pod carries the label
    # until a gcp-0 session applies tooling/*/agent-factory/slack-app (runbook 18).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agent-system
            app.kubernetes.io/name: factory-slack-app
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Kubelet's probes.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # The Room and AgentRun watches, the leader lease, and the run tokens' TokenReviews (R3).
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agent-system
            cnpg.io/cluster: xplane-rooms-cnpg-cluster
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:  # the factory's run-request API (SP2 §9)
        - matchLabels:
            io.kubernetes.pod.namespace: agent-system
            app.kubernetes.io/name: agent-factory
      toPorts:
        - ports: [{port: "8082", protocol: TCP}]
    # The run issuer's JWKS, fetched at start (an unreachable issuer fails the
    # rollout) and hourly after (ruling P11). The host is per cloud (GCP parity GP-12).
    - toFQDNs:
        - matchName: ${oidc_jwks_host}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # ZITADEL: JWKS for the ID and access tokens humans present, and (D7) the
    # ListIDPLinks API for the room-access check. Keep it open to the whole host if
    # this is ever tightened to L7. gcp-0's overlay
    # replaces this rule: its own Gateway VIP refuses any toPorts (ruling AU).
    - toFQDNs:
        - matchName: "auth.${public_domain_name}"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # api.github.com: agents' review verdicts as the factory App's PR comments (SP2 design §3).
    # Also (D7): GET /user/{id} and the collaborator-permission API for room access.
    - toFQDNs:
        - matchName: api.github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # The planner's one model call (CD18), to the AI Gateway data-plane pods directly, as OpenWebUI
    # and the nightly eval do. toEndpoints selects PODS: the Service name matches nothing, and the
    # four labels are the data-plane policy's own endpointSelector. The data plane's policy carries
    # the other half: either alone refuses. Appended last on purpose — gcp-0's overlay patches
    # /spec/egress/5 by index, so a rule inserted above it would edit the wrong one.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/managed-by: envoy-gateway
            app.kubernetes.io/component: proxy
            gateway.envoyproxy.io/owning-gateway-name: ai-gateway
            gateway.envoyproxy.io/owning-gateway-namespace: envoy-ai-gateway-system
      toPorts:
        - ports: [{port: "8080", protocol: TCP}]
---
# The retention job reaches the log and nothing else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: room-broker-retention
  namespace: agent-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: room-broker-retention
  # An empty rule selects no peer: ingress enforcement on, nothing allowed (the
  # agents default-deny idiom, SP1).
  ingress:
    - {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agent-system
            cnpg.io/cluster: xplane-rooms-cnpg-cluster
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
