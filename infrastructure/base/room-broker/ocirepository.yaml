# Maku's broker chart (R1): the room broker, rendered from charts/maku instead of the hand-written
# App claim. Here rather than flux/sources, beside the one HelmRelease it feeds (as agentgateway's):
# flux/sources is the host's list. Same signing identity as flux/sources/ocirepo-agent-factory.yaml;
# move both tags together.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: maku
  namespace: agent-system
spec:
  interval: 12h
  url: oci://ghcr.io/smana/charts/maku
  # Flux pulls the digest (it wins over the tag), so a re-pushed tag changes nothing. The tag
  # stays for Renovate and for readers.
  ref:
    tag: "0.49.0"  # maku v0.49.0
    digest: sha256:e522b1bf46d446234350971af056e584de83707919f6ece046a8ff8fd3c13485
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: "^https://token\\.actions\\.githubusercontent\\.com$"
        subject: "^https://github\\.com/Smana/maku/\\.github/workflows/release\\.yaml@refs/tags/v.*$"
