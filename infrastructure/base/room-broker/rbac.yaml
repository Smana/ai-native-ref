---
# Exactly the verbs the broker calls (agent-platform internal/roomctrl, internal/humanapi and
# controller-runtime's leader election): the Room controller reads Rooms, updates their
# finalizer and merge-patches their status; the human API creates a Room for "new room" and
# a fork, and updates one for an act. It never deletes a Room. Without create the web view
# answers 503, which the broker does not log.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: room-broker
  namespace: agent-system
rules:
  - apiGroups: ["maku.ogenki.io"]
    resources: ["rooms"]
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups: ["maku.ogenki.io"]
    resources: ["rooms/status"]
    verbs: ["patch"]
  - apiGroups: ["maku.ogenki.io"]
    resources: ["rooms/finalizers"]
    verbs: ["update"]
  # Leader election: a Lease, and the core Events its recorder emits.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: room-broker
  namespace: agent-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: room-broker
subjects:
  - kind: ServiceAccount
    name: room-broker
    namespace: agent-system
---
# AgentRuns: watch, and delete when their Room is deleted. NEVER create: only the
# factory creates runs (C3), and SP3's Kyverno rule denies everyone else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: room-broker
  namespace: agents
rules:
  - apiGroups: ["cloud.ogenki.io"]
    resources: ["agentruns"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: room-broker
  namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: room-broker
subjects:
  - kind: ServiceAccount
    name: room-broker
    namespace: agent-system
