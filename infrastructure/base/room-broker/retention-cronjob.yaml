# Daily purge of rooms closed longer ago than their retention (SP2 §4, OD-17).
# DELETE-only: it connects as rooms_retention, whose row-level security exposes
# nothing else.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: room-broker-retention
  namespace: agent-system
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Above one room's 10 min purge statement_timeout (agent-platform#107), or a slow purge is
      # killed by Kubernetes before Postgres can report it.
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: room-broker-retention
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retention
              # The same pin as app.yaml's.
              image: ghcr.io/smana/maku-broker:v0.32.0@sha256:57262e4909ed7ccf0a0a0b4a85bd155fc35b43120860ba373d3da7875890e42c
              args: ["retention"]
              env:
                - name: ROOMS_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: xplane-rooms-cnpg-role-rooms-retention
                      key: uri
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
