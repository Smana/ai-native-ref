# The room log of record (SP2 §4). Standalone, not an App sub-block: only the
# standalone XRD has objectStoreRecovery (ruling P8).
apiVersion: cloud.ogenki.io/v1alpha1
kind: SQLInstance
metadata:
  annotations:
    # S3 handover (AI split S3.0): the object changes owner, so neither side may prune it.
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: xplane-rooms
  namespace: agent-system
spec:
  instances: 1
  size: small
  storageSize: 20Gi
  postgresVersion: "18"
  # Generated in-cluster, never seeded (ruling P7).
  credentials:
    source: generated
  databases:
    - name: rooms
      owner: rooms_owner
  roles:
    - name: rooms_owner
      comment: Owns the schema; Atlas migrates as it
      superuser: false
    - name: rooms_broker
      comment: The broker appends to and reads the log, nothing else (SC-10)
      superuser: false
    - name: rooms_retention
      comment: The retention job deletes rooms closed past their retention
      superuser: false
  atlasSchema:
    url: https://github.com/Smana/maku
    # A v* ref resolves as a tag, anything else as a branch, never a SHA: the release tag
    # of the broker image, so the schema and the binary match.
    ref: v0.31.0
    path: internal/store/migrations
  # The next bootstrap restores the last teardown's log; `bootstrap` is immutable once
  # the Cluster exists. `rooms-pre-destroy` is the alias the host's destroy hook
  # (cnref scripts/ops/k8s/cnpg-pre-destroy-seed.sh, every SQLInstance with `backup`)
  # refreshes only after a fresh dated seed verifies, as zitadel-pre-destroy. An empty
  # prefix fails the bootstrap instead of starting fresh, so a cloud whose bucket has
  # no alias yet removes this block (gcp-0 overlay). The new generation archives into
  # its own uid-keyed prefix, so the restore never writes into the seed.
  # Drill: docs/runbooks/agent-factory/13-rooms-restore.md.
  objectStoreRecovery:
    bucketName: "${region}-ogenki-cnpg-backups"
    path: rooms-pre-destroy
  backup:
    # SIX fields, seconds first: CNPG uses robfig/cron (security/base/zitadel/sqlinstance.yaml).
    schedule: "0 0 2 * * *"
    bucketName: "${region}-ogenki-cnpg-backups"
  crossplane:
    compositionRef:
      name: xsqlinstances.cloud.ogenki.io
