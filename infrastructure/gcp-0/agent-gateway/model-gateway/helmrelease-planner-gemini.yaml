# TEST WINDOW ONLY (Gemini design L2, plan B5; runbook 30): the broker's planner on Gemini 4 Neon
# through Vertex AI, to measure its latency against the 20 s deadline and its plans against Z.ai's.
# Merge it just before L2 and revert this file and its line in kustomization.yaml right after.
# Base keeps Z.ai glm-5.3. The planner sends reasoning_effort low, which the vertex preset turns
# into thinkingLevel low; max_tokens 4000 counts the thinking too.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: model-gateway
  namespace: agent-gateway
spec:
  values:
    clients:
      planner: {enabled: true, provider: vertex, model: gemini-4-neon}
