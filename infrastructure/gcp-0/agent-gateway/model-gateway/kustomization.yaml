apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A render root per cloud (GCP parity GP-14) over the shared base.
resources:
  - ../../../base/agent-gateway/model-gateway
  # The proxy's Google identity, for Gemini on Vertex AI (Gemini design G1).
  - workloadidentity.yaml

patches:
  # Gemini on Vertex AI: the vertex provider, its two public aliases and their prices.
  - path: helmrelease-vertex.yaml
  # TEST WINDOW ONLY: the planner on Neon (runbook 30, L2). Revert this line and its file after L2.
  - path: helmrelease-planner-gemini.yaml
