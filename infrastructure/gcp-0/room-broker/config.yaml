# gcp-0's copy of ../../base/room-broker/config.yaml, plus suspend, human.mcp.sponsored,
# human.slackLink, human.slackDecide and sessionStart (runbooks 18, 19) and webhooks (runbook 18): the overlay's generator replaces the base
# file, since a ConfigMap key is one string no patch can extend.
# test-room-broker-suspend.py fails when it differs from base in anything but those.
# The broker's one config file (agent-platform internal/config), Flux-substituted.
# Decoded strictly: an unknown key fails the rollout. tls is left to its default,
# /etc/room-broker/tls/tls.{crt,key}, where app.yaml mounts room-broker-tls.
# The broker reads it once at startup: kustomization.yaml's configMapGenerator rolls
# the pods on a change.
publicURL: https://rooms.${private_domain_name}
# The only run issuer today is this cluster's (C2 r5). A runtime with its own
# workload JWTs is one more entry here, not a new code path. The JWKS URI is
# per cloud: <issuer>/keys on EKS, <issuer>/jwks on GKE (GCP parity GP-12).
runIssuers:
  - issuer: ${oidc_issuer_url}
    jwksURL: ${oidc_jwks_uri}
    subPattern: '^system:serviceaccount:agents:xplane-run-([a-z2-7]{8})$'
# System callers present audience rooms-system (ruling P3).
systemIssuer:
  issuer: ${oidc_issuer_url}
  jwksURL: ${oidc_jwks_uri}
# SP3's factory (FR-1): system callers present audience rooms-system (ruling P3).
systemPrincipals:
  system:serviceaccount:agent-system:agent-factory: system:factory
# SP3 phase 5: runs for hand to role, fork and add agent come from the factory, with the
# human's own token; the broker no longer renders a claim for the owner (C3).
factoryURL: http://agent-factory.agent-system.svc.cluster.local:8082
# Merge policy stage 6: the settings pages (policy editor, evidence, promotion records) and
# their API, read with the factory's own key. They change no class: a maintainer's pull
# request does. Operators approve a promotion exception below the evidence minimum.
policyManagement: {promotion: true, operators: [Smana]}
# The hop stays plain HTTP, as it was. Maku v0.33.0 requires that to be stated (it forwards each human's token
# here); TLS follows in its own change.
factoryInsecure: true
# Humans, through oauth2-proxy (phase 2). Required by the broker. The ids are
# files, never literals: gcp-0 mints a fresh ZITADEL every build (ruling AS-a).
human:
  issuer: ${identity_provider_url}
  jwksURL: ${identity_provider_url}/oauth/v2/keys
  clientIDFile: /etc/room-broker/oidc/client-id
  roomctlClientIDFile: /etc/room-broker/roomctl/client-id
  projectIDFile: /etc/room-broker/oidc/project-id
  origin: https://rooms.${private_domain_name}
  groups:
    admin: agents-admin
    member: agents-member
  # The room page's Dashboards chip (agent-platform v0.29.3): the browser fills {room} and {run}
  # with the room's own ids; a {run} link shows only once the room has a run. v0.29.2's strict
  # decoder refuses this key, so it only ever lands with the v0.29.3 pin.
  dashboards:
    - label: Room metrics
      url: https://grafana.${private_domain_name}/d/agent-room/agent-room?var-room={room}
    - label: Run
      url: https://grafana.${private_domain_name}/d/agent-run/agent-run?var-run={run}
  # D7: room access is read from GitHub-link ZITADEL grants. v0.7.x's strict decoder
  # refuses this key, so it only ever lands with the v0.8.0 pin.
  access:
    readerFile: /etc/room-broker/zitadel-reader/reader.json
    ttl: 5m
  # The governed planner (v3.x conversational intake, ADR-0060): intake_plan and plan_check on /mcp,
  # on here and in aws-0's copy, off in base's. Its candidate set is the write check human.access
  # above carries and both tools live on /mcp, so it needs human.mcp.enabled too (on, below).
  # repositories is the allowlist a plan may ever name (CD5) and is deliberately not
  # human.mcp.sessionStart; classes is the roles and the money every plan gets, never the model's
  # choice (CD17). The key is the one app.yaml mounts at /etc/room-broker/planner.
  intake:
    plan:
      enabled: true             # on here and in aws-0's copy (ADR-0060), for the repository below
      url: http://ai-gateway.envoy-gateway-system.svc.cluster.local:8080/v1
      model: tier-frontier
      apiKeyFile: /etc/room-broker/planner/api-key
      deadline: 20s
      reasoningEffort: low       # glm-5.3 always reasons: at its default a plan needs over 20 s (Maku #372)
      dailyPlans: 50
      fallback: "off"
      repositories: [Smana/ai-native-ref, Smana/runlore-kb, Smana/runlore]      # the public repositories this boundary may plan for
      classes:
        docs-links: {roles: [scoper, implementer, reviewer], ceilingUSD: 2.00, source: "class:docs-links.taskUSD"}
        # docs and scripts are the ai-native-ref classes a plan may suggest (Factory loops: scoper on both,
        # pair template). docs is priced like docs-links; scripts at the standard tier's taskUSD.
        docs: {roles: [scoper, implementer, reviewer], ceilingUSD: 2.00, source: "class:docs.taskUSD"}
        scripts: {roles: [scoper, implementer, reviewer], ceilingUSD: 5.10, source: "class:scripts.taskUSD"}
  # needs/v1 (CD21, CD28): one list, read by /api/needs and by the CLI. Read-only, so it ships on.
  needs:
    enabled: true
  # The developer's MCP server (base's copy says why). sessionStart is a session switch: a live
  # session lists the one repository runbook 19 (or the showcase, runbook 23) starts from, and empties
  # it after; sponsored declares the Slack App (runbook 18): the same name as the factory's
  # api.sponsored entry (helm-values-sponsored.yaml), and the client id its whole-Secret mount holds.
  mcp:
    enabled: true
    sessionStart: []
    sponsored:
      - name: slack-app
        clientIDFile: /etc/room-broker/sponsored/slack-app-client-id
  # The Slack self-serve link (agent-platform v0.29.9, docs/slack.md): `@factory link` mints a code, the
  # signed-in human confirms it on /link/slack. The principal is human.mcp.sponsored's slack-app, the team
  # the App's own, the repository the one whose GitHub App installation names the account's login. Needs
  # human.access above. The factory's side is onBehalfOf.slackLinks (helm-values-sponsored.yaml).
  slackLink:
    principal: slack-app
    teamID: T07J97G2K2P
    repository: Smana/ai-native-ref
  # The App's one deciding route (v3.x Slack push approval D14, Maku v0.36.0): a forge.push approval
  # is decidable from its card, resolved to the linked human's room standing and repository write. The
  # principal is human.mcp.sponsored's slack-app, the team the App's own. Needs human.access. Off: the
  # path is a 404 and a card's press answers unavailable.
  slackDecide:
    principal: slack-app
    teamID: T07J97G2K2P
# v2 suspend (warm-sandboxes S3): a suspendable run in an attended room whose approval has
# waited this long in an idle room is suspended, and resumed once nothing waits. It patches
# through the room-broker-suspend grant, fenced by Kyverno's agentrun-broker-patch-limit.
suspend:
  enabled: true
  after: 5m
# Webhooks (factory interfaces F6): the Slack App's state lines. Full room.* event names, the key is
# the whole-Secret mount app.yaml adds (room-broker-webhook-slack-app, generated in the cluster). The
# egress rule is infrastructure/gcp-0/room-broker/network-policy-webhooks-patch.yaml, generated by
# scripts/ci/gen-webhook-egress.py --write.
webhooks:
  - name: slack-app
    network: cluster
    url: http://factory-slack-app.agent-system.svc.cluster.local:8081/webhooks
    events: [room.task_triaged, room.waiting_for_human, room.pr_opened, room.verdict_posted, room.merged, room.reverted, room.budget_reached, room.ended, room.approval_closed]
    secretFile: /etc/room-broker/webhooks/slack-app/signing-key
    repositories: [Smana/ai-native-ref, Smana/cloud-native-ref]
    # One more than before room.approval_closed: a subscriber the emitter disabled stays disabled until
    # this changes (Maku docs/operations.md, "Disabled subscribers"). Hand-kept; the generator leaves it.
    generation: 1
  # RunLore follows its incidents' tasks (feature 14, RA7): every event of the repository; it drops rooms
  # its ledger does not know. Its key is externalsecret-webhook-runlore.yaml, the owner's seed (runbook 14).
  - name: runlore
    network: cluster
    url: http://runlore.runlore.svc.cluster.local:8080/factory/webhook
    events: [room.task_received, room.task_triaged, room.run_started, room.run_ended, room.waiting_for_human,
             room.pr_opened, room.verdict_posted, room.merged, room.reverted, room.monitor_verdict,
             room.budget_reached, room.ended]
    secretFile: /etc/room-broker/webhooks/runlore/signing-key
    repositories: [Smana/cloud-native-ref]
