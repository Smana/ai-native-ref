apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The room broker on gcp-0, and a render root of its own so CI renders it with
# gcp-0's fixture values, not AWS's. Cloud-shaped: the claim's composition and backup
# bucket (as security/gcp-0/zitadel), and the CNP's credential endpoint (GKE's, not
# EKS Pod Identity: security/AGENTS.md trap 3) and object-store hosts.
resources:
  - ../../base/room-broker
  - externalsecret-webhook-runlore.yaml

# This config.yaml is base's plus human.mcp.sponsored, the Slack links, and webhooks.
configMapGenerator:
  - name: room-broker-config
    namespace: agent-system
    behavior: replace
    files:
      - config.yaml

patches:
  # The webhook egress, generated from config.yaml's webhooks: scripts/ci/gen-webhook-egress.py --write.
  - path: network-policy-webhooks-patch.yaml
  - target:
      group: cloud.ogenki.io
      kind: SQLInstance
      name: xplane-rooms
    patch: |-
      - op: replace
        path: /spec/crossplane/compositionRef/name
        value: xsqlinstances-gcp.cloud.ogenki.io
      - op: replace
        path: /spec/backup/bucketName
        value: ${project_id}-ogenki-cnpg-backups
      # No rooms-pre-destroy in the GCS bucket yet, and an empty recovery prefix fails the
      # bootstrap instead of starting fresh (as tooling/gcp-0/harbor in the host). Once a
      # gcp-0 teardown has seeded it, opt in: runbook 13, Step A0.
      - op: remove
        path: /spec/objectStoreRecovery
  # `test` pins the indices: a reordered base fails the build instead of patching the
  # wrong rule.
  - target:
      group: cilium.io
      kind: CiliumNetworkPolicy
      name: xplane-rooms-cnpg
    patch: |-
      - op: test
        path: /spec/egress/4/toEntities/0
        value: host
      - op: replace
        path: /spec/egress/4
        value:
          toCIDR:
            - 169.254.169.254/32
          toPorts:
            - ports:
                - port: "80"
                  protocol: TCP
      - op: test
        path: /spec/egress/5/toFQDNs/0/matchName
        value: s3.${region}.amazonaws.com
      - op: replace
        path: /spec/egress/5/toFQDNs
        value:
          - matchName: storage.googleapis.com
          - matchPattern: "*.storage.googleapis.com"
  # ZITADEL on gcp-0 is this cluster's own Gateway VIP: Envoy enforces policy on
  # its runtime listener port, so any toPorts fails (ruling AU; measured in
  # tooling/gcp-0/headlamp/network-policy.yaml).
  - target:
      group: cilium.io
      kind: CiliumNetworkPolicy
      name: rooms-oauth2-proxy
    patch: |-
      - op: test
        path: /spec/egress/1/toFQDNs/0/matchName
        value: auth.${public_domain_name}
      - op: replace
        path: /spec/egress/1
        value:
          toEntities:
            - all
  - target:
      group: cilium.io
      kind: CiliumNetworkPolicy
      name: room-broker
    patch: |-
      - op: test
        path: /spec/egress/5/toFQDNs/0/matchName
        value: auth.${public_domain_name}
      - op: replace
        path: /spec/egress/5
        value:
          toEntities:
            - all
  # Gemini on Vertex AI (Gemini design G6, G7): the model gateway serves its two aliases on gcp-0's
  # public listener (infrastructure/gcp-0/agent-gateway/model-gateway), so the run-controller may
  # mint a public run's token for them. Never internal, never a default. `test` pins the list.
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: room-broker
    patch: |-
      - op: test
        path: /spec/values/runController/model/gateway/aliases/public/6
        value: mistral-light
      - op: add
        path: /spec/values/runController/model/gateway/aliases/public/-
        value: gemini-standard
      - op: add
        path: /spec/values/runController/model/gateway/aliases/public/-
        value: gemini-light
      # Both Gemini aliases answered drill D0's red image (2026-11-27), so their runs see screenshots.
      - op: test
        path: /spec/values/runController/model/gateway/vision/public/4
        value: mistral-standard
      - op: add
        path: /spec/values/runController/model/gateway/vision/public/-
        value: gemini-standard
      - op: add
        path: /spec/values/runController/model/gateway/vision/public/-
        value: gemini-light
      # Each Gemini alias's rates for OpenHands' own cost counter (Maku plan A6), its served model's
      # meter.prices row: otherwise the harness prices every model as GLM. The meter settles the run.
      - op: add
        path: /spec/values/runController/model/gateway/prices
        value:
          gemini-standard: {input: "3.3", output: "16.5"}
          gemini-light: {input: "1.65", output: "8.25"}
