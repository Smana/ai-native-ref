apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: agent-factory
  namespace: observability
spec:
  allowCrossNamespaceImport: true
  folderRef: "agents"
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  json: |
    {
      "title": "Agent factory",
      "uid": "agent-factory",
      "tags": ["agents"],
      "schemaVersion": 39,
      "time": {"from": "now-7d", "to": "now"},
      "links": [{"title": "Agents", "type": "dashboards", "tags": ["agents"], "asDropdown": false, "includeVars": true, "keepTime": true, "icon": "dashboard", "tooltip": "Every dashboard of the Agents folder: overview, fleet, factory, gateway, identity, room, run"}],
      "templating": {"list": [{"name": "datasource", "type": "datasource", "query": "prometheus"}]},
      "panels": [
        {"id": 1, "type": "timeseries", "title": "Tasks by phase", "description": "How many tasks sit in each factory phase over time; AwaitingHuman and Escalated hold the awaiting-human slots.", "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "expr": "sum by (phase) (agent_factory_tasks)", "legendFormat": "{{phase}}"}]},
        {"id": 2, "type": "stat", "title": "Time to PR, p50 (SC-1: ≤ 30 min)", "description": "Median time from a task's creation to its pull request, light and standard tiers, over 7 days. Red past 30 minutes (SC-1).", "gridPos": {"x": 12, "y": 0, "w": 6, "h": 8},
         "fieldConfig": {"defaults": {"unit": "s", "noValue": "no PR yet", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1800}]}}, "overrides": []},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "expr": "histogram_quantile(0.5, sum by (le) (increase_pure(agent_factory_time_to_pr_seconds_bucket{tier=~\"light|standard\"}[7d])))"}]},
        {"id": 3, "type": "stat", "title": "Reverted after auto-merge (SC-11: ≤ 5 %)", "description": "Reverts over auto-merges, 30 days. Red from 5 % (SC-11). 0 when nothing was reverted.", "gridPos": {"x": 18, "y": 0, "w": 6, "h": 8},
         "fieldConfig": {"defaults": {"unit": "percentunit", "noValue": "0", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 0.05}]}}, "overrides": []},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "expr": "(sum(increase_pure(agent_factory_pr_outcomes_total{outcome=\"reverted\"}[30d])) or vector(0)) / clamp_min(sum(increase_pure(agent_factory_pr_outcomes_total{outcome=\"auto_merged\"}[30d])) or vector(0), 1)"}]},
        {"id": 4, "type": "timeseries", "title": "PR outcomes by class", "description": "Outcomes the factory recorded for its pull requests per day, by task class: auto_merged, human_merged, reverted, closed.", "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
         "fieldConfig": {"defaults": {"noValue": "0"}, "overrides": []},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "expr": "sum by (class, outcome) (increase_pure(agent_factory_pr_outcomes_total[1d]))", "legendFormat": "{{class}} {{outcome}}"}]},
        {"id": 5, "type": "timeseries", "title": "Tokens per finished task, p90", "description": "90th percentile of the tokens a finished task used, per day, by tier and template: the budget calibration signal.", "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "expr": "histogram_quantile(0.9, sum by (le, tier, template) (increase_pure(agent_factory_task_tokens_bucket[1d])))", "legendFormat": "{{tier}} {{template}}"}]},
        {"id": 6, "type": "bargauge", "title": "Budget left today", "description": "Remaining over cap of each ledger key's day (UTC). Red under 10 %, orange under 25 %. A bar opens that principal's spend page.", "gridPos": {"x": 0, "y": 16, "w": 8, "h": 8},
         "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1, "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 0.1}, {"color": "green", "value": 0.25}]},
           "links": [{"title": "Spend per identity", "url": "/d/agent-identity/agent-identity?var-principal=$${__field.labels.principal}&$${__url_time_range}"}]}, "overrides": []},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "expr": "agent_factory_budget_remaining_usd / agent_factory_budget_cap_usd", "legendFormat": "{{principal}}"}]},
        {"id": 7, "type": "timeseries", "title": "Human interventions (how dark is it?)", "description": "Times a human had to step in, per day by kind: the lower, the darker (more autonomous) the factory.", "gridPos": {"x": 8, "y": 16, "w": 8, "h": 8},
         "fieldConfig": {"defaults": {"noValue": "0"}, "overrides": []},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "expr": "sum by (kind) (increase_pure(agent_factory_human_interventions_total[1d]))", "legendFormat": "{{kind}}"}]},
        {"id": 8, "type": "table", "title": "Class mismatches (triage quality)", "description": "Tasks whose predicted class differed from the matched one in 30 days: how often triage guessed wrong.", "gridPos": {"x": 16, "y": 16, "w": 8, "h": 8},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "expr": "sum by (predicted, matched) (increase_pure(agent_factory_class_mismatch_total[30d]))", "format": "table", "instant": true}]},
        {"id": 9, "type": "table", "title": "Budget fit by classifier (heuristic)", "description": "Whether the tier a classifier picked fit the task's real use (under, fit, over), 30 days.", "gridPos": {"x": 0, "y": 24, "w": 16, "h": 8},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "expr": "sum by (classifier, fit, control) (increase_pure(agent_factory_tier_fit_total[30d]))", "format": "table", "instant": true}]},
        {"id": 10, "type": "stat", "title": "Kill switch", "description": "ENGAGED = the factory refuses and revokes every run until the owner clears it.", "gridPos": {"x": 16, "y": 24, "w": 8, "h": 8},
         "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}, "mappings": [{"type": "value", "options": {"0": {"text": "off"}, "1": {"text": "ENGAGED"}}}]}, "overrides": []},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "expr": "max(agent_factory_kill_switch_engaged)"}]},
        {"id": 11, "type": "timeseries", "title": "Automatic resumes by reason", "description": "Runs the factory resumed by itself per day, by reason (pod lost, disrupted...).", "gridPos": {"x": 0, "y": 32, "w": 12, "h": 8},
         "fieldConfig": {"defaults": {"noValue": "0"}, "overrides": []},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "expr": "sum by (reason) (increase_pure(agent_factory_resumes_total[1d]))", "legendFormat": "{{reason}}"}]},
        {"id": 12, "type": "table", "title": "Merge decisions by class and reason (7 days)", "description": "What the merge gate decided in 7 days, by class, verdict and reason.", "gridPos": {"x": 12, "y": 32, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "expr": "sum by (class, verdict, reason) (increase_pure(agent_factory_merge_decisions_total[7d])) > 0", "format": "table", "instant": true}]},
        {"id": 13, "type": "timeseries", "title": "Spend per UTC day: ledger vs gateway", "description": "Each day's spend in the factory's ledger (the spent column's day maximum per principal, summed) against agentgateway's priced counter over the same day, one point per UTC day. The day's cross-check holds within max(1 %, 0.10 USD); scripts/ops/cost-crosscheck.py --day reads the same two sides and names the runs. The ledger counts runs through Envoy that the gateway counter does not price.", "gridPos": {"x": 0, "y": 40, "w": 16, "h": 8},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"}, "interval": "1d",
         "fieldConfig": {"defaults": {"unit": "currencyUSD", "noValue": "0", "custom": {"drawStyle": "bars", "fillOpacity": 60}}, "overrides": []},
         "targets": [{"refId": "A", "expr": "sum(max by (principal) (max_over_time(agent_factory_budget_spent_usd[1d])))", "legendFormat": "ledger (spent)"}, {"refId": "B", "expr": "sum(increase_pure(agentgateway_gen_ai_client_cost_usd_total{namespace=\"agent-gateway\"}[1d]))", "legendFormat": "gateway counter"}]},
        {"id": 14, "type": "stat", "title": "Runs outside the cross-check (Envoy)", "description": "Runs in the dashboard's range with a token series on Envoy, not agentgateway. Envoy's router exports no per-request cost, so the cross-check leaves them out (XC7) rather than alert on a certain mismatch. Zero once every run goes through agent-router on agentgateway.", "gridPos": {"x": 16, "y": 40, "w": 8, "h": 8},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "textMode": "value", "colorMode": "none", "graphMode": "none"},
         "fieldConfig": {"defaults": {"noValue": "0", "decimals": 0, "color": {"mode": "fixed", "fixedColor": "text"}}, "overrides": []},
         "targets": [{"refId": "A", "instant": true, "expr": "count(count by (ar_agent) (last_over_time(gen_ai_client_token_usage_sum{ar_agent=~\"system:serviceaccount:agents:xplane-run-.+\", namespace!=\"agent-gateway\"}[$__range])))"}]}
      ]
    }
