---
# Spend per identity (v3 feature 12, docs/superpowers/specs/2026-10-22-spend-per-identity-design.md):
# one charged principal at a time, what the platform spent on the work it caused. It attributes
# cost; it does not score a person (SI7): no panel groups, sorts or ranks by principal, and the
# variable has no All. Every figure reads VictoriaMetrics, in UTC, the ledger's day:
# - the factory's per-payer series (agent-platform fmetrics): agent_factory_charged_usd_total,
#   the day gauges agent_factory_budget_*_usd, outcomes, openings, refusals, revocations, waits;
# - the gateway's per-run tokens and kube-state-metrics' agentrun_*, joined to the payer through
#   agent_factory_run_charge_info{run, principal, task, room} (SI3).
# increase_pure everywhere (SI11): a payer's series is born inside the range, and increase() drops
# a large first value. $${…} survives Flux's postBuild substitution; $1 and $__range pass untouched.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: agent-identity
  namespace: observability
spec:
  allowCrossNamespaceImport: true
  folderRef: "agents"
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  json: |
    {
      "title": "Spend per identity",
      "uid": "agent-identity",
      "tags": ["agents"],
      "description": "What the platform spent on the work one principal caused, against the daily caps the owner set: a run started by a label counts for whoever labelled it, a schedule's or RunLore's for system:factory. Outcomes are the factory's yield on that work, not a score of the person: an agent wrote the code.",
      "schemaVersion": 39,
      "timezone": "utc",
      "time": {"from": "now-30d", "to": "now"},
      "links": [{"title": "Agents", "type": "dashboards", "tags": ["agents"], "asDropdown": false, "includeVars": true, "keepTime": true, "icon": "dashboard", "tooltip": "Every dashboard of the Agents folder: overview, fleet, factory, gateway, identity, room, run"}],
      "templating": {"list": [{"name": "datasource", "type": "datasource", "query": "prometheus"}, {"name": "principal", "label": "Principal", "type": "query", "refresh": 2, "sort": 1, "multi": false, "includeAll": false, "datasource": {"type": "prometheus", "uid": "$${datasource}"}, "definition": "label_values(agent_factory_charged_usd_total, principal)", "query": "label_values(agent_factory_charged_usd_total, principal)"}]},
      "panels": [
        {"id": 1,
         "type": "stat",
         "title": "Today, against its day",
         "gridPos": {"x": 0, "y": 0, "w": 5, "h": 5},
         "description": "The ledger key's day, UTC. For system:factory that key is the fleet.",
         "fieldConfig": {"defaults": {"unit": "currencyUSD", "decimals": 2, "color": {"mode": "fixed", "fixedColor": "blue"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}, "overrides": [{"matcher": {"id": "byFrameRefID", "options": "C"}, "properties": [{"id": "unit", "value": "percentunit"}, {"id": "decimals", "value": 0}, {"id": "min", "value": 0}, {"id": "max", "value": 1}, {"id": "color", "value": {"mode": "thresholds"}}, {"id": "thresholds", "value": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.7}, {"color": "red", "value": 0.9}]}}]}]},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "instant": true, "legendFormat": "spent today", "expr": "max(agent_factory_budget_spent_usd{principal=\"$${principal}\"})"}, {"refId": "B", "instant": true, "legendFormat": "daily cap", "expr": "max(agent_factory_budget_cap_usd{principal=\"$${principal}\"})"}, {"refId": "C", "instant": true, "legendFormat": "of the cap", "expr": "max(agent_factory_budget_spent_usd{principal=\"$${principal}\"}) / max(agent_factory_budget_cap_usd{principal=\"$${principal}\"})"}]},
        {"id": 2,
         "type": "stat",
         "title": "The fleet's day",
         "gridPos": {"x": 5, "y": 0, "w": 5, "h": 5},
         "fieldConfig": {"defaults": {"unit": "currencyUSD", "decimals": 2, "color": {"mode": "fixed", "fixedColor": "blue"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}, "overrides": [{"matcher": {"id": "byFrameRefID", "options": "C"}, "properties": [{"id": "unit", "value": "percentunit"}, {"id": "decimals", "value": 1}]}]},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "instant": true, "legendFormat": "fleet spent today", "expr": "max(agent_factory_budget_spent_usd{principal=\"system:factory\"})"}, {"refId": "B", "instant": true, "legendFormat": "fleet cap", "expr": "max(agent_factory_budget_cap_usd{principal=\"system:factory\"})"}, {"refId": "C", "instant": true, "legendFormat": "this principal's share", "expr": "max(agent_factory_budget_spent_usd{principal=\"$${principal}\"}) / max(agent_factory_budget_spent_usd{principal=\"system:factory\"})"}],
         "description": "The fleet's own day (system:factory's ledger key): spent, its cap, and this principal's share of it."},
        {"id": 3,
         "type": "stat",
         "title": "Spend in the range",
         "description": "What the day ledgers charged this principal over the dashboard's range, task runs and room runs together (POST /v1/runs). The split by kind is a handful of series and shows nothing a number does not.",
         "gridPos": {"x": 10, "y": 0, "w": 3, "h": 5},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"colorMode": "none", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
         "fieldConfig": {"defaults": {"unit": "currencyUSD", "decimals": 2, "noValue": "0", "color": {"mode": "fixed", "fixedColor": "blue"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}, "overrides": []},
         "targets": [{"refId": "A", "expr": "sum(increase_pure(agent_factory_charged_usd_total{principal=\"$${principal}\"}[$__range]))", "instant": true}]},
        {"id": 4,
         "type": "stat",
         "title": "Runs · rooms · tasks",
         "gridPos": {"x": 13, "y": 0, "w": 3, "h": 5},
         "fieldConfig": {"defaults": {"noValue": "0", "color": {"mode": "fixed", "fixedColor": "blue"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}, "overrides": []},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "instant": true, "legendFormat": "runs", "expr": "count(max by (run) (max_over_time(agent_factory_run_charge_info{principal=\"$${principal}\"}[$__range])))"}, {"refId": "B", "instant": true, "legendFormat": "rooms", "expr": "count(max by (room) (max_over_time(agent_factory_run_charge_info{principal=\"$${principal}\", room!=\"\"}[$__range])))"}, {"refId": "C", "instant": true, "legendFormat": "tasks", "expr": "count(max by (task) (max_over_time(agent_factory_run_charge_info{principal=\"$${principal}\", task!=\"\"}[$__range])))"}],
         "description": "Runs, rooms and tasks of this principal in the range, counted from the run charge info (one per run not ended, plus 2 minutes; a factory run's room is its task)."},
        {"id": 5,
         "type": "stat",
         "title": "Cost per accepted PR",
         "gridPos": {"x": 16, "y": 0, "w": 4, "h": 5},
         "description": "Task spend over pull requests merged (auto or by a human) less those reverted, in the range (SI10). Shown from 3 accepted pull requests: below that one merge swings it by half, and it reads too few merges. The count of accepted pull requests sits beside it. Merges are recorded when the factory's merge poll sees them, so the count can trail a merge by up to one poll.",
         "fieldConfig": {"defaults": {"unit": "currencyUSD", "decimals": 2, "noValue": "too few merges (< 3)", "color": {"mode": "fixed", "fixedColor": "blue"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}, "overrides": []},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "instant": true, "expr": "sum(increase_pure(agent_factory_charged_usd_total{principal=\"$${principal}\", kind=\"task\"}[$__range])) / ((sum(increase_pure(agent_factory_pr_outcomes_total{principal=\"$${principal}\", outcome=~\"auto_merged|human_merged\"}[$__range])) - (sum(increase_pure(agent_factory_pr_outcomes_total{principal=\"$${principal}\", outcome=\"reverted\"}[$__range])) or vector(0))) >= 3)"}, {"refId": "B", "instant": true, "legendFormat": "accepted pull requests", "expr": "((sum(increase_pure(agent_factory_pr_outcomes_total{principal=\"$${principal}\", outcome=~\"auto_merged|human_merged\"}[$__range])) - (sum(increase_pure(agent_factory_pr_outcomes_total{principal=\"$${principal}\", outcome=\"reverted\"}[$__range])) or vector(0))) or vector(0))"}]},
        {"id": 6,
         "type": "stat",
         "title": "Waiting for a human now",
         "gridPos": {"x": 20, "y": 0, "w": 4, "h": 5},
         "description": "This principal's tasks in AwaitingHuman or Escalated: each holds one of the factory's awaitingHumanWIP slots.",
         "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "color": {"mode": "fixed", "fixedColor": "blue"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}, "overrides": []},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "instant": true, "expr": "sum(agent_factory_tasks{principal=\"$${principal}\", phase=~\"AwaitingHuman|Escalated\"}) or vector(0)"}]},
        {"id": 7,
         "type": "timeseries",
         "title": "Spend per day",
         "gridPos": {"x": 0, "y": 5, "w": 12, "h": 8},
         "interval": "1d",
         "description": "What the day ledgers charged on each UTC day, a bar per day. Grafana aligns a 1d step to UTC midnight and stops at the last midnight, so a bar at 00:00 shows the day that begins there (offset -1d reads forward from it): today appears, to date.",
         "fieldConfig": {"defaults": {"unit": "currencyUSD", "custom": {"drawStyle": "bars", "stacking": {"mode": "normal"}, "fillOpacity": 80}}, "overrides": []},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "legendFormat": "{{kind}}", "expr": "sum by (kind) (increase_pure(agent_factory_charged_usd_total{principal=\"$${principal}\"}[1d] offset -1d))"}]},
        {"id": 8,
         "type": "bargauge",
         "title": "Tokens by type",
         "gridPos": {"x": 12, "y": 5, "w": 8, "h": 8},
         "description": "The gateway's per-run counters of this principal's runs. input counts the cache reads and writes inside it.",
         "options": {"displayMode": "basic"},
         "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "fixed", "fixedColor": "blue"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}, "overrides": []},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "instant": true, "legendFormat": "{{gen_ai_token_type}}", "expr": "sum by (gen_ai_token_type) (label_replace(sum by (ar_agent, gen_ai_token_type) (increase_pure(gen_ai_client_token_usage_sum{ar_agent=~\"system:serviceaccount:agents:xplane-run-.*\", gen_ai_token_type=~\"input|output|cached_input|cache_creation_input\"}[$__range])), \"run\", \"$1\", \"ar_agent\", \"system:serviceaccount:agents:xplane-run-(.*)\") * on (run) group_left () max by (run) (max_over_time(agent_factory_run_charge_info{principal=\"$${principal}\"}[$__range])))"}]},
        {"id": 9,
         "type": "stat",
         "title": "Cache-read share",
         "gridPos": {"x": 20, "y": 5, "w": 4, "h": 8},
         "description": "cached_input over input, as the agent-gateway dashboard's prompt-cache panel computes it.",
         "fieldConfig": {"defaults": {"unit": "percentunit", "decimals": 1, "min": 0, "max": 1, "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 0.6}]}}, "overrides": []},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "instant": true, "expr": "sum(label_replace(sum by (ar_agent) (increase_pure(gen_ai_client_token_usage_sum{ar_agent=~\"system:serviceaccount:agents:xplane-run-.*\", gen_ai_token_type=\"cached_input\"}[$__range])), \"run\", \"$1\", \"ar_agent\", \"system:serviceaccount:agents:xplane-run-(.*)\") * on (run) group_left () max by (run) (max_over_time(agent_factory_run_charge_info{principal=\"$${principal}\"}[$__range]))) / sum(label_replace(sum by (ar_agent) (increase_pure(gen_ai_client_token_usage_sum{ar_agent=~\"system:serviceaccount:agents:xplane-run-.*\", gen_ai_token_type=\"input\"}[$__range])), \"run\", \"$1\", \"ar_agent\", \"system:serviceaccount:agents:xplane-run-(.*)\") * on (run) group_left () max by (run) (max_over_time(agent_factory_run_charge_info{principal=\"$${principal}\"}[$__range])))"}]},
        {"id": 10,
         "type": "table",
         "title": "Runs",
         "gridPos": {"x": 0, "y": 13, "w": 24, "h": 9},
         "description": "This principal's runs in the range. Spend is what the gateway's tokens of the run price to (the Agent run page's figure; the caps use the meter's own). A run id opens its Agent run page, a room its Agent room page. The model column is the served model of its gateway calls, joined when a run used several.",
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "instant": true, "format": "table", "expr": "label_replace(max by (run, task, room) (max_over_time(agent_factory_run_charge_info{principal=\"$${principal}\"}[$__range])), \"run_id\", \"$1\", \"run\", \"(.*)\")"}, {"refId": "B", "instant": true, "format": "table", "expr": "topk by (run_id) (1, tlast_over_time(agentrun_info{namespace=\"agents\"}[$__range])) and on (run_id) label_replace(max by (run) (max_over_time(agent_factory_run_charge_info{principal=\"$${principal}\"}[$__range])), \"run_id\", \"$1\", \"run\", \"(.*)\")"}, {"refId": "C", "instant": true, "format": "table", "expr": "max by (run_id, phase) (last_over_time(agentrun_status_phase{namespace=\"agents\"}[$__range]) == 1) and on (run_id, phase) topk by (run_id) (1, tlast_over_time(agentrun_status_phase{namespace=\"agents\"}[$__range]) and (last_over_time(agentrun_status_phase{namespace=\"agents\"}[$__range]) == 1)) and on (run_id) label_replace(max by (run) (max_over_time(agent_factory_run_charge_info{principal=\"$${principal}\"}[$__range])), \"run_id\", \"$1\", \"run\", \"(.*)\")"}, {"refId": "D", "instant": true, "format": "table", "expr": "topk by (run_id) (1, tlast_over_time(agentrun_pull_request_info{namespace=\"agents\"}[$__range])) and on (run_id) label_replace(max by (run) (max_over_time(agent_factory_run_charge_info{principal=\"$${principal}\"}[$__range])), \"run_id\", \"$1\", \"run\", \"(.*)\")"}, {"refId": "E", "instant": true, "format": "table", "expr": "(max by (run_id) (last_over_time(agentrun_started_timestamp_seconds{namespace=\"agents\"}[$__range]) > 0) * 1000) and on (run_id) label_replace(max by (run) (max_over_time(agent_factory_run_charge_info{principal=\"$${principal}\"}[$__range])), \"run_id\", \"$1\", \"run\", \"(.*)\")"}, {"refId": "F", "instant": true, "format": "table", "expr": "((sum by (run_id) (label_replace(sum by (ar_agent) (sum by (ar_agent, gen_ai_request_model, gen_ai_token_type) (increase_pure(gen_ai_client_token_usage_sum{ar_agent=~\"system:serviceaccount:agents:xplane-run-.*\", gen_ai_token_type=~\"input|output|cached_input|cache_creation_input\"}[$__range])) * on (gen_ai_request_model, gen_ai_token_type) group_left() llm_gateway:charge_usd_per_mtoken / 1e6), \"run_id\", \"$1\", \"ar_agent\", \"system:serviceaccount:agents:xplane-run-(.*)\")))) and on (run_id) label_replace(max by (run) (max_over_time(agent_factory_run_charge_info{principal=\"$${principal}\"}[$__range])), \"run_id\", \"$1\", \"run\", \"(.*)\")"}, {"refId": "G", "instant": true, "format": "table", "expr": "sum by (run_id, gen_ai_request_model) (label_replace(sum by (run, gen_ai_request_model) (label_replace(sum by (ar_agent, gen_ai_request_model) (increase_pure(gen_ai_client_token_usage_sum{ar_agent=~\"system:serviceaccount:agents:xplane-run-.*\", gen_ai_token_type=~\"input|output\"}[$__range])), \"run\", \"$1\", \"ar_agent\", \"system:serviceaccount:agents:xplane-run-(.*)\")), \"run_id\", \"$1\", \"run\", \"(.*)\")) and on (run_id) label_replace(max by (run) (max_over_time(agent_factory_run_charge_info{principal=\"$${principal}\"}[$__range])), \"run_id\", \"$1\", \"run\", \"(.*)\")"}],
         "transformations": [{"id": "merge", "options": {}}, {"id": "organize", "options": {"renameByName": {"Value #E": "started", "Value #F": "spend"}}}, {"id": "filterFieldsByName", "options": {"include": {"names": ["run_id", "role", "task", "room", "phase", "pull_request", "started", "spend", "gen_ai_request_model"]}}}, {"id": "groupBy", "options": {"fields": {"run_id": {"operation": "groupby"}, "role": {"operation": "aggregate", "aggregations": ["lastNotNull"]}, "task": {"operation": "aggregate", "aggregations": ["lastNotNull"]}, "room": {"operation": "aggregate", "aggregations": ["lastNotNull"]}, "phase": {"operation": "aggregate", "aggregations": ["lastNotNull"]}, "pull_request": {"operation": "aggregate", "aggregations": ["lastNotNull"]}, "started": {"operation": "aggregate", "aggregations": ["lastNotNull"]}, "spend": {"operation": "aggregate", "aggregations": ["lastNotNull"]}, "gen_ai_request_model": {"operation": "aggregate", "aggregations": ["uniqueValues"]}}}}, {"id": "organize", "options": {"renameByName": {"role (lastNotNull)": "role", "task (lastNotNull)": "task", "room (lastNotNull)": "room", "phase (lastNotNull)": "phase", "pull_request (lastNotNull)": "pull_request", "started (lastNotNull)": "started", "spend (lastNotNull)": "spend", "gen_ai_request_model (uniqueValues)": "model"}}}, {"id": "sortBy", "options": {"sort": [{"field": "started", "desc": true}]}}],
         "fieldConfig": {"defaults": {}, "overrides": [{"matcher": {"id": "byName", "options": "run_id"}, "properties": [{"id": "links", "value": [{"title": "Open this run", "url": "/d/agent-run/agent-run?var-run=$${__value.text}&$${__url_time_range}"}]}]}, {"matcher": {"id": "byName", "options": "started"}, "properties": [{"id": "unit", "value": "dateTimeAsIso"}]}, {"matcher": {"id": "byName", "options": "spend"}, "properties": [{"id": "unit", "value": "currencyUSD"}, {"id": "decimals", "value": 2}]}, {"matcher": {"id": "byName", "options": "pull_request"}, "properties": [{"id": "links", "value": [{"title": "Pull request", "url": "$${__value.text}", "targetBlank": true}]}]}, {"matcher": {"id": "byName", "options": "room"}, "properties": [{"id": "links", "value": [{"title": "Open this room", "url": "/d/agent-room/agent-room?var-room=$${__value.text}&$${__url_time_range}"}]}]}]}},
        {"id": 19, "type": "bargauge", "title": "Spend by model", "gridPos": {"x": 0, "y": 22, "w": 8, "h": 8}, "description": "What this principal's runs priced to in the range, by the model that served the call (gen_ai_request_model, the served model, not the agent-default alias), at the meter's price per token as the Runs table prices them. A run that called several models is split across them. The factory's own per-model figure carries no principal, so this is the gateway's tokens joined to the payer.", "options": {"displayMode": "basic"}, "fieldConfig": {"defaults": {"unit": "currencyUSD", "noValue": "0", "color": {"mode": "fixed", "fixedColor": "blue"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}, "decimals": 2}, "overrides": []}, "datasource": {"type": "prometheus", "uid": "$${datasource}"}, "targets": [{"refId": "A", "instant": true, "legendFormat": "{{gen_ai_request_model}}", "expr": "sum by (gen_ai_request_model) (sum by (run, gen_ai_request_model) (label_replace(sum by (ar_agent, gen_ai_request_model, gen_ai_token_type) (increase_pure(gen_ai_client_token_usage_sum{ar_agent=~\"system:serviceaccount:agents:xplane-run-.*\", gen_ai_token_type=~\"input|output|cached_input|cache_creation_input\"}[$__range])) * on (gen_ai_request_model, gen_ai_token_type) group_left() llm_gateway:charge_usd_per_mtoken / 1e6, \"run\", \"$1\", \"ar_agent\", \"system:serviceaccount:agents:xplane-run-(.*)\")) * on (run) group_left () max by (run) (max_over_time(agent_factory_run_charge_info{principal=\"$${principal}\"}[$__range])))"}]},
        {"id": 20, "type": "timeseries", "title": "Spend by model per day", "gridPos": {"x": 8, "y": 22, "w": 10, "h": 8}, "interval": "1d", "description": "The same priced spend on each UTC day, a bar per day stacked by model; the last bar is today, to date. Grafana aligns a 1d step to UTC midnight and offset -1d reads forward from it, as Spend per day does.", "fieldConfig": {"defaults": {"unit": "currencyUSD", "custom": {"drawStyle": "bars", "stacking": {"mode": "normal"}, "fillOpacity": 80}}, "overrides": []}, "datasource": {"type": "prometheus", "uid": "$${datasource}"}, "targets": [{"refId": "A", "legendFormat": "{{gen_ai_request_model}}", "expr": "sum by (gen_ai_request_model) (sum by (run, gen_ai_request_model) (label_replace(sum by (ar_agent, gen_ai_request_model, gen_ai_token_type) (increase_pure(gen_ai_client_token_usage_sum{ar_agent=~\"system:serviceaccount:agents:xplane-run-.*\", gen_ai_token_type=~\"input|output|cached_input|cache_creation_input\"}[1d] offset -1d)) * on (gen_ai_request_model, gen_ai_token_type) group_left() last_over_time(llm_gateway:charge_usd_per_mtoken[1d] offset -1d) / 1e6, \"run\", \"$1\", \"ar_agent\", \"system:serviceaccount:agents:xplane-run-(.*)\")) * on (run) group_left () max by (run) (max_over_time(agent_factory_run_charge_info{principal=\"$${principal}\"}[1d] offset -1d)))"}]},
        {"id": 21, "type": "bargauge", "title": "Tokens by model", "gridPos": {"x": 18, "y": 22, "w": 6, "h": 8}, "description": "Input plus output tokens of this principal's runs in the range, by the served model. Cache reads and writes are inside input, as in Tokens by type.", "options": {"displayMode": "basic"}, "fieldConfig": {"defaults": {"unit": "short", "noValue": "0", "color": {"mode": "fixed", "fixedColor": "blue"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}, "overrides": []}, "datasource": {"type": "prometheus", "uid": "$${datasource}"}, "targets": [{"refId": "A", "instant": true, "legendFormat": "{{gen_ai_request_model}}", "expr": "sum by (gen_ai_request_model) (sum by (run, gen_ai_request_model) (label_replace(sum by (ar_agent, gen_ai_request_model) (increase_pure(gen_ai_client_token_usage_sum{ar_agent=~\"system:serviceaccount:agents:xplane-run-.*\", gen_ai_token_type=~\"input|output\"}[$__range])), \"run\", \"$1\", \"ar_agent\", \"system:serviceaccount:agents:xplane-run-(.*)\")) * on (run) group_left () max by (run) (max_over_time(agent_factory_run_charge_info{principal=\"$${principal}\"}[$__range])))"}]},
        {"id": 11,
         "type": "bargauge",
         "title": "Pull requests opened · merged · reverted",
         "gridPos": {"x": 0, "y": 30, "w": 9, "h": 6},
         "description": "Recorded when the factory's merge poll sees the outcome, so a merge shows up to one poll after it happened.",
         "options": {"displayMode": "basic"},
         "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "noValue": "0", "color": {"mode": "fixed", "fixedColor": "blue"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}, "overrides": []},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "instant": true, "legendFormat": "opened", "expr": "sum(increase_pure(agent_factory_prs_opened_total{principal=\"$${principal}\"}[$__range]))"}, {"refId": "B", "instant": true, "legendFormat": "{{outcome}}", "expr": "sum by (outcome) (increase_pure(agent_factory_pr_outcomes_total{principal=\"$${principal}\"}[$__range]))"}]},
        {"id": 12,
