---
# One agent run (agent observability design). `run` is the runId. Every panel filters on it:
# - kube-state-metrics' agentrun_* series (run_id);
# - the run pod's step log (xplane-run-<runId>);
# - agent-router's access log and gen_ai metrics (x_ar_agent / ar_agent = the run's ServiceAccount), on
#   agentgateway (ADR-0053), whose scrape relabels to the gen_ai_* names (error_type included);
# - the run's spans in VictoriaTraces (agent.run_id; agent.principal on agent-router's).
# A step line's trace_id becomes log.trace_id, which the VictoriaLogs datasource links to
# VictoriaTraces: correlation only (O22), the panels still filter on the pod. The regex is
# anchored on the line's last field, because agent-written text comes earlier in the line.
# A resumed attempt re-logs the conversation's earlier steps: count distinct step numbers, not lines.
# Panel time ranges are the dashboard's; the "This run's window" link sets it from run_from/run_to.
# $${…} survives Flux's postBuild substitution; ${private_domain_name} is substituted.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: agent-run
  namespace: observability
spec:
  allowCrossNamespaceImport: true
  folderRef: "agents"
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  json: |
      {
        "title": "Agent run",
        "uid": "agent-run",
      "tags": ["agents"],
        "schemaVersion": 39,
        "time": {"from": "now-6h", "to": "now"},
        "links": [
          {"title": "This run's window", "type": "link", "url": "/d/agent-run/agent-run?var-run=$${run}&from=$${run_from}&to=$${run_to}", "tooltip": "Sets the time range to the run: first sample − 1 min to its last Pending or Running sample + 2 min, within 14 days"},
          {"title": "Agents", "type": "dashboards", "tags": ["agents"], "asDropdown": false, "includeVars": true, "keepTime": true, "icon": "dashboard", "tooltip": "Every dashboard of the Agents folder: overview, fleet, factory, gateway, identity, room, run"},
          {"title": "Payer's spend", "type": "link", "url": "/d/agent-identity/agent-identity?var-principal=$${principal}", "keepTime": true, "tooltip": "The principal this run was charged to"},
          {"title": "This run's room", "type": "link", "url": "/d/agent-room/agent-room?var-room=$${room}", "keepTime": true, "tooltip": "The room (task) this run belongs to"}
        ],
        "templating": {"list": [
          {"name": "datasource", "type": "datasource", "query": "prometheus"},
          {"name": "logs_datasource", "type": "datasource", "query": "victoriametrics-logs-datasource"},
          {"name": "run", "label": "Run", "type": "query", "refresh": 2, "sort": 1, "datasource": {"type": "prometheus", "uid": "$${datasource}"}, "definition": "label_values(agentrun_info{namespace=\"agents\"}, run_id)", "query": "label_values(agentrun_info{namespace=\"agents\"}, run_id)"},
          {"name": "principal", "type": "query", "hide": 2, "refresh": 2, "datasource": {"type": "prometheus", "uid": "$${datasource}"}, "definition": "query_result(last_over_time(agent_factory_run_charge_info{run=\"$${run}\"}[30d]))", "query": "query_result(last_over_time(agent_factory_run_charge_info{run=\"$${run}\"}[30d]))", "regex": "/principal=\"([^\"]+)\"/"},
          {"name": "room", "type": "query", "hide": 2, "refresh": 2, "datasource": {"type": "prometheus", "uid": "$${datasource}"}, "definition": "query_result(last_over_time(agent_factory_run_charge_info{run=\"$${run}\"}[30d]))", "query": "query_result(last_over_time(agent_factory_run_charge_info{run=\"$${run}\"}[30d]))", "regex": "/room=\"([^\"]+)\"/"},
          {"name": "task", "type": "query", "hide": 2, "refresh": 2, "datasource": {"type": "prometheus", "uid": "$${datasource}"}, "definition": "label_values(agentrun_info{namespace=\"agents\", run_id=\"$${run}\"}, task)", "query": "label_values(agentrun_info{namespace=\"agents\", run_id=\"$${run}\"}, task)", "label": "Task"},
          {"name": "branch", "type": "query", "hide": 2, "refresh": 2, "datasource": {"type": "prometheus", "uid": "$${datasource}"}, "definition": "label_values(agentrun_info{namespace=\"agents\", run_id=\"$${run}\"}, branch)", "query": "label_values(agentrun_info{namespace=\"agents\", run_id=\"$${run}\"}, branch)"},
          {"name": "run_from", "type": "query", "hide": 2, "refresh": 2, "datasource": {"type": "prometheus", "uid": "$${datasource}"}, "definition": "query_result((min(tfirst_over_time(agentrun_info{namespace=\"agents\", run_id=\"$${run}\"}[14d])) - 60) * 1000)", "query": "query_result((min(tfirst_over_time(agentrun_info{namespace=\"agents\", run_id=\"$${run}\"}[14d])) - 60) * 1000)", "regex": "/ ([0-9]+) /"},
          {"name": "run_to", "type": "query", "hide": 2, "refresh": 2, "datasource": {"type": "prometheus", "uid": "$${datasource}"}, "definition": "query_result((max(tlast_over_time((max(agentrun_status_phase{namespace=\"agents\", run_id=\"$${run}\", phase=~\"Pending|Running\"}) == 1)[14d:20s])) + 120) * 1000)", "query": "query_result((max(tlast_over_time((max(agentrun_status_phase{namespace=\"agents\", run_id=\"$${run}\", phase=~\"Pending|Running\"}) == 1)[14d:20s])) + 120) * 1000)", "regex": "/ ([0-9]+) /"}
        ]},
        "panels": [
        {"id": 1,
         "type": "table",
         "title": "Run",
         "description": "status.phase (Suspended when no exported phase is 1), the outcome reason, the pull request the factory recorded (task runs only; a room run's PR is under its branch link) the room, read from the branch agent/<room> of a run without a task, the claimed model (spec.model) and its reasoning effort (rooms_run_info, kept only while the run is live: shown when the range covers it).",
         "gridPos": {"x": 0, "y": 0, "w": 9, "h": 4},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "targets": [{"refId": "A", "expr": "topk(1, tlast_over_time(agentrun_info{namespace=\"agents\", run_id=\"$${run}\"}[$__range]))", "instant": true, "format": "table"}, {"refId": "B", "expr": "max by (run_id, phase) (last_over_time(agentrun_status_phase{namespace=\"agents\", run_id=\"$${run}\"}[$__range]) == 1) and on (run_id, phase) topk by (run_id) (1, tlast_over_time(agentrun_status_phase{namespace=\"agents\", run_id=\"$${run}\"}[$__range]) and (last_over_time(agentrun_status_phase{namespace=\"agents\", run_id=\"$${run}\"}[$__range]) == 1)) or label_set(max by (run_id) (last_over_time(agentrun_status_phase{namespace=\"agents\", run_id=\"$${run}\"}[$__range])) == 0, \"phase\", \"Suspended\")", "instant": true, "format": "table"}, {"refId": "C", "expr": "topk(1, tlast_over_time(agentrun_outcome_info{namespace=\"agents\", run_id=\"$${run}\"}[$__range]))", "instant": true, "format": "table"}, {"refId": "D", "expr": "topk(1, tlast_over_time(agentrun_pull_request_info{namespace=\"agents\", run_id=\"$${run}\"}[$__range]))", "instant": true, "format": "table"}, {"refId": "E", "expr": "label_replace(max by (run_id, branch) (last_over_time(agentrun_info{namespace=\"agents\", run_id=\"$${run}\", task=\"\"}[$__range])), \"room\", \"$$1\", \"branch\", \"agent/(.+)\")", "instant": true, "format": "table"}, {"refId": "F", "expr": "max by (run_id, effort) (label_replace(max by (run, effort) (max_over_time(rooms_run_info{run=\"$${run}\"}[$__range])), \"run_id\", \"$$1\", \"run\", \"(.*)\"))", "instant": true, "format": "table"}],
         "transformations": [{"id": "merge", "options": {}}, {"id": "filterFieldsByName", "options": {"include": {"names": ["phase", "reason", "pull_request", "room", "branch", "role", "tier", "model", "effort", "data_class", "principal", "repository", "run_id"]}}}, {"id": "organize", "options": {"indexByName": {"phase": 0, "reason": 1, "pull_request": 2, "room": 3, "branch": 4, "role": 5, "tier": 6, "model": 7, "effort": 8, "data_class": 9, "principal": 10, "repository": 11, "run_id": 12}}}],
         "fieldConfig": {"defaults": {}, "overrides": [{"matcher": {"id": "byName", "options": "phase"}, "properties": [{"id": "custom.cellOptions", "value": {"type": "color-background"}}, {"id": "mappings", "value": [{"type": "value", "options": {"Pending": {"color": "yellow", "index": 0}, "Running": {"color": "blue", "index": 1}, "Suspended": {"color": "purple", "index": 2}, "Succeeded": {"color": "green", "index": 3}, "Failed": {"color": "red", "index": 4}, "BudgetExhausted": {"color": "orange", "index": 5}, "Revoked": {"color": "dark-red", "index": 6}}}]}]}, {"matcher": {"id": "byName", "options": "pull_request"}, "properties": [{"id": "links", "value": [{"title": "Pull request", "url": "$${__value.text}", "targetBlank": true}]}]}, {"matcher": {"id": "byName", "options": "room"}, "properties": [{"id": "links", "value": [{"title": "Open the room", "url": "https://rooms.${private_domain_name}/r/$${__value.text}", "targetBlank": true}]}]}, {"matcher": {"id": "byName", "options": "branch"}, "properties": [{"id": "links", "value": [{"title": "Pull requests from this branch", "url": "https://github.com/$${__data.fields.repository}/pulls?q=is%3Apr+head%3A$${__value.text}", "targetBlank": true}]}]}]}},
        {"id": 2,
         "type": "stat",
         "title": "Duration",
         "description": "active = time in Running; suspended = time with no phase exported (KSM's phase list has no Suspended); wall = finishedAt (else the last Pending or Running sample) − startedAt, which also counts Pending and the suspension. No colour: the run's maxMinutes is not exported as a metric. Sampled every minute over the dashboard's range (VictoriaMetrics caps a subquery at 100k points: 20s over 30 days refused), so a figure is good to about a minute; pick \"This run's window\" for the run's own span.",
         "gridPos": {"x": 9, "y": 0, "w": 4, "h": 4},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "textMode": "value_and_name", "colorMode": "none", "graphMode": "none", "orientation": "vertical"},
         "fieldConfig": {"defaults": {"unit": "s", "decimals": 0, "color": {"mode": "fixed", "fixedColor": "text"}}, "overrides": []},
         "targets": [{"refId": "A", "expr": "duration_over_time((max(agentrun_status_phase{namespace=\"agents\", run_id=\"$${run}\", phase=\"Running\"}) == 1)[$__range:1m], 90s)", "instant": true, "legendFormat": "active"}, {"refId": "B", "expr": "duration_over_time((sum(agentrun_status_phase{namespace=\"agents\", run_id=\"$${run}\"}) == 0)[$__range:1m], 90s) or vector(0)", "instant": true, "legendFormat": "suspended"}, {"refId": "C", "expr": "(max(last_over_time(agentrun_finished_timestamp_seconds{namespace=\"agents\", run_id=\"$${run}\"}[$__range])) > 0 or max(tlast_over_time((max(agentrun_status_phase{namespace=\"agents\", run_id=\"$${run}\", phase=~\"Pending|Running\"}) == 1)[$__range:1m]))) - (max(last_over_time(agentrun_started_timestamp_seconds{namespace=\"agents\", run_id=\"$${run}\"}[$__range])) > 0)", "instant": true, "legendFormat": "wall"}]},
        {"id": 18, "type": "stat", "title": "Models", "gridPos": {"x": 13, "y": 0, "w": 4, "h": 4}, "description": "The models that served this run's calls through the gateway (gen_ai_request_model, the served model: the run's own model field is the agent-default alias), one tile each. Several when the run called more than one alias, the implementer, the judge or a search child. Empty until the run's first model call.", "datasource": {"type": "prometheus", "uid": "$${datasource}"}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "textMode": "name", "colorMode": "none", "graphMode": "none", "orientation": "vertical"}, "fieldConfig": {"defaults": {"noValue": "no model call yet", "color": {"mode": "fixed", "fixedColor": "blue"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}, "overrides": []}, "targets": [{"refId": "A", "instant": true, "legendFormat": "{{gen_ai_request_model}}", "expr": "sum by (gen_ai_request_model) (increase_pure(gen_ai_client_token_usage_sum{ar_agent=\"system:serviceaccount:agents:xplane-run-$${run}\", gen_ai_token_type=~\"input|output\"}[$__range])) > 0"}]},
        {"id": 3,
         "type": "bargauge",
         "title": "Tokens vs budget",
         "description": "Share of spec.budget.maxTokens. status.usage is the factory meter's last write, sampled every 30 s from the gateway counter; it stops at the run's end, so calls in the run's last scrape interval reach only the gateway figure (r2mbw56k: 92,392 vs 127,696, the two calls 4 s before finishedAt).",
         "gridPos": {"x": 17, "y": 0, "w": 4, "h": 4},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "displayMode": "basic", "orientation": "horizontal", "showUnfilled": true, "namePlacement": "top"},
         "fieldConfig": {"defaults": {"unit": "percentunit", "decimals": 1, "min": 0, "max": 1, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.8}, {"color": "red", "value": 1}]}}, "overrides": []},
         "targets": [{"refId": "A", "expr": "max(last_over_time(agentrun_usage_tokens{namespace=\"agents\", run_id=\"$${run}\"}[$__range])) / max(last_over_time(agentrun_budget_max_tokens{namespace=\"agents\", run_id=\"$${run}\"}[$__range]))", "instant": true, "legendFormat": "status.usage (meter)"}, {"refId": "B", "expr": "sum(increase_pure(gen_ai_client_token_usage_sum{ar_agent=\"system:serviceaccount:agents:xplane-run-$${run}\", gen_ai_token_type=~\"input|output\"}[$__range])) / max(last_over_time(agentrun_budget_max_tokens{namespace=\"agents\", run_id=\"$${run}\"}[$__range]))", "instant": true, "legendFormat": "gateway counter"}]},
        {"id": 10,
         "type": "stat",
         "title": "Cost (USD)",
         "description": "The run's gateway tokens, input, output, cache reads and cache writes, each × llm_gateway:charge_usd_per_mtoken: what one counted token of that type adds, generated from meter.prices. The meter's agent_factory_run_cost_usd is the figure the caps use.",
         "gridPos": {"x": 21, "y": 0, "w": 3, "h": 4},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "textMode": "value", "colorMode": "none", "graphMode": "none", "text": {"valueSize": 28}},
         "fieldConfig": {"defaults": {"unit": "currencyUSD", "decimals": 3, "color": {"mode": "fixed", "fixedColor": "text"}}, "overrides": []},
         "targets": [{"refId": "A", "expr": "sum(sum by (gen_ai_request_model, gen_ai_token_type) (increase_pure(gen_ai_client_token_usage_sum{ar_agent=\"system:serviceaccount:agents:xplane-run-$${run}\", gen_ai_token_type=~\"input|output|cached_input|cache_creation_input\"}[$__range])) * on (gen_ai_request_model, gen_ai_token_type) group_left() llm_gateway:charge_usd_per_mtoken) / 1e6", "instant": true}]},
        {"id": 4,
         "type": "state-timeline",
         "title": "Phase",
         "description": "Suspended is derived: the XRD has the phase, kube-state-metrics' stateSet does not, so a suspended run exports 0 on every phase.",
         "gridPos": {"x": 0, "y": 4, "w": 16, "h": 5},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"showValue": "never", "mergeValues": true, "legend": {"showLegend": false}},
         "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "blue"}}, "overrides": [{"matcher": {"id": "byName", "options": "Pending"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "yellow"}}]}, {"matcher": {"id": "byName", "options": "Running"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "blue"}}]}, {"matcher": {"id": "byName", "options": "Suspended"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "purple"}}]}, {"matcher": {"id": "byName", "options": "Succeeded"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "green"}}]}, {"matcher": {"id": "byName", "options": "Failed"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]}, {"matcher": {"id": "byName", "options": "BudgetExhausted"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "orange"}}]}, {"matcher": {"id": "byName", "options": "Revoked"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-red"}}]}]},
         "targets": [{"refId": "A", "expr": "max by (phase) (agentrun_status_phase{namespace=\"agents\", run_id=\"$${run}\"} == 1)", "legendFormat": "{{phase}}"}, {"refId": "B", "expr": "label_set((sum(agentrun_status_phase{namespace=\"agents\", run_id=\"$${run}\"}) == 0) + 1, \"phase\", \"Suspended\")", "legendFormat": "{{phase}}"}]},
        {"id": 19, "type": "bargauge", "title": "Cost by model", "gridPos": {"x": 16, "y": 4, "w": 8, "h": 5}, "description": "This run's priced spend split by the model that served each call, with the same price per token as the Cost (USD) tile (which is their sum). A run that called several aliases (implementer, judge, search child) shows one bar each.", "options": {"displayMode": "basic"}, "fieldConfig": {"defaults": {"unit": "currencyUSD", "noValue": "0", "color": {"mode": "fixed", "fixedColor": "blue"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}, "decimals": 3}, "overrides": []}, "datasource": {"type": "prometheus", "uid": "$${datasource}"}, "targets": [{"refId": "A", "instant": true, "legendFormat": "{{gen_ai_request_model}}", "expr": "sum by (gen_ai_request_model) (sum by (gen_ai_request_model, gen_ai_token_type) (increase_pure(gen_ai_client_token_usage_sum{ar_agent=\"system:serviceaccount:agents:xplane-run-$${run}\", gen_ai_token_type=~\"input|output|cached_input|cache_creation_input\"}[$__range])) * on (gen_ai_request_model, gen_ai_token_type) group_left() llm_gateway:charge_usd_per_mtoken) / 1e6"}]},
        {"id": 17,
         "type": "table",
         "title": "Steps",
         "description": "One row per step number, at its first occurrence: a resumed attempt re-logs the conversation's earlier steps, so lines repeat across pods. logged = how many times the line was written.",
         "gridPos": {"x": 0, "y": 9, "w": 20, "h": 10},
         "datasource": {"type": "victoriametrics-logs-datasource", "uid": "$${logs_datasource}"},
         "targets": [{"refId": "A", "queryType": "instant", "expr": "kubernetes.pod_namespace:\"agents\" AND kubernetes.pod_name:\"xplane-run-$${run}\" AND kubernetes.container_name:\"harness\" AND _msg:~\"^agent-run step \" | extract_regexp \"^agent-run step (?P<step>[0-9]+): (?P<tool>[^|]*) [|] (?P<intent>.*?) [|] (?P<command>.*) [|] trace_id=(?P<trace_id>[0-9a-f]{32})$$\" | stats by (step) row_min(_time, _time, tool, intent, command, trace_id) as first, count() as logged | unpack_json from first | sort by (step) | rename trace_id as log.trace_id | fields _time, step, tool, intent, command, logged, log.trace_id"}],
         "transformations": [{"id": "extractFields", "options": {"source": "labels", "format": "json", "replace": false, "keepTime": false}}, {"id": "convertFieldType", "options": {"conversions": [{"targetField": "step", "destinationType": "number"}, {"targetField": "logged", "destinationType": "number"}]}}, {"id": "organize", "options": {"excludeByName": {"labels": true, "Line": true, "id": true, "streams": true, "streamId": true}, "indexByName": {"Time": 0, "step": 1, "tool": 2, "intent": 3, "command": 4, "logged": 5, "log.trace_id": 6}, "renameByName": {"log.trace_id": "trace"}}}, {"id": "sortBy", "options": {"sort": [{"field": "step"}]}}],
         "fieldConfig": {"defaults": {"custom": {"cellOptions": {"type": "auto"}, "inspect": true}}, "overrides": [{"matcher": {"id": "byName", "options": "Time"}, "properties": [{"id": "unit", "value": "time:HH:mm:ss"}, {"id": "custom.width", "value": 90}]}, {"matcher": {"id": "byName", "options": "step"}, "properties": [{"id": "custom.width", "value": 55}]}, {"matcher": {"id": "byName", "options": "tool"}, "properties": [{"id": "custom.width", "value": 190}]}, {"matcher": {"id": "byName", "options": "intent"}, "properties": [{"id": "custom.width", "value": 420}]}, {"matcher": {"id": "byName", "options": "logged"}, "properties": [{"id": "custom.width", "value": 70}]}, {"matcher": {"id": "byName", "options": "trace"}, "properties": [{"id": "custom.width", "value": 110}, {"id": "links", "value": [{"title": "View trace", "url": "", "internal": {"datasourceUid": "VictoriaTraces", "datasourceName": "VictoriaTraces", "query": {"query": "$${__value.raw}"}}}]}]}]}},
        {"id": 13,
         "type": "stat",
         "title": "Distinct steps",
         "description": "Distinct step numbers, not lines: a resume re-logs the earlier steps (r2mbw56k: 16 lines, 9 steps, 2 attempts). attempts = harness pods.",
         "gridPos": {"x": 20, "y": 9, "w": 4, "h": 10},
         "datasource": {"type": "victoriametrics-logs-datasource", "uid": "$${logs_datasource}"},
         "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "textMode": "value_and_name", "colorMode": "none", "graphMode": "none", "orientation": "vertical"},
         "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "text"}}, "overrides": []},
         "targets": [{"refId": "A", "queryType": "stats", "expr": "kubernetes.pod_namespace:\"agents\" AND kubernetes.pod_name:\"xplane-run-$${run}\" AND kubernetes.container_name:\"harness\" AND _msg:~\"^agent-run step \" | extract_regexp \"^agent-run step (?P<step>[0-9]+):\" | stats count_uniq(step) as steps"}, {"refId": "B", "queryType": "stats", "expr": "kubernetes.pod_namespace:\"agents\" AND kubernetes.pod_name:\"xplane-run-$${run}\" AND kubernetes.container_name:\"harness\" AND _msg:~\"^agent-run step \" | stats count_uniq(kubernetes.pod_uid) as attempts"}]},
        {"id": 6,
         "type": "logs",
         "title": "Model calls through agent-router", "description": "This run's model calls as agent-router logged them: method, path, status, duration, model and tokens, newest first.",
         "gridPos": {"x": 0, "y": 19, "w": 12, "h": 8},
         "datasource": {"type": "victoriametrics-logs-datasource", "uid": "$${logs_datasource}"},
         "options": {"showTime": true, "wrapLogMessage": false, "sortOrder": "Ascending", "enableLogDetails": true},
         "targets": [{"refId": "A", "queryType": "instant", "expr": "kubernetes.pod_namespace:\"agent-gateway\" AND kubernetes.pod_labels.gateway.networking.k8s.io/gateway-name:\"agent-router\" AND log.x_ar_agent:\"system:serviceaccount:agents:xplane-run-$${run}\" AND log.http.path:~\"chat/completions\" | format \"<log.http.method> <log.http.path> → <log.http.status> in <log.duration> · <log.gen_ai.request.model> · in <log.gen_ai.usage.input_tokens> (cached <log.gen_ai.usage.cache_read.input_tokens>) · out <log.gen_ai.usage.output_tokens> tokens\" as _msg | format if (-log.http.status:*) \"<log.http.method> <log.http.path> → no response after <log.duration> · <log.gen_ai.request.model>\" as _msg | copy log.level as level | format if (log.http.status:~\"^4\" OR -log.http.status:*) \"warn\" as level | format if (log.http.status:~\"^5\") \"error\" as level | rename log.trace.id as log.trace_id"}]},
        {"id": 7,
         "type": "logs",
         "title": "MCP calls", "description": "This run's MCP calls through agent-router: method, target server and tool, status and duration.",
         "gridPos": {"x": 12, "y": 19, "w": 12, "h": 8},
         "datasource": {"type": "victoriametrics-logs-datasource", "uid": "$${logs_datasource}"},
         "options": {"showTime": true, "wrapLogMessage": false, "sortOrder": "Ascending", "enableLogDetails": true},
