# Agents overview: the folder's landing page. One screen answers four questions, each tile opens
# the dashboard that explains it:
#   healthy?   row 1: factory, GitHub, kill switch, meter, room broker, router, alerts, sandbox pods;
#   spending?  row 2: the fleet's day against its cap (the same ledger gauges as the identity page);
#   waiting?   tasks waiting for a human and the broker's pending approvals;
#   landed?    PRs opened, merged, reverted over the dashboard's range.
# Every query reads an exported series or a rule already in the tree; a run counts once, at its
# latest phase. $${...} survives Flux's postBuild substitution; $__range and $1 pass untouched.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: agents-overview
  namespace: observability
spec:
  allowCrossNamespaceImport: true
  folderRef: "agents"
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  json: |
    {
      "title": "Agents overview",
      "uid": "agents-overview",
      "tags": ["agents"],
      "description": "Is the factory healthy, what is it spending today against its caps, what needs a human now, what landed. Every tile opens the dashboard behind it.",
      "schemaVersion": 39,
      "timezone": "utc",
      "time": {"from": "now-7d", "to": "now"},
      "links": [{"title": "Agents", "type": "dashboards", "tags": ["agents"], "asDropdown": false, "includeVars": true, "keepTime": true, "icon": "dashboard", "tooltip": "Every dashboard of the Agents folder: overview, fleet, factory, gateway, identity, room, run"}],
      "templating": {"list": [{"name": "datasource", "type": "datasource", "query": "prometheus"}]},
      "panels": [
        {"id": 1,
         "type": "stat",
         "title": "Factory",
         "description": "Both factory replicas are scraped. DOWN = nothing creates runs, whatever else reads.",
         "gridPos": {"x": 0, "y": 0, "w": 3, "h": 4},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
         "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}, "mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red", "index": 0}, "1": {"text": "up", "color": "green", "index": 1}}}]}, "overrides": []},
         "targets": [{"refId": "A", "expr": "min(up{job=\"agent-factory\"}) or vector(0)", "instant": true}],
         "links": [{"title": "Open agent-factory", "url": "/d/agent-factory/agent-factory?$${__url_time_range}", "targetBlank": false}]},
        {"id": 2,
         "type": "stat",
         "title": "GitHub link",
         "description": "The factory's GitHub reachability gauge (agent_factory_github_up). DOWN = no PRs opened or merged.",
         "gridPos": {"x": 3, "y": 0, "w": 3, "h": 4},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
         "fieldConfig": {"defaults": {"noValue": "no data", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}, "mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red", "index": 0}, "1": {"text": "up", "color": "green", "index": 1}}}]}, "overrides": []},
         "targets": [{"refId": "A", "expr": "min(agent_factory_github_up)", "instant": true}],
         "links": [{"title": "Open agent-factory", "url": "/d/agent-factory/agent-factory?$${__url_time_range}", "targetBlank": false}]},
        {"id": 3,
         "type": "stat",
         "title": "Kill switch",
         "description": "ENGAGED = the factory refuses and revokes every run until the owner clears it.",
         "gridPos": {"x": 6, "y": 0, "w": 3, "h": 4},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
         "fieldConfig": {"defaults": {"noValue": "no data", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}, "mappings": [{"type": "value", "options": {"0": {"text": "off", "index": 0}, "1": {"text": "ENGAGED", "index": 1}}}]}, "overrides": []},
         "targets": [{"refId": "A", "expr": "max(agent_factory_kill_switch_engaged)", "instant": true}],
         "links": [{"title": "Open agent-factory", "url": "/d/agent-factory/agent-factory?$${__url_time_range}", "targetBlank": false}]},
        {"id": 4,
         "type": "stat",
         "title": "Meter age",
         "description": "Seconds since the meter last read token usage. Over 300 s admission is refused (AgentFactoryMeterBlind).",
         "gridPos": {"x": 9, "y": 0, "w": 3, "h": 4},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
         "fieldConfig": {"defaults": {"unit": "s", "noValue": "no data", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 120}, {"color": "red", "value": 300}]}}, "overrides": []},
         "targets": [{"refId": "A", "expr": "time() - max(agent_factory_meter_last_success_timestamp_seconds)", "instant": true}],
         "links": [{"title": "Open agent-factory", "url": "/d/agent-factory/agent-factory?$${__url_time_range}", "targetBlank": false}]},
        {"id": 5,
         "type": "stat",
         "title": "Room broker",
         "description": "Both room-broker replicas are scraped. DOWN = nobody can follow, steer or approve (RoomBrokerDown).",
         "gridPos": {"x": 12, "y": 0, "w": 3, "h": 4},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
         "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}, "mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red", "index": 0}, "1": {"text": "up", "color": "green", "index": 1}}}]}, "overrides": []},
         "targets": [{"refId": "A", "expr": "min(up{job=\"room-broker\"}) or vector(0)", "instant": true}],
         "links": [{"title": "Open agent-room", "url": "/d/agent-room/agent-room?$${__url_time_range}", "targetBlank": false}]},
        {"id": 6,
         "type": "stat",
         "title": "Router 5xx now",
         "description": "Share of agent-router requests answered 5xx over the last 5 minutes. No traffic reads no traffic, not 0.",
         "gridPos": {"x": 15, "y": 0, "w": 3, "h": 4},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
         "fieldConfig": {"defaults": {"unit": "percentunit", "decimals": 1, "noValue": "no traffic", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 0.05}]}}, "overrides": []},
         "targets": [{"refId": "A", "expr": "(sum(rate(agentgateway_requests_total{namespace=\"agent-gateway\", status=~\"5..\"}[5m])) or vector(0)) / sum(rate(agentgateway_requests_total{namespace=\"agent-gateway\"}[5m]))", "instant": true}],
         "links": [{"title": "Open agent-gateway", "url": "/d/agent-gateway/agent-gateway?$${__url_time_range}", "targetBlank": false}]},
        {"id": 7,
         "type": "stat",
         "title": "Agent alerts firing",
         "description": "Alerts of the agent-* rule groups firing now (sandbox, gateway, cache, factory, rooms, logs). The table at the bottom lists them.",
         "gridPos": {"x": 18, "y": 0, "w": 3, "h": 4},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
         "fieldConfig": {"defaults": {"noValue": "0", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
         "targets": [{"refId": "A", "expr": "count(ALERTS{alertstate=\"firing\", alertgroup=~\"agent-.*\"}) or vector(0)", "instant": true}],
         "links": [{"title": "Open agent-factory", "url": "/d/agent-factory/agent-factory?$${__url_time_range}", "targetBlank": false}]},
        {"id": 8,
         "type": "stat",
         "title": "Sandbox pods pending",
         "description": "Run pods of the agents namespace stuck Pending (a node to scale up, an image to pull). A few seconds is normal; a minute is AgentSandboxPodPending.",
         "gridPos": {"x": 21, "y": 0, "w": 3, "h": 4},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
         "fieldConfig": {"defaults": {"noValue": "0", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
         "targets": [{"refId": "A", "expr": "sum(kube_pod_status_phase{namespace=\"agents\", phase=\"Pending\"}) or vector(0)", "instant": true}],
         "links": [{"title": "Open agent-fleet", "url": "/d/agent-fleet/agent-fleet?$${__url_time_range}", "targetBlank": false}]},
        {"id": 9,
         "type": "stat",
         "title": "Spent today",
         "description": "What the fleet's ledger charged since 00:00 UTC (system:factory is the whole fleet).",
         "gridPos": {"x": 0, "y": 4, "w": 3, "h": 4},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"colorMode": "none", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
         "fieldConfig": {"defaults": {"unit": "currencyUSD", "decimals": 2, "color": {"mode": "fixed", "fixedColor": "blue"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}, "overrides": []},
         "targets": [{"refId": "A", "expr": "max(agent_factory_budget_spent_usd{principal=\"system:factory\"})", "instant": true}],
         "links": [{"title": "Open agent-identity", "url": "/d/agent-identity/agent-identity?var-principal=system:factory&$${__url_time_range}", "targetBlank": false}]},
        {"id": 10,
         "type": "stat",
         "title": "Of the fleet's day cap",
         "description": "Spent today over the fleet's daily cap. Orange from 70 %, red from 90 % (AgentFactoryDailyBudgetHigh fires at 80 %).",
         "gridPos": {"x": 3, "y": 4, "w": 3, "h": 4},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
         "fieldConfig": {"defaults": {"unit": "percentunit", "decimals": 0, "noValue": "no cap", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.7}, {"color": "red", "value": 0.9}]}}, "overrides": []},
         "targets": [{"refId": "A", "expr": "max(agent_factory_budget_spent_usd{principal=\"system:factory\"}) / max(agent_factory_budget_cap_usd{principal=\"system:factory\"})", "instant": true}],
         "links": [{"title": "Open agent-identity", "url": "/d/agent-identity/agent-identity?var-principal=system:factory&$${__url_time_range}", "targetBlank": false}]},
        {"id": 11,
         "type": "stat",
         "title": "Runs in flight",
         "description": "Runs Pending or Running now, each counted once at its latest phase (a replaced kube-state-metrics pod leaves a stale series behind).",
         "gridPos": {"x": 6, "y": 4, "w": 3, "h": 4},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"colorMode": "none", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
         "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "noValue": "0", "color": {"mode": "fixed", "fixedColor": "blue"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}, "overrides": []},
         "targets": [{"refId": "A", "expr": "count(max by (run_id, phase) (agentrun_status_phase{namespace=\"agents\", phase=~\"Pending|Running\"} == 1) and on (run_id, phase) topk by (run_id) (1, timestamp(agentrun_status_phase{namespace=\"agents\"} == 1))) or vector(0)", "instant": true}],
         "links": [{"title": "Open agent-fleet", "url": "/d/agent-fleet/agent-fleet?$${__url_time_range}", "targetBlank": false}]},
        {"id": 12,
         "type": "stat",
         "title": "Tasks waiting for a human",
         "description": "Tasks in AwaitingHuman or Escalated: each holds one of the factory's awaiting-human slots. Listed below with their wait.",
         "gridPos": {"x": 9, "y": 4, "w": 3, "h": 4},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
         "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "noValue": "0", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
         "targets": [{"refId": "A", "expr": "sum(agent_factory_tasks{phase=~\"AwaitingHuman|Escalated\"}) or vector(0)", "instant": true}],
         "links": [{"title": "Open agent-room", "url": "/d/agent-room/agent-room?$${__url_time_range}", "targetBlank": false}]},
        {"id": 13,
         "type": "stat",
         "title": "Approvals pending",
         "description": "Approvals the room broker holds open, over all rooms. The oldest pending one is on the room dashboard.",
         "gridPos": {"x": 12, "y": 4, "w": 3, "h": 4},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
         "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "noValue": "0", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
         "targets": [{"refId": "A", "expr": "max(rooms_approvals_pending) or vector(0)", "instant": true}],
         "links": [{"title": "Open agent-room", "url": "/d/agent-room/agent-room?$${__url_time_range}", "targetBlank": false}]},
        {"id": 14,
         "type": "stat",
         "title": "PRs opened",
         "description": "Pull requests the factory opened in the range. Recorded when the factory sees them.",
         "gridPos": {"x": 15, "y": 4, "w": 3, "h": 4},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"colorMode": "none", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
         "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "noValue": "0", "color": {"mode": "fixed", "fixedColor": "blue"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}, "overrides": []},
         "targets": [{"refId": "A", "expr": "sum(increase_pure(agent_factory_prs_opened_total[$__range]))", "instant": true}],
         "links": [{"title": "Open agent-factory", "url": "/d/agent-factory/agent-factory?$${__url_time_range}", "targetBlank": false}]},
        {"id": 15,
         "type": "stat",
         "title": "PRs merged",
         "description": "Pull requests merged in the range, by the factory or a human. Recorded at the factory's merge poll, so a merge can show up one poll late.",
         "gridPos": {"x": 18, "y": 4, "w": 3, "h": 4},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"colorMode": "none", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
         "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "noValue": "0", "color": {"mode": "fixed", "fixedColor": "blue"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}, "overrides": []},
         "targets": [{"refId": "A", "expr": "sum(increase_pure(agent_factory_pr_outcomes_total{outcome=~\"auto_merged|human_merged\"}[$__range]))", "instant": true}],
         "links": [{"title": "Open agent-factory", "url": "/d/agent-factory/agent-factory?$${__url_time_range}", "targetBlank": false}]},
        {"id": 16,
         "type": "stat",
         "title": "PRs reverted",
         "description": "Merged pull requests reverted in the range. Red at 1: a revert is the factory's worst outcome (SC-11 allows 5 % of auto-merges).",
         "gridPos": {"x": 21, "y": 4, "w": 3, "h": 4},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "options": {"colorMode": "value", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
         "fieldConfig": {"defaults": {"unit": "short", "decimals": 0, "noValue": "0", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
         "targets": [{"refId": "A", "expr": "sum(increase_pure(agent_factory_pr_outcomes_total{outcome=\"reverted\"}[$__range]))", "instant": true}],
         "links": [{"title": "Open agent-factory", "url": "/d/agent-factory/agent-factory?$${__url_time_range}", "targetBlank": false}]},
        {"id": 17,
         "type": "timeseries",
         "title": "Spend per hour, by model",
         "description": "What the meter priced per hour, by model (agent_factory_model_cost_usd_total), stacked. Hourly buckets, counted from 0 for a model first seen inside the range.",
         "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "interval": "1h",
         "fieldConfig": {"defaults": {"noValue": "0", "unit": "currencyUSD", "custom": {"drawStyle": "bars", "fillOpacity": 80, "stacking": {"mode": "normal"}}}, "overrides": []},
         "targets": [{"refId": "A", "expr": "sum by (model) (increase_pure(agent_factory_model_cost_usd_total[1h]))", "legendFormat": "{{model}}"}]},
        {"id": 18,
         "type": "table",
         "title": "Waiting for a human",
         "description": "Tasks waiting for a human now and for how long (task = room for a factory task). A task id opens its room dashboard.",
         "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "fieldConfig": {"defaults": {"noValue": "nothing is waiting"}, "overrides": [{"matcher": {"id": "byName", "options": "waiting"}, "properties": [{"id": "unit", "value": "s"}]}, {"matcher": {"id": "byName", "options": "task"}, "properties": [{"id": "links", "value": [{"title": "Open this room", "url": "/d/agent-room/agent-room?var-room=$${__value.text}&$${__url_time_range}"}]}]}]},
         "targets": [{"refId": "A", "expr": "agent_factory_task_phase_seconds{phase=~\"AwaitingHuman|Escalated\"}", "instant": true, "format": "table"}],
         "transformations": [{"id": "organize", "options": {"renameByName": {"Value": "waiting"}}}, {"id": "filterFieldsByName", "options": {"include": {"names": ["task", "phase", "waiting"]}}}, {"id": "sortBy", "options": {"sort": [{"field": "waiting", "desc": true}]}}]},
        {"id": 19,
         "type": "timeseries",
         "title": "Runs by phase",
         "description": "Runs per phase over time, each run at its latest phase only (two kube-state-metrics pods for a moment would otherwise count it twice).",
         "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "fieldConfig": {"defaults": {"noValue": "0", "custom": {"drawStyle": "line", "fillOpacity": 20, "stacking": {"mode": "normal"}}}, "overrides": []},
         "targets": [{"refId": "A", "expr": "sum by (phase) (max by (run_id, phase) (agentrun_status_phase{namespace=\"agents\"} == 1) and on (run_id, phase) topk by (run_id) (1, timestamp(agentrun_status_phase{namespace=\"agents\"} == 1)))", "legendFormat": "{{phase}}"}]},
        {"id": 20,
         "type": "timeseries",
         "title": "Pull requests by outcome",
         "description": "Outcomes the factory recorded, per hour (opened is on the PRs opened tile). Hourly buckets, counted from 0.",
         "gridPos": {"x": 12, "y": 16, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "interval": "1h",
         "fieldConfig": {"defaults": {"noValue": "0", "custom": {"drawStyle": "bars", "fillOpacity": 80, "stacking": {"mode": "normal"}}}, "overrides": []},
         "targets": [{"refId": "A", "expr": "sum by (outcome) (increase_pure(agent_factory_pr_outcomes_total[1h]))", "legendFormat": "{{outcome}}"}]},
        {"id": 21,
         "type": "table",
         "title": "Agent alerts firing",
         "description": "The alerts of the agent-* rule groups firing now; each carries its runbook and dashboard annotation.",
         "gridPos": {"x": 0, "y": 24, "w": 24, "h": 6},
         "datasource": {"type": "prometheus", "uid": "$${datasource}"},
         "fieldConfig": {"defaults": {"noValue": "no agent alert is firing"}, "overrides": []},
         "targets": [{"refId": "A", "expr": "ALERTS{alertstate=\"firing\", alertgroup=~\"agent-.*\"}", "instant": true, "format": "table"}],
         "transformations": [{"id": "filterFieldsByName", "options": {"include": {"names": ["alertname", "severity", "alertgroup"]}}}]}
      ]
    }
