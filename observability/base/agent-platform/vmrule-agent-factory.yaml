---
# Agent factory alerts (SP3 §7). Inside the umbrella: a suspended factory alerts on nothing.
# Phase 8 added the rest of the set, and the factory dashboard (Task 8.3) is what `dashboard`
# points at.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: agent-factory
  namespace: observability
spec:
  groups:
    - name: agent-factory
      rules:
        - alert: AgentFactoryIntakeErrors
          expr: sum(rate(agent_factory_intake_errors_total[5m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "The agent factory has failed to poll its triggers for 15 minutes"
            description: "Labelled issues are not becoming tasks. Only the leader polls, so read every replica: kubectl logs -n agent-system -l app.kubernetes.io/name=agent-factory --prefix | grep 'poll failed'. A 401 from GitHub means the factory App key or installation changed."
            runbook_url: "https://github.com/Smana/cloud-native-ref/blob/main/docs/superpowers/specs/2026-09-23-agent-dark-factory-design.md#1-intake"
            dashboard: "https://grafana.${private_domain_name}/d/agent-factory"
        - alert: AgentFactoryAutoMergeReverted
          expr: sum(increase(agent_factory_pr_outcomes_total{outcome="reverted"}[15m])) > 0
          labels:
            severity: warning
          annotations:
            summary: "An auto-merged agent PR was reverted"
            description: "Its class is paused until the factory config changes (§6.4). Read why on the task: kubectl get task -n agent-system -o wide | grep Reverted"
            runbook_url: "https://github.com/Smana/cloud-native-ref/blob/main/docs/superpowers/specs/2026-09-23-agent-dark-factory-design.md#64-rollback"
            dashboard: "https://grafana.${private_domain_name}/d/agent-factory"
        - alert: AgentFactoryDailyBudgetHigh
          # Truthful costs TC8: the day in USD (the USD gauges since agent-platform v0.16.0, pinned here at v0.17.1). spent is unclamped, so a day
          # past its cap keeps firing; the meter records yesterday's principals at 0 on a day's first tick.
          expr: agent_factory_budget_spent_usd / agent_factory_budget_cap_usd > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.principal }} has spent more than 80 % of today's budget in USD"
            description: "Past the cap, runs are refused (429) or revoked with budget-principal once budgets.enforcePrincipal is on; until then nothing is refused and AgentPersonCapShadowRefusal fires instead. The caps are budgets.factoryDailyUSD and humanDailyUSD. Resets at 00:00 UTC."
            runbook_url: "https://github.com/Smana/cloud-native-ref/blob/main/docs/superpowers/specs/2026-09-23-agent-dark-factory-design.md#62-caps-and-budgets"
            dashboard: "https://grafana.${private_domain_name}/d/agent-factory"
        - alert: AgentPersonCapShadowRefusal
          # Per-person caps' shadow week (D8): one alert per would-be refusal, by the key over, so the
          # owner judges it while the task is fresh. system:factory stays in: enforcePrincipal also
          # enforces the fleet's day. The counter has no series until its first increment.
          expr: sum by (principal) (increase(agent_factory_run_revocations_total{reason="budget-principal-shadow"}[15m])) > 0
          labels:
            severity: info
          annotations:
            summary: "{{ $labels.principal }}'s day is spent: a run was admitted that enforcePrincipal would refuse"
            description: "Shadow only: nothing was refused. It is a false refusal if the run should have been admitted (wrong person charged, or a day filled by reservations the meter later released). Read the day's ledger, in micro-USD: kubectl get cm -n agent-system agent-factory-ledger-usd-<YYYYMMDD> -o yaml"
            runbook_url: "https://github.com/Smana/ai-native-ref/blob/main/docs/runbooks/agent-factory/04-gateway-secrets-budgets.md#part-c--per-person-caps-the-shadow-week"
            dashboard: "https://grafana.${private_domain_name}/d/agent-factory"
        - alert: AgentFactoryTaskStuck
          # Waiting phases (Queued, AwaitingHuman, Escalated) are excluded: they wait by design.
          expr: max by (task, phase) (agent_factory_task_phase_seconds{phase=~"Received|Triaged|Implementing|Reviewing|AwaitingCI|AutoMerging|Verifying"}) > 7200
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Agent factory task {{ $labels.task }} has been {{ $labels.phase }} for over 2 hours"
            description: "kubectl get task -n agent-system {{ $labels.task }} -o yaml; the factory's logs carry task.id={{ $labels.task }}."
            runbook_url: "https://github.com/Smana/cloud-native-ref/blob/main/docs/superpowers/specs/2026-09-23-agent-dark-factory-design.md#4-orchestrator"
            dashboard: "https://grafana.${private_domain_name}/d/agent-factory"
        - alert: PolicyBotUnavailable
          expr: kube_deployment_status_replicas_available{namespace="merge-gate", deployment="policy-bot"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "policy-bot has no ready pod: agent PRs wait, owner and Renovate PRs bypass"
            description: "kubectl get pods -n merge-gate; webhook delivery errors are in the ogenki-merge-gate App's Advanced tab."
            runbook_url: "https://github.com/Smana/cloud-native-ref/blob/main/docs/superpowers/specs/2026-09-23-agent-dark-factory-design.md#5-merge-policy-gate-d4"
            dashboard: "https://grafana.${private_domain_name}/d/agent-factory"
        - alert: AgentFactoryKillSwitchEngaged
          expr: max(agent_factory_kill_switch_engaged) == 1
          labels:
            severity: info
          annotations:
            summary: "The agent factory's stop is engaged"
            description: "Resume: kubectl -n agent-system delete configmap agent-factory-stop, and remove factory/stop from the control issue."
            runbook_url: "https://github.com/Smana/cloud-native-ref/blob/main/docs/superpowers/specs/2026-09-23-agent-dark-factory-design.md#61-kill-switch"
            dashboard: "https://grafana.${private_domain_name}/d/agent-factory"
        - alert: FactoryGitHubUnreachable
          # Readiness ignores GitHub (agent-platform #83), so this per-replica gauge is the only signal.
          expr: agent_factory_github_up == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Agent factory replica {{ $labels.pod }} has not reached GitHub for 10 minutes"
            description: "No task advances while GitHub is unreachable, and the replicas stay Ready. Check githubstatus.com, then the App key: kubectl logs -n agent-system -l app.kubernetes.io/name=agent-factory --prefix | grep -i github. The loops recover by themselves when GitHub returns."
            runbook_url: "https://github.com/Smana/agent-platform/blob/main/docs/operations.md#common-failures"
            dashboard: "https://grafana.${private_domain_name}/d/agent-factory"
        - alert: AgentFactoryMeterBlind
          # Leader-only gauge, hence max() and absent(). for: 1m because enforced admission already
          # refuses (503 meter_blind) once the heartbeat is 5 minutes old (agent-platform #87).
          expr: (time() - max(agent_factory_meter_last_success_timestamp_seconds) > 300) or absent(agent_factory_meter_last_success_timestamp_seconds)
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "The agent factory's meter has not read token usage for over 5 minutes"
            description: "With budgets.enforcePrincipal on, new runs are refused (503 meter_blind) and Queued tasks wait with waiting_meter_blind; active runs continue to their deadline and are revoked on recovery. Read the leader's logs: kubectl logs -n agent-system -l app.kubernetes.io/name=agent-factory --prefix | grep -i meter"
            runbook_url: "https://github.com/Smana/agent-platform/blob/main/docs/operations.md#metrics"
            dashboard: "https://grafana.${private_domain_name}/d/agent-factory"
        - alert: AgentFactoryRepositoryNotOwned
          # The fence gauge (agent-platform #125) is per replica; max() so one replica's stale read
          # does not page. No absent(): before a release carries the gauge this matches nothing.
          expr: max by (repository) (agent_factory_repository_owned) == 0
          for: 20m
          labels:
            severity: warning
          annotations:
            summary: "The agent factory does not own {{ $labels.repository }}"
            description: "Its .github/agent-factory.yaml on the default branch is absent, unparsable, or names another factory (a read failing for 15 minutes counts too): no intake, schedules, API runs or merges there. Check the file, then: kubectl logs -n agent-system -l app.kubernetes.io/name=agent-factory --prefix | grep -i fence"
            runbook_url: "https://github.com/Smana/agent-platform/blob/main/docs/operations.md#factory-alerts"
            dashboard: "https://grafana.${private_domain_name}/d/agent-factory"
        - alert: AgentModelUnpriced
          # J-AC4: a model served a run with no meter.prices row. The run is held to its token
          # caps, never metered at $0, but a USD cap cannot bite on it.
          expr: sum by (model) (increase(agent_factory_meter_unpriced_model_runs_total[1h])) > 0
          labels:
            severity: warning
          annotations:
            summary: "Model {{ $labels.model }} served agent runs without a price"
            description: "Add its row to meter.prices in tooling/base/agent-factory/helm-values-configmap.yaml, from the provider's list price (input, cacheRead, output, and cacheWrite where the provider bills it). Until then its runs are capped in tokens. The leader's log names each run: kubectl logs -n agent-system -l app.kubernetes.io/name=agent-factory --prefix | grep 'without a price'"
            runbook_url: "https://github.com/Smana/agent-platform/blob/main/docs/operations.md#budget-signals"
            dashboard: "https://grafana.${private_domain_name}/d/agent-factory"
        - alert: AgentMeterInputExcludesCache
          # Truthful costs TC4. Every gateway counts cache tokens inside `input`: the charge rule
          # (vmrule-llm-gateway.yaml), the agent-cache share and the gateway budgets' CEL rest on it.
          # The meter counts each run whose input reads below its cache tokens, once per model, and
          # prices it right. The counter is born at its first increment, which promtool's increase()
          # reads as 0: compare with an hour ago, absence read as 0 (as agent_router:budget_*).
          expr: sum by (model) (clamp_min(agent_factory_meter_input_excludes_cache_runs_total - (agent_factory_meter_input_excludes_cache_runs_total offset 1h or agent_factory_meter_input_excludes_cache_runs_total * 0), 0)) > 0
          labels:
            severity: warning
          annotations:
            summary: "A gateway counted {{ $labels.model }}'s input without its cache tokens"
            description: "The meter priced those runs right, as fresh input. Every cost read through llm_gateway:charge_usd_per_mtoken under-counts them, down to a negative figure: the agent-run Cost panel and AnthropicFleetNearCap. A gateway path or the provider changed its usage shape: run test-agent-gateway-cache-wire against the deployed agentgateway digest. The leader's log names each run: kubectl logs -n agent-system -l app.kubernetes.io/name=agent-factory --prefix | grep 'without its cache tokens'"
            runbook_url: "https://github.com/Smana/ai-native-ref/blob/main/docs/runbooks/agent-factory/04-gateway-secrets-budgets.md#part-e--the-cache-read-share"
            dashboard: "https://grafana.${private_domain_name}/d/agent-factory"
