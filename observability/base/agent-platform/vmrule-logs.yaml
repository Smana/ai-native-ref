---
# LogsQL rules: promtool cannot parse them, so validate-vmrules.sh skips this
# group by its `type` and says so on every run.
# runbook_url points at the integration branch: the agent-factory runbooks live there until
# Phase 7 re-points them (Ruling G).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: agent-platform-logs
  namespace: observability
  labels:
    vmlog: "true"
spec:
  groups:
    - name: agent-platform-logs
      type: vlogs
      interval: 5m
      rules:
        # The agent router's 401/403 burst is AgentGatewayUnauthorizedBurst, a metric rule (vmrule.yaml).
        # The SDK-shape failure only (cache design C1): the harness could not patch the SDK's model
        # call, so it sends no cache marker at all. AgentCacheReadZero catches the same loss from
        # the gateway side, and also a gateway that drops the marker, which logs nothing.
        - alert: AgentCacheMarkerMissing
          expr: 'kubernetes.pod_namespace:"agents" AND kubernetes.pod_name:run-* AND _msg:"prompt cache NOT applied" | stats count() as lines | filter lines:>0'
          labels:
            severity: warning
          annotations:
            summary: "A run's harness logged 'prompt cache NOT applied': internal runs pay the full input price on every step"
            description: "An OpenHands SDK upgrade moved the method the harness patches (images/agent-harness/site/sitecustomize.py in agent-platform). Roll the harness pin back, then fix the patch."
            runbook_url: "https://github.com/Smana/ai-native-ref/blob/main/docs/runbooks/agent-factory/04-gateway-secrets-budgets.md#part-e--the-cache-read-share"
            dashboard: "https://grafana.${private_domain_name}/d/agent-gateway"
        # GitHub egress tightening (Maku spec 2026-11-26): a run reached a GitHub release host after its
        # harness closed the install set, so the agent, not the toolchain install, tried a download. A
        # LogsQL rule: the egress proxy's metrics are not scraped here, and its log names the run.
        - alert: MakuEgressInstallClosedRefusal
          expr: 'kubernetes.pod_namespace:"agent-system" AND kubernetes.container_name:"egress-proxy" AND log.reason:"install_closed" | stats count() as lines | filter lines:>0'
          labels:
            severity: warning
          annotations:
            summary: "A run tried to download from a GitHub release host after its toolchain install"
            description: "The egress proxy refused it; nothing was downloaded. Find the run and read its steps for the download it tried: kubectl -n agent-system logs -l app.kubernetes.io/name=egress-proxy --prefix | grep install_closed"
            runbook_url: "https://github.com/Smana/ai-native-ref/blob/main/docs/runbooks/agent-factory/30-github-egress-drill.md"
            dashboard: "https://grafana.${private_domain_name}/d/agent-fleet"
