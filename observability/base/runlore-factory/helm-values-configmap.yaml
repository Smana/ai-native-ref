# Merged into RunLore's values only while the agent-platform umbrella ships it (optional
# valuesFrom, the SECOND entry after runlore-base-values -- lists replace, never merge, so
# this envFrom must own the WHOLE list and restate the base's three entries; TW7).
# RunLore's factory client (feature 14) calls POST /v1/tasks as its internal principal.
apiVersion: v1
kind: ConfigMap
metadata:
  # helm-controller re-reconciles the HelmRelease on change (#2276).
  labels:
    reconcile.fluxcd.io/watch: Enabled
  name: runlore-factory-values
  namespace: runlore
data:
  values.yaml: |
    envFrom:
      - secretRef: {name: runlore-credentials}
      - secretRef: {name: runlore-slack}
      - secretRef: {name: runlore-webhook}
      # Feature 14: RunLore's client credentials and the webhook key. Optional: where the key is absent,
      # the env is empty and RunLore's client stays off.
      - secretRef: {name: runlore-factory-principal, optional: true}
    config:
      # RunLore hands each finding to the factory as its internal principal (feature 14): the factory
      # holds every gate (0.75, five a day), RunLore sends them all.
      factory:
        # TLS since tooling/base/agent-factory sets api.tls (Maku v0.33.0, S-1): a plain request gets 400. The name is
        # on the factory's certificate. ca_file (RunLore v0.20.0, pinned by the host) trusts the platform CA besides the
        # system roots, for the factory and the token endpoint only. The file is the host's static ConfigMap factory-ca,
        # mounted at /etc/runlore-factory-ca: a sibling of /etc/runlore, since a mount inside the read-only config mount
        # cannot be created. RunLore refuses a missing ca_file at start, so the ConfigMap goes on with RunLore's
        # switch (runbook 25 section 1).
        url: https://agent-factory.agent-system.svc:8082
        ca_file: /etc/runlore-factory-ca/ca.crt
        token_url: ${identity_provider_url}/oauth/v2/token
        client_id_env: FACTORY_CLIENT_ID
        client_secret_env: FACTORY_CLIENT_SECRET  # pragma: allowlist secret
        project_id_env: FACTORY_PROJECT_ID
        repository: Smana/cloud-native-ref
        max_cost_usd: 2
        webhook: {secret_env: FACTORY_WEBHOOK_KEY}  # pragma: allowlist secret
        # Stage 2 (RA8): after a fix merges RunLore soaks 30m, then asks Alertmanager whether the alert
        # still fires and reports the verdict to the factory.
        soak: 30m
        # RK5: an accepted incident is drafted once verified; 7d covers a publish, a merge and the follow-up.
        curation: {defer: true, window: 7d}
        verify:
          alertmanager_url: http://vmalertmanager-victoria-metrics-k8s-stack.observability.svc:9093
          max_steps: 6
