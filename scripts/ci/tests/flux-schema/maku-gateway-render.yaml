# helm template model-gateway oci://ghcr.io/smana/charts/maku-gateway --version 0.48.0 with
# infrastructure/base/agent-gateway/model-gateway/helmrelease.yaml's values, issuer https://issuer.example:
# AG15's fixture (test-assert-agent-gateway.py). Re-render it with the chart pin.
---
# The prices agentgateway merges over its built-in catalog to price each response (the access log's
# `cost`), from the factory's meter.prices rows: edit a price there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-gateway-model-catalog
  labels:
    app.kubernetes.io/name: maku-gateway
    app.kubernetes.io/instance: model-gateway
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "v0.48.0"
data:
  catalog.json: |
    {
      "providers": {
        "anthropic": {
          "models": {
            "claude-haiku-5-5": {
              "rates": {
                "cacheRead": "0.05",
                "cacheWrite": "0.625",
                "input": "0.50",
                "output": "2.50"
              }
            },
            "claude-opus-5-5": {
              "rates": {
                "cacheRead": "0.20",
                "cacheWrite": "5.00",
                "input": "4.00",
                "output": "20.00"
              }
            },
            "claude-sonnet-5-5": {
              "rates": {
                "cacheRead": "0.10",
                "cacheWrite": "2.50",
                "input": "2.00",
                "output": "10.00"
              }
            }
          }
        },
        "mistral": {
          "models": {
            "mistral-medium-2604": {
              "rates": {
                "cacheRead": "0.15",
                "input": "1.50",
                "output": "7.50"
              }
            },
            "mistral-small-2603": {
              "rates": {
                "cacheRead": "0.015",
                "input": "0.15",
                "output": "0.60"
              }
            }
          }
        },
        "moonshot": {
          "models": {
            "k3.1-pro": {
              "rates": {
                "cacheRead": "0.20",
                "cacheWrite": "2.00",
                "input": "2.00",
                "output": "10.00"
              }
            }
          }
        },
        "zai": {
          "models": {
            "glm-5.3": {
              "rates": {
                "cacheRead": "0.26",
                "input": "1.40",
                "output": "4.40"
              }
            },
            "glm-5.3-flash": {
              "rates": {
                "cacheRead": "0.03",
                "input": "0.15",
                "output": "0.50"
              }
            },
            "glm-5.3-flashx": {
              "rates": {
                "cacheRead": "0.075",
                "input": "0.37",
                "output": "1.25"
              }
            }
          }
        }
      }
    }

---
# agent-default on zai (zai): the model is forced to the alias whatever the
# body says, then mapped to glm-5.3 (GW5): a caller holds no other alias's audience, so it
# cannot reach another model. The key is read from Secret agents-zai-api-key by reference (D14).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: zai-agent-default
  labels:
    app.kubernetes.io/name: maku-gateway
    app.kubernetes.io/instance: model-gateway
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "v0.48.0"
spec:
  ai:
    provider:
      custom:
        # The catalog key (the model catalog) and the series' provider label.
        providerOverride: zai
        formats:
          - type: Completions
            path: /api/paas/v4/chat/completions
      host: api.z.ai
      port: 443
  policies:
    auth:
      secretRef:
        name: agents-zai-api-key
        key: apiKey
    tls:
      sni: api.z.ai
    ai:
      # Typed routes: the harness, the planner and the classifier speak Chat Completions.
      routes:
        /v1/chat/completions: Completions
      modelAliases:
        agent-default: "glm-5.3"
      transformations:
        - field: model
          expression: '"agent-default"'

---
# kimi-frontier on moonshot (moonshot): the model is forced to the alias whatever the
# body says, then mapped to k3.1-pro (GW5): a caller holds no other alias's audience, so it
# cannot reach another model. The key is read from Secret agents-moonshot-api-key by reference (D14).
