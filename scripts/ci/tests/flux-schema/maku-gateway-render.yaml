  labels:
    app.kubernetes.io/name: maku-gateway
    app.kubernetes.io/instance: model-gateway
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "v0.48.0"
spec:
  ai:
    provider:
      custom:
        # The catalog key (the model catalog) and the series' provider label.
        providerOverride: moonshot
        formats:
          - type: Completions
            path: /coding/v1/chat/completions
      host: api.kimi.ai
      port: 443
  policies:
    auth:
      secretRef:
        name: agents-moonshot-api-key
        key: apiKey
    tls:
      sni: api.kimi.ai
    ai:
      # Typed routes: the harness, the planner and the classifier speak Chat Completions.
      routes:
        /v1/chat/completions: Completions
      modelAliases:
        kimi-frontier: "k3.1-pro"
      transformations:
        - field: model
          expression: '"kimi-frontier"'
        # The moonshot preset: K3.1 Pro fixes temperature at 1, and the planner and the classifier send 0.
        - field: temperature
          expression: '1'
        # The moonshot preset: K3.1 Pro fixes top_p.
        - field: top_p
          expression: 'null'

