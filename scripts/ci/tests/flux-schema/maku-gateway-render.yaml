---
# The same in Cilium's terms, with each provider by FQDN through Cilium's DNS proxy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: model-gateway
  labels:
    app.kubernetes.io/name: maku-gateway
    app.kubernetes.io/instance: model-gateway
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "v0.48.0"
spec:
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: model-gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agents
          matchExpressions:
            - {key: agents.ogenki.io/run-id, operator: Exists}
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
            - {port: "8081", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agent-system
            app.kubernetes.io/name: room-broker
      toPorts:
        - ports:
            - {port: "8082", protocol: TCP}
    # metrics.allowFrom's NetworkPolicy peers as Cilium endpoint selectors: namespace labels under
    # io.cilium.k8s.namespace.labels, pod labels as they are. A peer without a namespaceSelector is in
    # the release namespace; an empty namespaceSelector ({}) is every namespace, which a namespaced
    # Cilium policy states with an Exists on the namespace label (a bare selector means its own).
    - fromEndpoints:
        -
          matchLabels:
            k8s:app.kubernetes.io/name: vmagent
            k8s:io.cilium.k8s.namespace.labels.kubernetes.io/metadata.name: observability
      toPorts:
        - ports:
            - {port: "15020", protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: ANY}
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentgateway-system
            app.kubernetes.io/instance: agentgateway
            app.kubernetes.io/name: agentgateway
      toPorts:
        - ports:
            - {port: "9978", protocol: TCP}
    - toFQDNs:
        - matchName: api.z.ai
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
    - toFQDNs:
        - matchName: api.kimi.ai
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
    - toFQDNs:
        - matchName: api.mistral.ai
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
    - toFQDNs:
        - matchName: api.anthropic.com
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}

---
# The model gateway (D7). One listener per data class, as on cnref's agent-router: an internal run's
# token never reaches a public-only provider, because that provider's routes attach to `public` only.
# `clients` serves the broker's planner and classifier. Routes attach from this namespace only.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: model-gateway
  labels:
    app.kubernetes.io/name: maku-gateway
    app.kubernetes.io/instance: model-gateway
    app.kubernetes.io/part-of: maku
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "v0.48.0"
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: public
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same
    - name: internal
      protocol: HTTP
      port: 8081
      allowedRoutes:
        namespaces:
          from: Same
    - name: clients
      protocol: HTTP
      port: 8082
      allowedRoutes:
        namespaces:
          from: Same
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: model-gateway

---
# /m/agent-default on public: a caller's base URL is
# http://model-gateway.<namespace>.svc:<port>/m/agent-default/v1; each path is matched exactly and
# rewritten to the backend's typed route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maku-models-public-agent-default
  labels:
    app.kubernetes.io/name: maku-gateway
    app.kubernetes.io/instance: model-gateway
