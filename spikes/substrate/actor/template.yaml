# Substrate ActorTemplate (protojson ateapipb.ActorTemplate), created with
#   kubectl ate create actor-template -f template.yaml
# It lives in Substrate's PostgreSQL, not etcd. GOLDEN_MODE is set by the README:
# GOLDEN_SNAPSHOT_MODE_DISABLED for openhands-cold, GOLDEN_SNAPSHOT_MODE_ENABLED for openhands-warm.
metadata:
  atespace: substrate-spike
  name: TEMPLATE_NAME
workerSelector:
  matchLabels:
    spike: substrate
containers:
  # The image the factory's harness is built on (agent-platform images/agent-harness), without
  # the factory's run wrapper.
  - name: agent-server
    image: ghcr.io/openhands/agent-server:1.49.6-python@sha256:02ef66fdf0b22a40b0b55c5cca8d1790cfd260c5069f7c0b99edc1b505d5ab37
    args: ["--host", "0.0.0.0", "--port", "8000"]
    env:
      - {name: OH_ENABLE_VSCODE, value: "false"}
      - {name: LOG_JSON, value: "true"}
    wakeupProbe:
      httpGet: {path: /health, port: 8000}
      timeoutSeconds: 300
  # An OpenAI-compatible model that answers every completion with the same message, so a
  # conversation advances with no key and no egress. Same image: no second pull.
  - name: mock-llm
    image: ghcr.io/openhands/agent-server:1.49.6-python@sha256:02ef66fdf0b22a40b0b55c5cca8d1790cfd260c5069f7c0b99edc1b505d5ab37
    command:
      - /usr/local/bin/python
      - -c
      - |
        import json, time
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        class H(BaseHTTPRequestHandler):
            def _send(self, body):
                b = json.dumps(body).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(b)))
                self.end_headers()
                self.wfile.write(b)
            def do_GET(self):
                self._send({"object": "list", "data": [{"id": "mock", "object": "model"}]})
            def do_POST(self):
                self.rfile.read(int(self.headers.get("Content-Length", 0)))
                self._send({"id": "mock-%d" % time.time_ns(), "object": "chat.completion",
                            "created": int(time.time()), "model": "mock",
                            "choices": [{"index": 0, "finish_reason": "stop",
                                         "message": {"role": "assistant", "content": "PONG"}}],
                            "usage": {"prompt_tokens": 1, "completion_tokens": 1, "total_tokens": 2}})
            def log_message(self, *a):
                pass
        ThreadingHTTPServer(("127.0.0.1", 4000), H).serve_forever()
resources:
  limits:
    - {name: cpu, quantity: "2"}
    - {name: memory, quantity: 4Gi}
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
  storageLocation: s3://ate-snapshots/substrate-spike/TEMPLATE_NAME/
  goldenSnapshotConfig:
    mode: GOLDEN_MODE
sandboxConfig:
  sandboxClass: gvisor
  configName: gvisor-default
