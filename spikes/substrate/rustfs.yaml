# Snapshot store: upstream's kind overlay (manifests/ate-install/kind/rustfs.yaml at v0.5.0), with
# the credentials moved into the rustfs-credentials Secret the README creates at apply time.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: ate-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: ate-system
spec:
  selector:
    app: rustfs
  ports:
    - name: api
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: ate-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0-beta.3@sha256:378642b05b7dcb4849fb77ebe6aca4ced1c3f66e7e504247df95a5c9018d3358
          ports:
            - containerPort: 9000
              name: api
          env:
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: rustfs-credentials, key: AWS_ACCESS_KEY_ID}
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: rustfs-credentials, key: AWS_SECRET_ACCESS_KEY}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            tcpSocket: {port: 9000}
          livenessProbe:
            tcpSocket: {port: 9000}
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rustfs
  namespace: ate-system
spec:
  podSelector:
    matchLabels:
      app: rustfs
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [ate-api-server, atelet, rustfs-bucket-init]}
      ports:
        - {protocol: TCP, port: 9000}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-bucket-init
  namespace: ate-system
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: rustfs-bucket-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-bucket
          image: amazon/aws-cli:2.17.0@sha256:643507c10ada7964ca6157b3d799f030b90577643da9955d319a77399ed80d73
          envFrom:
            - secretRef: {name: rustfs-credentials}
          env:
            - {name: HOME, value: /tmp}
            - {name: AWS_REGION, value: us-east-1}
            - {name: AWS_ENDPOINT_URL, value: "http://rustfs.ate-system.svc:9000"}
          command:
            - /bin/sh
            - -c
            - |
              for i in $(seq 1 60); do
                aws s3api head-bucket --bucket ate-snapshots 2>/dev/null && exit 0
                aws s3api create-bucket --bucket ate-snapshots 2>/dev/null && exit 0
                sleep 2
              done
              exit 1
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
