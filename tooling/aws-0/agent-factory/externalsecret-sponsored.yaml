# The chart's sponsoredSecret on aws-0 (mounted optional, 0440): the principals' client ids and the
# project id api.projectIDFile names. On aws-0 the factory's Kustomization owns this Secret (RunLore's
# principal needs it with or without the App), and aws-0's slack-app overlay deletes base's copy of this
# ExternalSecret: two Kustomizations must not own one object. Its keys and sources are base's
# (tooling/base/agent-factory/slack-app/externalsecret-sponsored.yaml, which gcp-0 applies).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-factory-sponsored
  namespace: agent-system
spec:
  refreshInterval: 20m
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  target:
    name: agent-factory-sponsored
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: slack-app-client-id  # pragma: allowlist secret
      remoteRef: {key: factory-slack-principal, property: client-id}
    - secretKey: runlore-client-id  # pragma: allowlist secret
      remoteRef: {key: runlore-principal, property: client-id}
    - secretKey: project-id  # pragma: allowlist secret
      remoteRef: {key: factory-slack-principal, property: project-id}
