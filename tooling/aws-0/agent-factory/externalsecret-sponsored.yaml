# The chart's sponsoredSecret on aws-0 (mounted optional, 0440): RunLore's client id and the project id
# api.projectIDFile names, both from runlore-principal (H5). aws-0 applies no Slack App, so the base
# slack-app/externalsecret-sponsored.yaml never renders here; this holds the runlore properties only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-factory-sponsored
  namespace: agent-system
spec:
  refreshInterval: 20m
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  target:
    name: agent-factory-sponsored
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: runlore-client-id  # pragma: allowlist secret
      remoteRef: {key: runlore-principal, property: client-id}
    - secretKey: project-id  # pragma: allowlist secret
      remoteRef: {key: runlore-principal, property: project-id}
