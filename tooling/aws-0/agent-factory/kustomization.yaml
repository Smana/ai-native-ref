apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A render root of its own, so CI renders this base with aws-0's fixture values
# (GCP parity GP-14). The Flux child for aws-0 points here.
resources:
  - ../../base/agent-factory
  - helm-values-internal.yaml
  - externalsecret-sponsored.yaml

patches:
  # Helm deep-merges valuesFrom in order: this entry adds RunLore's internal principal (RK15), merged last,
  # as gcp-0's does for agent-factory-helm-values-sponsored.
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: agent-factory
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: agent-factory-helm-values-internal
