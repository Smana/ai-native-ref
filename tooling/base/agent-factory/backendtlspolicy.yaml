# The tailnet gateway verifies the factory's certificate (httproute.yaml): Cilium 1.20 originates TLS to a
# backend through a BackendTLSPolicy. The target is the Service port named `https`, which the chart gives
# port 8082 once api.tls is set. The hostname is the in-cluster name the certificate already carries, so no
# tailnet name is added to it. The CA is the platform's, a static ConfigMap per cloud (aws-0's:
# tooling/aws-0/agent-factory/configmap-agent-factory-ca.yaml; gcp-0 has none): the policy and the ConfigMap
# share a namespace, so no ReferenceGrant.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: agent-factory
  namespace: agent-system
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: agent-factory
      sectionName: https
  validation:
    hostname: agent-factory.agent-system.svc
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: agent-factory-ca
