# The CRDs' signed chart. Beside its HelmRelease, as agentgateway-crds is: no other child reads it.
# Same Maku release as agent-factory's chart (test-agent-factory-pins.py): bump both together.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agent-factory-crds
  namespace: agent-system
spec:
  interval: 12h
  url: oci://ghcr.io/smana/charts/agent-factory-crds
  # Flux pulls the digest (it wins over the tag). The tag stays for Renovate and for readers.
  ref:
    tag: "0.53.2-pr618.g9d0bdb48"
    digest: sha256:bf3b951249e3bbd8981e10a0e0fc908fe791f77543dd6451e114ddc2f480bfe7
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: "^https://token\\.actions\\.githubusercontent\\.com$"
        subject: "^https://github\\.com/Smana/maku/\\.github/workflows/(release\\.yaml@refs/tags/v.*|ci\\.yaml@refs/pull/[0-9]+/merge)$"
