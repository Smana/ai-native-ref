# The agents' App (C6), for the factory's per-run token minter (R3, Maku v4 D10): each run's
# <run>-git Secret is an installation token of this App, scoped to the run's repository and role.
# OpenBao's github-app key, through agent-system's own store. Mounted by the chart's apps.agents.existingSecret; never the factory's
# or the merger's App, which the chart refuses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-factory-agents-app
  namespace: agent-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  target:
    name: agent-factory-agents-app
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: app_id  # pragma: allowlist secret
      remoteRef: {key: github-app, property: app_id}
    - secretKey: private_key  # pragma: allowlist secret
      remoteRef: {key: github-app, property: private_key}
