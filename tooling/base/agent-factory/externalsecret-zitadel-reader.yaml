# The broker's read-only ZITADEL reader ({"pat", "githubIdpId"}), the same OpenBao entry
# room-broker-zitadel-reader reads, as a Secret of the factory's own: the chart mounts it at
# config.api.access.readerFile to resolve a run requester's GitHub login (agent-platform v0.14.0).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-factory-zitadel-reader
  namespace: agent-system
spec:
  refreshInterval: 20m
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  data:
    - secretKey: reader.json # pragma: allowlist secret
      remoteRef:
        key: zitadel-reader
  target:
    name: agent-factory-zitadel-reader
    creationPolicy: Owner
    deletionPolicy: Retain
