# The factory's values, config included (internal/factory/config, parsed strictly: a bad
# config fails the rollout). Tier caps are the design's §6.2 defaults (OD-10).
apiVersion: v1
kind: ConfigMap
metadata:
  # helm-controller upgrades the release when this ConfigMap changes, not on the
  # next 30m interval: the chart (flux/sources) and this tag (tooling) reach the
  # cluster through different Kustomizations, in either order (#2276).
  labels:
    reconcile.fluxcd.io/watch: Enabled
  name: agent-factory-helm-values
  namespace: agent-system
data:
  values.yaml: |  # pragma: allowlist secret -- Secret names and key file paths, no credential value
    image:
      repository: ghcr.io/smana/maku-factory
      # maku v0.48.0, the chart's appVersion.
      # renovate: datasource=docker depName=ghcr.io/smana/maku-factory
      tag: "v0.48.0@sha256:ff345d5594a03c13f929f964b76d99de6402065d4bee6f8e1fd6da00dcde23f3"
    # The post-merge monitor's read-only ClusterRole (get gitrepositories, list kustomizations and
    # helmreleases): gcp-0's factory reads the host's Flux, aws-0 renders the same role. No class
    # declares `monitor.flux` yet, so nothing reads through it.
    monitor: {flux: {enabled: true}}
    # The cluster's shared ClusterRoles (maku-factory-admin, maku-mergepolicy-editor, maku-viewer,
    # agent-factory-flux-reader) are agent-factory-crds' since Maku v0.48.0 (D2): one set per cluster.
    # Both releases rendering them fails the CRD chart's upgrade on Helm's ownership check.
    clusterRoles: false
    # Explicit so they visibly agree with externalsecret-github.yaml and agent-secrets' openbao-ca.
    # The GitHub Apps under the chart's apps.* keys (Maku v4 D12): githubSecret and mergerSecret go
    # in Maku's v4 step 8. The merger stays its own App, from the chart's agent-factory-merger
    # Secret: mode separate is explicit because step 8 makes `factory` the default.
    apps:
      factory: {existingSecret: agent-factory-github}
      # The agents' App (externalsecret-agents-app.yaml), the per-run token minter's (R3).
      agents: {existingSecret: agent-factory-agents-app}
      merger: {mode: separate}
    # Each run's git token is its own Secret, <run>-git in agents, minted from the agents' App for the
    # run's repository and role (Maku v4 D10). The run-controller mounts it (runController.gitTokens
    # perRun in infrastructure/base/room-broker/helmrelease.yaml); the chart's admission policy bounds
    # the factory's create, patch and delete on Secrets there to those it labels and the run owns.
    runTokens: {enabled: true, perRun: true}
    brokerCASecret: openbao-ca
    zitadelReaderSecret: agent-factory-zitadel-reader  # externalsecret-zitadel-reader.yaml, at api.access.readerFile
    config:
      # The ownership fence (agent-platform v0.14.0): a repository is acted on only while its
      # .github/agent-factory.yaml names this factory, so aws-0 and gcp-0 never take the same issue.
      factory: ${cluster_name}
      # The run-controller's runs (R3), not the Crossplane XR: maku.ogenki.io AgentRuns named run-<id>.
      # They call the model gateway with their own token (runController.model.mode gateway), so the
      # meter prices them from its series.
      runs:
        group: maku.ogenki.io
        namespace: agents
        namePrefix: run-
        gatewayIdentity: true
      # Merge policy stages 1-3: the observer compares each owned repository's
      # .github/agent-factory.yaml with this config (read), unlocks the offline `maku policy
      # simulate|diff` verbs (simulation), and re-decides every merge under the repository policy
      # without acting on it (dualEvaluation). Promotion (stage 6) serves each class's shadow
      # evidence to the broker's settings pages; it changes no class. The central config stays the
      # only merge authority: repositoryAuthority is off.
      policyManagement: {read: true, simulation: true, dualEvaluation: true, promotion: true}
      # The catalogue (harnessProfiles, control, defaults, triage, tiers, templates, caps, facts,
      # brief, budgets, resume, loops, meter.prices) is the Factory, and the repositories with their
      # classes and merge rules are the Repository and MergePolicy objects, in resources/ beside this
      # file (Maku factory resources): the factory reads them live. What stays here is plumbing and the
      # startup switches, read once at start: a change here is a rollout.
      # scripts/ci/validate-factory-config.sh lays the objects over this config as the factory does.
      #
      # No runlore block: RunLore's intake is off (R14) and RunLore reaches the factory through
      # api.internalPrincipals. Whoever adds runlore.listen sets runlore.repository with it: unset, it
      # is the first repository served, which moves as Repository objects come and go.
      factoryLogin: ogenki-agent-factory[bot]
      agentsLogin: ogenki-agents[bot]
      roomsURL: https://rooms.${private_domain_name}
      # The broker's system API is TLS on both clouds (GP-18, ruling SC).
      broker:
        url: https://room-broker.agent-system.svc.cluster.local:8443
        caFile: /etc/agent-factory/openbao-ca/ca.crt
        tokenFile: /var/run/secrets/agents/rooms/token
      # The chart writes these four only with apps.merger.mode factory; with separate it mounts the
      # two Secrets at these paths and the factory reads them from here.
      github:
        appIDFile: /etc/agent-factory-github/app_id
        privateKeyFile: /etc/agent-factory-github/private_key
        mergerAppIDFile: /etc/agent-factory-merger/app_id
        mergerKeyFile: /etc/agent-factory-merger/private_key
      # The run-request API (FR-5): tailnet only via the HTTPRoute, tokens checked
      # offline against ZITADEL's JWKS; the client ids ride the chart's oidcSecret mount.
      api:
        # Plaintext inside the mesh; 8443 is the broker's TLS listener (agent-platform#111).
        listen: ":8082"
        humanIssuer: ${identity_provider_url}
        humanJWKS: ${identity_provider_url}/oauth/v2/keys
        clientIDFiles:
          - /etc/agent-factory-oidc/rooms-proxy-client-id
          - /etc/agent-factory-oidc/roomctl-client-id
        # Resolves a human caller to their GitHub login (the broker's ZITADEL reader, mounted from
        # externalsecret-zitadel-reader.yaml); write on the repository is then asked of GitHub.
        # Without it every human run is refused 403 repository_permission.
        access:
          readerFile: /etc/agent-factory-zitadel-reader/reader.json
          ttl: 5m
        # Sponsored principals (factory interfaces part 2), none declared (D4): a gcp-0 session declares
        # the Slack App in gcp-0's copy (runbook 18). It needs meter.prices, and projectIDFile beside it;
        # the chart mounts both files from sponsoredSecret (agent-factory-sponsored, optional). The name
        # and the client id file are the broker's human.mcp.sponsored entry's.
        # projectIDFile: /etc/agent-factory-sponsored/project-id
        # sponsored:
        #   - name: slack-app
        #     clientIDFile: /etc/agent-factory-sponsored/slack-app-client-id
        #     sponsor: <a maintainer's GitHub login>
        #     repositories: [Smana/cloud-native-ref]
        #     dailyUSD: <in (0, budgets.factoryDailyUSD]>
        #     maxCostUSD: <in (0, dailyUSD]>
        #     onBehalfOf:
        #       slack: {"<team id>/<user id>": <maintainer login>}
      poll: {issues: 60s, tasks: 30s, meter: 30s}
      # The model gateway's token series (agent-gateway/model-gateway, relabelled to the gen_ai_* names
      # by infrastructure/base/agent-gateway/vmpodscrape.yaml), keyed by the run's verified subject.
      meter:
        url: http://vmsingle-victoria-metrics-k8s-stack.observability.svc:8428
        # Grouped by gen_ai_request_model, the model the backend's alias resolved to: the meter
        # prices each run by the model that served it (plan, phase J), since agent-default is
        # GLM-5.3 on public and Claude Opus 5.5 on internal. Grouped by pod too, so a gateway
        # replica whose scrape drops out for a tick is not charged twice on its return.
        query: 'sum by (ar_agent, gen_ai_request_model, gen_ai_token_type, pod) (gen_ai_client_token_usage_sum{ar_agent=~"system:serviceaccount:agents:run-.+", gen_ai_token_type=~"input|cached_input|cache_creation_input|output"})'
        # meter.prices, the price overlay, is the Factory's spec.prices (resources/factory.yaml).
        # The 429 lookup (R13): throttle hits per agent over the gateway's access logs.
        # The model gateway (agentgateway, ADR-0053, plan F.4): a rate-limit refusal logs http.status 429, reason RateLimit.
        logsURL: http://victoria-logs-victoria-logs-single-server.observability.svc:9428
        throttleQuery: '_time:2m kubernetes.pod_namespace:"agent-gateway" AND kubernetes.pod_labels.gateway.networking.k8s.io/gateway-name:"model-gateway" | unpack_json | filter log.http.status:429 AND log.reason:RateLimit | stats by (log.x_ar_agent) count() hits'
      # Task spans (R46) to the trace collector's platform port (observability plan O20).
      tracing: {otlpEndpoint: agent-traces-collector.observability.svc.cluster.local:4317}
