apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The factory's catalogue, repositories and merge policies (Maku factory resources): what the
# factory reads live. Applied by its own Flux child after agent-factory-crds, whose chart installs
# the CRDs. Every file here is a gate path (.policy.yml): agents never change it.
# One Repository per repository (at most 8), holding its merge settings and the policies it binds;
# api.repositories is derived from the Repositories' names. scripts/ci/validate-factory-config.sh lays these over the values file's config as the factory does.
resources:
  - factory.yaml
  - repository-cloud-native-ref.yaml
  - repository-ai-native-ref.yaml
  - repository-runlore-kb.yaml
  - repository-runlore.yaml
  # The merge policies (reusable merge policies, B1): one class each, bound by the Repositories above.
  - mergepolicy-docs-links.yaml
  - mergepolicy-revert.yaml
  - mergepolicy-docs.yaml
  - mergepolicy-tests.yaml
  - mergepolicy-dashboards.yaml
  - mergepolicy-scripts.yaml
  - mergepolicy-review.yaml
  - mergepolicy-alert-rules.yaml
  - mergepolicy-dead-links.yaml
  - mergepolicy-deps-patch.yaml
  - mergepolicy-deps-minor.yaml
  - mergepolicy-kb-entries.yaml
