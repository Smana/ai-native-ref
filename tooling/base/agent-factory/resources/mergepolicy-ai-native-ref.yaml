# This repository's classes and merge rules (Maku factory resources). They used to be
# config.repositories[Smana/ai-native-ref].classes and .merge in ../helm-values-configmap.yaml.
# Every class is review or shadow: nothing arms until its own 20 shadow decisions (v2 D9). Its
# .policy.yml has one low-risk rule, `dead-links`' (R50).
apiVersion: maku.ogenki.io/v1alpha1
kind: MergePolicy
metadata:
  name: ai-native-ref
  namespace: agent-system
spec:
  repositoryRef: ai-native-ref
  classes:
    # No testFirst here (TO4): the tests live under the gate path scripts/ci/.
    docs-links: {shadow: true, holdoutChecks: [validate]}
    revert: {shadow: true, holdoutChecks: [validate]}
    docs: {checks: true}  # public runs only: an internal claim with checks is refused by the XRD
    tests: {}
    dashboards: {}
    scripts: {}
    # Shadow (MC14, runbook 15 §6): intake and decisions, nothing armed. Its detector is this
    # repository's dead-links.yaml and its rule `low-risk: dead-links` in .policy.yml
    # (test-agent-merge-gate-parity.py holds the two).
    dead-links:
      shadow: true  # since the gcp-0 session of 2026-10-27 (runbook 15 §2): decided, never armed
      allowedFiles: ['^(docs|website/content)/.+\.md$']
      protectedFiles: ['^docs/(superpowers|specs)/', '^website/content/docs/decisions/']
      modifyOnly: true
      maxModifiedLines: 20
      diffShape: links-only
      holdoutChecks: ["External links 🔗"]
      oracle: {probe: dead-links, workflow: dead-links.yaml, maxFindings: 10}
      # L16, as the host's: every merge of the class is watched, whoever made it. No `flux`:
      # its changes reach a cluster only through a host pin bump.
      monitor: {oracleRuns: 2, followUpWindow: 168h}
      maxPerDay: 1
  merge:
    # The `main` ruleset's 2 contexts (app 15368): `gh api repos/Smana/ai-native-ref/rulesets/25225244`.
    # ci.yaml runs both on push to main too; TruffleHog is a step of `lint`.
    requiredChecks: [validate, lint]
    verifyChecks: [validate, lint]
    # Today's defaults, written out (Maku v4 step 8 flips them to gateStatus: true, policyBot: false):
    # policy-bot's approval stays the gate, and the factory posts no maku/merge-gate status.
    gateStatus: false
    policyBot: true
    policyBotLogin: ogenki-merge-gate[bot]
    mergerLogin: ogenki-agent-merger[bot]
    autoMergesPerDay: 2
    fixRuns: 1
    checkReruns: 0  # a cancelled check goes to a human
    verifyFor: 30m
    revertWindow: 168h
    leakScanCheck: lint
    awaitingCIFor: 24h
    # Human path AM1: a maintainer's approval of the current head is the merge; the merger
    # merges it as a human merge, outside the caps. The hand-off comment names that one action.
    approveToMerge: true
    # R41: 1 revert in the last 10 merges demotes a class; human path AM7: 3 clean mature merges
    # after the bad one lift it (half-open), and a maintainer's factory/drill revert never counts (AM6).
    breaker: {window: 10, maxReverts: 1, maxFollowUps: 1, recoverAfter: 3}
