# The host repository's classes and merge rules (Maku factory resources). They used to be
# config.repositories[Smana/cloud-native-ref].classes and .merge in ../helm-values-configmap.yaml.
# The central config stays the only merge authority (policyManagement.repositoryAuthority is off),
# so this object, not the repository's .github/agent-factory.yaml, decides. Read live: a class edit
# applies on the next decision; a refused edit keeps the last accepted version serving.
apiVersion: maku.ogenki.io/v1alpha1
kind: MergePolicy
metadata:
  name: cloud-native-ref
  namespace: agent-system
spec:
  repositoryRef: cloud-native-ref
  classes:
    # Live: the one class that merges unattended here (runbook 12, design D4). revert is live
    # with it, or an auto-merge waits on a human to merge its own revert (D5).
    docs-links: {live: true, holdoutChecks: ["Check the documentation links 🔗"]}
    revert: {live: true, holdoutChecks: ["Check the documentation links 🔗"]}
    docs: {checks: true}  # public runs only: an internal claim with checks is refused by the XRD
    tests: {}
    dashboards: {}
    # TO4: the bench's variant turns testFirst on; it needs checks: true (R17)
    scripts: {checks: false, testFirst: false}
    review: {checks: false, testFirst: false}
    # Feature 14's seeded fix (runbook 20): an alerting rule RunLore found broken. No switch: a
    # maintainer merges, the monitor watches. RunLore's verdict is a signal for 2h after the merge;
    # a persisting one is a regression, which with the breaker's maxFollowUps: 1 pauses the class.
    # Shadow since RK15: decisions recorded, a maintainer merges.
    alert-rules:
      shadow: true
      allowedFiles: ['^observability/.+\.ya?ml$']
      monitor: {verification: {within: 2h}, followUpWindow: 2h}
    # Shadow (merge gate classes MC14, runbook 15 §2): intake and decisions, nothing armed.
    # Its fence repeats the host's
    # `low-risk: docs-links` rule, which approves its pull requests until `low-risk:
    # dead-links` lands with the live switch; test-agent-merge-gate-parity.py holds the two.
    dead-links:
      shadow: true  # since the gcp-0 session of 2026-10-27 (runbook 15 §2): decided, never armed
      allowedFiles: ['^(docs|website/content)/.+\.md$']
      protectedFiles: ['^docs/(superpowers|specs)/', '^website/content/docs/decisions/']
      modifyOnly: true
      maxModifiedLines: 20
      diffShape: links-only
      holdoutChecks: ["External links 🔗"]
      oracle: {probe: dead-links, workflow: dead-links.yaml, maxFindings: 10}
      # MC7: every merge of this class stays under watch, whoever made it. No `flux`:
      # Markdown deploys nothing. The monitor records a verdict and never reverts.
      monitor: {oracleRuns: 2, followUpWindow: 168h}
      maxPerDay: 1
    # Shadow since the gcp-0 session of 2026-10-27 (runbook 16): adopted, judged, never
    # merged by the factory; Renovate keeps merging meanwhile (MC12). w0:
    # patch bumps of what Flux deploys (R42), Renovate's never-automerge files protected
    # (test-agent-merge-gate-parity.py derives them from renovate.json).
    deps-patch:
      shadow: true
      author: {adopt: {logins: ["renovate[bot]"], branches: ['^renovate/']}}
      diffShape: semver-patch
      allowedFiles: ['^(apps|flux|infrastructure|observability|security|tooling)/.+\.ya?ml$']
      protectedFiles:
        - '^security/base/zitadel/'
        - '^security/(aws|gcp)-0/zitadel/'
        - '^flux/sources/helmrepo-zitadel\.yaml$'
        - '^infrastructure/base/crossplane/configuration-core/'
        - '^flux/sources/gitrepo-gateway-api\.yaml$'
        - '^observability/base/victoria-metrics-k8s-stack/vm-common-helm-values-configmap\.yaml$'
      modifyOnly: true
      maxPatchFiles: 3
      maxModifiedLines: 10
      releaseAgeCheck: renovate/stability-days
      maxPerDay: 2
      monitor: {flux: {source: flux-system/flux-system, within: 1h}, followUpWindow: 168h}
    # M2 (a): Renovate's minors observed in shadow at no cost; semver-minor never goes live.
    deps-minor:
      shadow: true
      author: {adopt: {logins: ["renovate[bot]"], branches: ['^renovate/']}}
      diffShape: semver-minor
      allowedFiles: ['^(apps|flux|infrastructure|observability|security|tooling)/.+\.ya?ml$']
      protectedFiles:
        - '^security/base/zitadel/'
        - '^security/(aws|gcp)-0/zitadel/'
        - '^flux/sources/helmrepo-zitadel\.yaml$'
        - '^infrastructure/base/crossplane/configuration-core/'
        - '^flux/sources/gitrepo-gateway-api\.yaml$'
        - '^observability/base/victoria-metrics-k8s-stack/vm-common-helm-values-configmap\.yaml$'
      modifyOnly: true
      maxPatchFiles: 3
      maxModifiedLines: 10
      releaseAgeCheck: renovate/stability-days
      monitor: {flux: {source: flux-system/flux-system, within: 1h}, followUpWindow: 168h}
  merge:
    # Classic protection's 8 contexts (app 15368), read with `gh api repos/Smana/cloud-native-ref/branches/main/protection`.
    requiredChecks:
      - "Pre-commit checks 🛃"
      - "Security scanning 🔒"
      - "Kubernetes validation ☸"
      - "Rendered manifest diff 📝"
      - "Check the shell scripts 💻"
      - "Check the documentation links 🔗"
      - "Validate Vector Log Parsing Configuration (vlsingle)"
      - "Validate Vector Log Parsing Configuration (vlcluster)"
    # The jobs ci.yaml runs on push to main, watched on the merge commit (§6.4). Not the Vector
    # checks (their push trigger is path-filtered) nor the rendered diff (PR-only).
    verifyChecks:
      - "Pre-commit checks 🛃"
      - "Security scanning 🔒"
      - "Kubernetes validation ☸"
      - "Check the shell scripts 💻"
      - "Check the documentation links 🔗"
    contractCheck: "Test contract 🧪"  # required on a task with a contract (TF8, row 2b); report-only otherwise
    policyBotLogin: ogenki-merge-gate[bot]
    mergerLogin: ogenki-agent-merger[bot]
    autoMergesPerDay: 1  # one unattended merge a day across live classes; shadow decisions are not counted
    fixRuns: 2
    # Re-runs of a cancelled required check per task (agent-platform #86); 0 hands it to a
    # human. Above 0 the merger App needs actions: write.
    checkReruns: 1
    verifyFor: 30m
    revertWindow: 168h
    leakScanCheck: "Security scanning 🔒"  # R42: TruffleHog's check run, in both lists above
    # MC8: a bad follow-up counts toward the breaker beside a revert, both 1 in 10.
    awaitingCIFor: 24h
    # Human path AM1: a maintainer's approval of the current head is the merge; the merger
    # merges it as a human merge, outside the caps. The hand-off comment names that one action.
    approveToMerge: true
    # R41: 1 revert in the last 10 merges demotes a class; human path AM7: 3 clean mature merges
    # after the bad one lift it (half-open), and a maintainer's factory/drill revert never counts (AM6).
    breaker: {window: 10, maxReverts: 1, maxFollowUps: 1, recoverAfter: 3}
