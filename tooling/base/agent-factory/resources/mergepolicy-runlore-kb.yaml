# RunLore's knowledge base: its classes and merge rules (Maku factory resources). They used to be
# config.repositories[Smana/runlore-kb].classes and .merge in ../helm-values-configmap.yaml.
# RK3: RunLore drafts, the merge gate merges verified entries; shadow until 20 decisions (K8).
# Its .policy.yml has one low-risk rule, `kb-entries`'.
apiVersion: maku.ogenki.io/v1alpha1
kind: MergePolicy
metadata:
  name: runlore-kb
  namespace: agent-system
spec:
  repositoryRef: runlore-kb
  classes:
    docs-links: {shadow: true, holdoutChecks: [validate]}
    revert: {shadow: true, holdoutChecks: [validate]}
    kb-entries:
      shadow: true
      author: {adopt: {logins: ["runlore[bot]"], branches: ["^runlore/kb-"]}}
      diffShape: added-entry
      allowedFiles: ['^incidents/[^/]+\.md$']
      companionFiles: ['^index\.md$', '^log\.md$']
      requiredLabel: ready-to-merge
      holdoutChecks: [validate]
      maxPerDay: 5
  merge:
    requiredChecks: [validate, leak-scan]
    verifyChecks: [validate, leak-scan]
    # Today's defaults, written out (Maku v4 step 8 flips them to gateStatus: true, policyBot: false):
    # policy-bot's approval stays the gate, and the factory posts no maku/merge-gate status.
    gateStatus: false
    policyBot: true
    policyBotLogin: ogenki-merge-gate[bot]
    mergerLogin: ogenki-agent-merger[bot]
    autoMergesPerDay: 5
    fixRuns: 1
    checkReruns: 0
    verifyFor: 30m
    revertWindow: 168h
    # K12: the knowledge base is public text with secret redaction at each tool output (RK13).
    # `leak-scan` is the job PR 6 adds to the repository, in both lists above; a red `validate`
    # would otherwise escalate as secret_scan_red and post "found a live credential".
    leakScanCheck: leak-scan
    awaitingCIFor: 24h
    approveToMerge: true
    breaker: {window: 10, maxReverts: 1, maxFollowUps: 1, recoverAfter: 3}
