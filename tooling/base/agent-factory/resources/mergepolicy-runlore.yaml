# RunLore's code repository: its classes and merge rules (Maku factory resources). Both classes the
# factory requires of an entry are shadow: the factory records what it would have merged and merges
# nothing until the decisions have been reviewed (K8). Its only required check is `build`, so it is
# the holdout of each class and the one check the merge and its verification wait on.
apiVersion: maku.ogenki.io/v1alpha1
kind: MergePolicy
metadata:
  name: runlore
  namespace: agent-system
spec:
  repositoryRef: runlore
  classes:
    docs-links: {shadow: true, holdoutChecks: [build]}
    revert: {shadow: true, holdoutChecks: [build]}
  merge:
    requiredChecks: [build]
    verifyChecks: [build]
    # Today's defaults, written out (Maku v4 step 8 flips them to gateStatus: true, policyBot: false):
    # policy-bot's approval stays the gate, and the factory posts no maku/merge-gate status.
    gateStatus: false
    policyBot: true
    policyBotLogin: ogenki-merge-gate[bot]
    mergerLogin: ogenki-agent-merger[bot]
    autoMergesPerDay: 5
    fixRuns: 1
    checkReruns: 0
    verifyFor: 30m
    revertWindow: 168h
    # The factory's validation (R42) wants a leak check in both lists above. RunLore has no
    # separate scan job: `build` is its one required check, so a red `build` is what escalates.
    leakScanCheck: build
    awaitingCIFor: 24h
    approveToMerge: true
    breaker: {window: 10, maxReverts: 1, maxFollowUps: 1, recoverAfter: 3}
