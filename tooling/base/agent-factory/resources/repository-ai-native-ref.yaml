# The second repository (v2 design D9), this one (Maku factory resources): its settings, its merge
# rules and the merge policies it binds (reusable merge policies, B2 and B3). Every class is review or
# shadow: nothing arms until its own 20 shadow decisions (v2 D9). Its .policy.yml has one low-risk
# rule, `dead-links`' (R50). Read live, like every Repository.
apiVersion: maku.ogenki.io/v1alpha1
kind: Repository
metadata:
  name: ai-native-ref
  namespace: agent-system
spec:
  factoryRef: ${cluster_name}
  repository: Smana/ai-native-ref
  maintainers: [Smana]
  triggerLabel: factory/ready
  # v3 feature 3: what a check-enabled run requests beyond github. Only docs has checks: true,
  # since the gcp-0 session's live proofs (README, "v3 loop and sandbox layers").
  checks: {egress: [golang, pypi]}
  schedules:
    # dead-links' intake here (MC6, F3): what two nightly runs of this repository's
    # dead-links.yaml agree on. Inert only if the class is off (MC14). The name keys every
    # task it starts and is unique across repositories (the factory's strict parse refuses
    # a second `dead-links`, the host's).
    - name: ai-native-ref-dead-links
      cron: "15 7 * * *"  # after the 04:41 scan; the host's slot is 07:00
      class: dead-links
      probe: dead-links
      text: Fix the dead external links listed below.
  merge:
    # The `main` ruleset's 2 contexts (app 15368): `gh api repos/Smana/ai-native-ref/rulesets/25225244`.
    # ci.yaml runs both on push to main too; TruffleHog is a step of `lint`.
    requiredChecks: [validate, lint]
    verifyChecks: [validate, lint]
    maxPerDay: 2
    fixRuns: 1
    checkReruns: 0  # a cancelled check goes to a human
    leakScanCheck: lint
  mergePolicies:
    # No testFirst here (TO4): the tests live under the gate path scripts/ci/.
    - {name: docs-links, mode: shadow, holdoutChecks: [validate]}
    - {name: revert, mode: shadow, holdoutChecks: [validate]}
    - {name: docs, mode: disabled}
    - {name: tests, mode: disabled}
    - {name: dashboards, mode: disabled}
    - {name: scripts, mode: disabled}
    # Shadow (MC14, runbook 15 §6): its detector is this repository's dead-links.yaml and its rule
    # `low-risk: dead-links` in .policy.yml (test-agent-merge-gate-parity.py holds the two).
    - name: dead-links
      mode: shadow
      allowedFiles: ['^(docs|website/content)/.+\.md$']
      oracleWorkflow: dead-links.yaml
