apiVersion: maku.ogenki.io/v1alpha1
kind: Repository
metadata:
  name: ai-native-ref
  namespace: agent-system
spec:
  checks:
    egress:
    - golang
    - pypi
  factoryRef: ${cluster_name}
  maintainers:
  - Smana
  merge:
    breaker:
      maxReverts: 0
      window: 0
    checkReruns: 0
    fixRuns: 1
    leakScanCheck: lint
    maxPerDay: 2
    mergerLogin: ""
    paused:
      reason: 'live drill 2026-11-25 (gcp-0): pause opens a PR, never merges'
    policyBotLogin: ""
    requiredChecks:
    - validate
    - lint
    revertWindow: 0s
    verifyChecks:
    - validate
    - lint
    verifyFor: 0s
  mergePolicies:
  - allowedFiles:
    - ^website/content/.+\.md$
    maxModifiedLines: 60
    mode: shadow
    name: docs
  - allowedFiles:
    - ^(docs|website/content)/.+\.md$
    mode: shadow
    name: dead-links
    oracleWorkflow: dead-links.yaml
  repository: Smana/ai-native-ref
  schedules:
  - class: dead-links
    cron: 15 7 * * *
    name: ai-native-ref-dead-links
    probe: dead-links
    text: Fix the dead external links listed below.
    workflow: quick
  triggerLabel: factory/ready
  workflow:
    default: standard
    planGate: ask
    stepUp: auto
status:
  classCount: 0
  liveCount: 0
