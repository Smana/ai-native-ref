# The third repository, RunLore's knowledge base (RK3; Maku factory resources): its settings, its merge
# rules and the merge policies it binds. RK3: RunLore drafts, maku/merge-gate evaluates entries;
# kb-entries needs five clean decisions at evidence low (K8). Its own fence names aws-0. Read live.
apiVersion: maku.ogenki.io/v1alpha1
kind: Repository
metadata:
  name: runlore-kb
  namespace: agent-system
spec:
  factoryRef: ${cluster_name}
  repository: Smana/runlore-kb
  maintainers: [Smana]
  triggerLabel: factory/ready
  workflow:
    default: standard
    # A failed standard task runs once more as careful, without asking (Maku v0.54.0 step-up), and
    # a plan-first task waits for its plan's approval.
    stepUp: auto
    planGate: ask
  merge:
    requiredChecks: [validate, leak-scan]
    verifyChecks: [validate, leak-scan]
    maxPerDay: 5
    fixRuns: 1
    checkReruns: 0
    # K12: the knowledge base is public text with secret redaction at each tool output (RK13).
    # `leak-scan` is the job PR 6 adds to the repository, in both lists above; a red `validate`
    # would otherwise escalate as secret_scan_red and post "found a live credential".
    leakScanCheck: leak-scan
  mergePolicies:
    # docs-links comes from the chart's catalog, evaluated in shadow unbound: a binding would only
    # repeat validate, already a required check.
    - name: kb-entries
      mode: shadow
      allowedFiles: ['^incidents/[^/]+\.md$']
      companionFiles: ['^index\.md$', '^log\.md$']
      requiredLabel: ready-to-merge
