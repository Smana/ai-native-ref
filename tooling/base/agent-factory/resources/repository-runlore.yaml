# The fourth repository, RunLore itself (Smana/runlore: public, default branch main): its settings,
# its merge rules, and the chart's catalog policies in shadow (K8). maku/merge-gate reads this object;
# the repository's own fence names gcp-0 (Smana/runlore#617).
apiVersion: maku.ogenki.io/v1alpha1
kind: Repository
metadata:
  name: runlore
  namespace: agent-system
spec:
  factoryRef: ${cluster_name}
  repository: Smana/runlore
  maintainers: [Smana]
  triggerLabel: factory/ready
  workflow:
    default: standard
    # A failed standard task runs once more as careful, without asking (Maku v0.54.0 step-up), and
    # a plan-first task waits for its plan's approval.
    stepUp: auto
    planGate: ask
  merge:
    # RunLore's only required check is `build`, so it is the holdout of each class and the one check
    # the merge and its verification wait on.
    requiredChecks: [build]
    verifyChecks: [build]
    maxPerDay: 5
    fixRuns: 1
    checkReruns: 0
    # The factory's validation (R42) wants a leak check in both lists above. RunLore has no
    # separate scan job: `build` is its one required check, so a red `build` is what escalates.
    leakScanCheck: build
  # No binding: the chart's catalog policies (docs-links, docs) are evaluated in shadow unbound, and
  # build, the one holdout either binding named, is already a required check.
