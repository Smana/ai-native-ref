# The fourth repository, RunLore itself (Smana/runlore: public, default branch main): its settings,
# its merge rules and the two required policies, both shadow (K8). Like runlore-kb, it has no
# `.policy.yml` in this tree, and its own file holds the fence, which names gcp-0 (Smana/runlore#617).
apiVersion: maku.ogenki.io/v1alpha1
kind: Repository
metadata:
  name: runlore
  namespace: agent-system
spec:
  factoryRef: ${cluster_name}
  repository: Smana/runlore
  maintainers: [Smana]
  triggerLabel: factory/ready
  merge:
    # RunLore's only required check is `build`, so it is the holdout of each class and the one check
    # the merge and its verification wait on.
    requiredChecks: [build]
    verifyChecks: [build]
    autoMergesPerDay: 5
    fixRuns: 1
    checkReruns: 0
    # The factory's validation (R42) wants a leak check in both lists above. RunLore has no
    # separate scan job: `build` is its one required check, so a red `build` is what escalates.
    leakScanCheck: build
  mergePolicies:
    - {name: docs-links, mode: shadow, holdoutChecks: [build]}
    - {name: revert, mode: shadow, holdoutChecks: [build]}
