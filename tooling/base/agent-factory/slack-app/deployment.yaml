# One replica (R26): the in-memory dedupe and the thread map's writes assume it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-slack-app
  namespace: agent-system
  labels:
    app.kubernetes.io/name: factory-slack-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: factory-slack-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: factory-slack-app
    spec:
      serviceAccountName: factory-slack-app
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        # The image's user is the name "nonroot": the kubelet cannot verify a name is non-root, so the
        # numeric ids are set here (CreateContainerConfigError on gcp-0, 2026-10-27).
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532  # the 0440 Secret files are readable through it
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: factory-slack-app
          # agent-platform v0.27.0, by digest, with the factory's and the broker's pins.
          image: ghcr.io/smana/factory-slack-app:v0.27.0@sha256:e60df01eb28a839b30fd01adcf0a500699532c8b8b0747d99fba7a46c6c3066d
          args: ["--config", "/etc/factory-slack-app/config/config.yaml"]
          ports:
            - {name: events, containerPort: 8080}
            - {name: webhooks, containerPort: 8081}
            - {name: metrics, containerPort: 9090}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - {name: config, mountPath: /etc/factory-slack-app/config, readOnly: true}
            - {name: principal, mountPath: /etc/factory-slack-app/principal, readOnly: true}
            - {name: slack, mountPath: /etc/factory-slack-app/slack, readOnly: true}
            - {name: webhook, mountPath: /etc/factory-slack-app/webhook, readOnly: true}
      # Whole-Secret mounts (no subPath), so a refresh reaches the files without a restart: the App
      # re-reads each at use except botUserIDFile. No Reloader annotation for that reason.
      volumes:
        - name: config
          configMap:
            name: factory-slack-app-config
        - name: principal
          secret:
            secretName: factory-slack-principal  # pragma: allowlist secret
            defaultMode: 0440
        - name: slack
          secret:
            secretName: factory-slack-app  # pragma: allowlist secret
            defaultMode: 0440
        - name: webhook
          secret:
            secretName: room-broker-webhook-slack-app  # pragma: allowlist secret
            defaultMode: 0440
