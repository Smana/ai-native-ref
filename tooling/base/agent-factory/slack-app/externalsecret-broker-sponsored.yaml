# The broker's mount for human.mcp.sponsored[].clientIDFile: the same id the factory reads, or one
# client reads another's rooms.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: room-broker-sponsored
  namespace: agent-system
spec:
  refreshInterval: 20m
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  target:
    name: room-broker-sponsored
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: slack-app-client-id  # pragma: allowlist secret
      remoteRef: {key: factory-slack-principal, property: client-id}
