# The ZITADEL machine user's client id and secret, and the project id its token's audience names.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: factory-slack-principal
  namespace: agent-system
spec:
  refreshInterval: 20m
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  target:
    name: factory-slack-principal
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-id  # pragma: allowlist secret
      remoteRef: {key: factory-slack-principal, property: client-id}
    - secretKey: client-secret  # pragma: allowlist secret
      remoteRef: {key: factory-slack-principal, property: client-secret}
    - secretKey: project-id  # pragma: allowlist secret
      remoteRef: {key: factory-slack-principal, property: project-id}
