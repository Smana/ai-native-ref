# The Slack App's bot token, signing secret and bot user id (put in the store by hand, runbook 18).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: factory-slack-app
  namespace: agent-system
spec:
  refreshInterval: 20m
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  target:
    name: factory-slack-app
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: bot-token  # pragma: allowlist secret
      remoteRef: {key: factory-slack-app, property: bot-token}
    - secretKey: signing-secret  # pragma: allowlist secret
      remoteRef: {key: factory-slack-app, property: signing-secret}
    - secretKey: bot-user-id
      remoteRef: {key: factory-slack-app, property: bot-user-id}
