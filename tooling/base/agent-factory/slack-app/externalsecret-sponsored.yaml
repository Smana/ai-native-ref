# The chart's sponsoredSecret (mounted optional, 0440): the principal's client id and the project id
# api.projectIDFile names. The same client id as the broker's (externalsecret-broker-sponsored.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-factory-sponsored
  namespace: agent-system
spec:
  refreshInterval: 20m
  secretStoreRef:
    kind: SecretStore
    name: agents-secrets
  target:
    name: agent-factory-sponsored
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: slack-app-client-id  # pragma: allowlist secret
      remoteRef: {key: factory-slack-principal, property: client-id}
    - secretKey: project-id  # pragma: allowlist secret
      remoteRef: {key: factory-slack-principal, property: project-id}
