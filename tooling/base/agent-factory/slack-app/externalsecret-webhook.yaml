# One Secret for both sides: the broker mounts it as webhooks[].secretFile and the App as
# webhookKeyFile. refreshInterval 0: generated once. A rebuild regenerates both sides at once.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: room-broker-webhook-slack-app
  namespace: agent-system
spec:
  refreshInterval: "0"
  target:
    name: room-broker-webhook-slack-app
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: room-broker-webhook-slack-app}
