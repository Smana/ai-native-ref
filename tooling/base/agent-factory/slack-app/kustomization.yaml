apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The factory's Slack App (factory interfaces part 2). Not wired here (D4, R30, L3'): no kustomization
# but a cloud's own lists this directory. Each cloud applies tooling/<cloud>/agent-factory/slack-app
# (runbooks 18 and 22), whose broker declares its webhook and whose factory its sponsored principal.
# Every file here is a gate path (.policy.yml): agents never change it.
resources:
  - serviceaccount.yaml
  - rbac.yaml
  - configmap-threads.yaml
  - deployment.yaml
  - service.yaml
  - vmservicescrape.yaml
  - network-policy.yaml
  - httproute.yaml
  - externalsecret-principal.yaml
  - externalsecret-slack.yaml
  - externalsecret-sponsored.yaml
  - externalsecret-broker-sponsored.yaml
  - password-generator-webhook.yaml
  - externalsecret-webhook.yaml

# The App reads its config once at start: a change moves the content-hash suffix and rolls the pod,
# as the broker's does.
configMapGenerator:
  - name: factory-slack-app-config
    namespace: agent-system
    files:
      - config.yaml
