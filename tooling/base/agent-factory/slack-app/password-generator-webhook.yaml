# The webhook signing key, generated in the cluster: 64 alphanumerics are valid base64 of 48 bytes
# (R16's format: one or two base64 lines, each at least 32 bytes decoded). Precedent:
# infrastructure/gcp-0/envoy-ai-gateway/password-generators.yaml.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: room-broker-webhook-slack-app
  namespace: agent-system
spec:
  length: 64
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys: [signing-key]
