apiVersion: v1
kind: Service
metadata:
  name: factory-slack-app
  namespace: agent-system
  labels:
    app.kubernetes.io/name: factory-slack-app
spec:
  selector:
    app.kubernetes.io/name: factory-slack-app
  ports:
    - {name: events, port: 8080, targetPort: 8080}
    - {name: webhooks, port: 8081, targetPort: 8081}
    - {name: metrics, port: 9090, targetPort: 9090}
