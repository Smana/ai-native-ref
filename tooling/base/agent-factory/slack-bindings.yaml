# The Slack workspace and the channels the factory's App serves (CD24): the one place a channel's
# binding is written. scripts/ci/gen-slack-bindings.py renders its consumers from it and fails on
# any difference — the App's `channels` and, per cloud, the factory's api.sponsored[slack-app].repositories and
# the broker's webhooks[slack-app].repositories and .events. Edit here, run the generator with
# --write, commit both.
#
# OWNER-FILL: the team id and channel ids are the owner's; test-factory-slack-switchon.py refuses a
# marker while FACTORY_SLACK_LIVE=1.
teamID: T07J97G2K2P
channels:
  C0CC4M8SNVD:
    repositories: [Smana/cloud-native-ref, Smana/ai-native-ref, Smana/runlore, Smana/runlore-kb]
    maxCostUSD: 2
    # A forge.push wait is drawn as a card with Approve and Deny (Maku docs/slack.md); the broker's
    # human.slackDecide (each cloud's copy) is the authority that answers a press.
    approvals: true
    # Stop, retry and answer in a task's thread (UX6): honoured only where the broker serves the route
    # (human.slackStop, human.slackRetry, human.slackAnswer; aws-0 first, gcp-0 at its next turn).
    intentActions: [stop, retry, answer]
