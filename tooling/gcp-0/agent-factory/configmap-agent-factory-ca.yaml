# The platform CA, for the tailnet gateway's BackendTLSPolicy (tooling/base/agent-factory/backendtlspolicy.yaml,
# whose caCertificateRefs takes a ConfigMap only). A public certificate, not a secret. It is the platform's offline root,
# the same file as cloud-native-ref's .github/openbao-root-ca.pem: a subset of the chain in openbao-ca, and the factory
# presents its intermediate, so the root verifies it. The session's first step verifies the factory's certificate against
# it (runbook 25 section 10). Rotating the CA means a PR here and one in cloud-native-ref (RunLore's copies,
# observability/{aws-0,gcp-0}/.../configmap-factory-ca.yaml): test-factory-backend-tls.py holds the copies equal.
# gcp-0's copy: one offline root signs both clouds' intermediates (cloud-native-ref,
# website/content/docs/platform/security/pki-and-secrets.md), but gcp-0's chain is not re-checked continuously: hand-check
# it against openbao-priv-gcp-ca-chain at the next gcp-0 session. gcp-0 is torn down, so this is unproved live.
