apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A render root of its own, so CI renders this base with gcp-0's fixture values
# (GCP parity GP-14). The broker CA is agent-secrets' openbao-ca, which
# security/gcp-0/agent-secrets already points at Secret Manager.
resources:
  - ../../base/agent-factory
  - helm-values-suspend.yaml
  - helm-values-sponsored.yaml

patches:
  # Helm deep-merges valuesFrom in order: these entries add sandbox.suspend, then api.sponsored, to base's config.
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: agent-factory
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: agent-factory-helm-values-suspend
      # The Slack App's sponsored principal (runbook 18), merged last: it adds config.api.sponsored.
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: agent-factory-helm-values-sponsored
  # ZITADEL on gcp-0 is this cluster's own Gateway VIP: Envoy enforces policy on
  # its runtime listener port, so any toPorts fails (ruling AU, as
  # infrastructure/gcp-0/room-broker). `test` pins the index.
  - target:
      group: cilium.io
      kind: CiliumNetworkPolicy
      name: agent-factory
    patch: |-
      - op: test
        path: /spec/egress/7/toFQDNs/0/matchName
        value: auth.${public_domain_name}
      - op: replace
        path: /spec/egress/7
        value:
          toEntities:
            - all
