# The OpenCode harness trial (docs/superpowers/plans/2026-11-15-opencode-harness-adopt-plan.md, Task 4),
# on gcp-0 by the owner's decision of 2026-11-25 (aws-0 is torn down). Half of the unpinned,
# default-path tasks (the treatment cohort) run on OpenCode; the other half (control) on OpenHands,
# the default. Nothing else differs between the arms: same workflow, models, efforts, checks and
# caps. No workflow treatment beside it, and defaults.harness stays unset (openhands).
# test-agent-harness-trial-off.py holds that shape. To end the trial, delete this file and its patch.
apiVersion: maku.ogenki.io/v1alpha1
kind: Factory
metadata:
  name: ${cluster_name}
  namespace: agent-system
spec:
  evaluation:
    controlPercent: 50
    treatmentHarness: opencode
