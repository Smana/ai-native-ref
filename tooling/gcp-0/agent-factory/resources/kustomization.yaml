apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The directory clusters/gcp-0-agent-platform/tooling-agent-factory-resources.yaml applies: base's
# Factory, Repositories and MergePolicies, named for this cluster by Flux's ${cluster_name}.
resources:
  - ../../../base/agent-factory/resources
# The OpenCode harness trial, gcp-0 only (owner decision 2026-11-25).
patches:
  - path: factory-harness-trial.yaml
