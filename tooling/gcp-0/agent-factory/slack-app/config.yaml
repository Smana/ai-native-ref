# gcp-0's full copy of ../../../base/agent-factory/slack-app/config.yaml, with teamID and channels filled
# (runbook 18): the overlay's generator replaces the whole file, since a ConfigMap key is one string no
# patch can extend. test-factory-slack-switchon.py fails when it differs from base in anything else.
#
# OWNER-FILL: the team id and the channel ids below are marked OWNER-FILL-*; the test refuses them once
# FACTORY_SLACK_LIVE=1. A channel's maxCostUSD stays at or under the principal's maxCostUSD (2).
signingSecretFile: /etc/factory-slack-app/slack/signing-secret
botTokenFile: /etc/factory-slack-app/slack/bot-token
botUserIDFile: /etc/factory-slack-app/slack/bot-user-id
webhookKeyFile: /etc/factory-slack-app/webhook/signing-key
# The ZITADEL machine user's client credentials (the host's script writes the Secret's source).
clientIDFile: /etc/factory-slack-app/principal/client-id
clientSecretFile: /etc/factory-slack-app/principal/client-secret
projectIDFile: /etc/factory-slack-app/principal/project-id
issuerURL: ${identity_provider_url}
# The broker's human listener, plaintext inside the mesh (:8443 is its TLS listener for bridges). No path:
# the App appends /mcp itself.
brokerURL: http://room-broker.agent-system.svc.cluster.local:8080
roomsURL: https://rooms.${private_domain_name}
namespace: agent-system
# The App refuses to start until both are filled: an empty teamID or no channel fails its config load.
# Fill teamID as <T...> and channels as <channel id>: {repositories: [owner/name], maxCostUSD: <at least 0.01>}.
teamID: T07J97G2K2P
channels:
  C0CC4M8SNVD: {repositories: [Smana/cloud-native-ref, Smana/ai-native-ref], maxCostUSD: 0.5}
