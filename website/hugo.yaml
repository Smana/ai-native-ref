baseURL: https://airef.ogenki.io/
title: AI Native Reference
languageCode: en-us
enableRobotsTXT: true
enableGitInfo: true

# Drift guard: any unresolved internal ref (relref/ref) fails the build rather
# than shipping a silent 404. This is the site's internal-link gate; the
# repository-wide gate stays scripts/ci/validate-links.sh.
refLinksErrorLevel: ERROR

module:
  hugoVersion:
    min: "0.146.0"
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Get started
      pageRef: /docs/get-started
      weight: 1
    - name: Use
      pageRef: /docs/use
      weight: 2
    - name: How it works
      pageRef: /docs/how-it-works
      weight: 3
    - name: Operate
      pageRef: /docs/operate
      weight: 4
    - name: Reference
      pageRef: /docs/reference
      weight: 5
    - name: Status
      pageRef: /docs/status
      weight: 6
    # Cross-site link (split design §5): a relref cannot reach the host site, so the S4 link
    # check fetches it after each deploy.
    - name: Cloud Native Ref ↗
      weight: 7
      url: "https://cnref.ogenki.io/"
    - name: GitHub
      weight: 8
      url: "https://github.com/Smana/ai-native-ref"
      params:
        icon: github
    - name: Search
      weight: 9
      params:
        type: search

params:
  description: "The AI platform of Cloud Native Reference: self-hosted model serving and an agent factory, shipped as one signed Flux artifact its host pins."
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      # The Ogenki mark, extracted from the company lockup so the navbar carries
      # the brand without the wordmark competing with the site's own title.
      # 448x396 in its own viewBox, so 27x24 keeps it undistorted at navbar height.
      path: images/ogenki-mark.svg
      # Brand navy measures 1.92:1 against the dark navbar, under the 3:1 WCAG
      # asks of a graphical object, so the dark theme gets the white variant
      # from the same lockup set. Hextra renders both and swaps them with CSS.
      dark: images/ogenki-mark-white.svg
      width: 27
      height: 24
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
  editURL:
    enable: true
    base: "https://github.com/Smana/ai-native-ref/edit/main/website/content"
  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
  imageZoom:
    enable: true
  theme:
    default: system
    displayToggle: true
  # The sponsor note (layouts/_partials/custom/sponsor.html): message is the footer line on every
  # page, card the status page's card ({{< sponsor-card >}}). [text][sponsor] links to url.
  sponsor:
    url: "https://github.com/sponsors/Smana"
    message: "One person maintains this reference and pays for the AWS, GCP and model-API time that verifies it; [sponsoring][sponsor] helps cover that."
    card:
      title: "Keep it running"
      message: "Every line above is proven in live sessions on AWS and GCP with paid model APIs, run by one maintainer. [Sponsorship][sponsor] pays for more of them: more sessions, more providers, faster releases."
