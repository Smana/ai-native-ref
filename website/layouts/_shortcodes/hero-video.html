{{- /* The homepage hero: its text on the left, the Agent Factory clip on the right; stacked on
     narrow screens. Under prefers-reduced-motion the clip never plays: CSS swaps it for the
     poster, and the script drops autoplay before the browser starts it. */ -}}
<div class="anr-hero">
  <div class="anr-hero-text">{{ .Inner }}</div>
  <figure class="anr-hero-media">
    <video class="anr-hero-video" autoplay muted loop playsinline preload="metadata" width="720" height="900"
           poster="{{ "media/agent-factory-poster.jpg" | relURL }}" aria-describedby="anr-hero-alt">
      <source src="{{ "media/agent-factory.mp4" | relURL }}" type="video/mp4">
    </video>
    <img class="anr-hero-poster" src="{{ "media/agent-factory-poster.jpg" | relURL }}" width="720" height="900" alt="" loading="lazy">
    <figcaption id="anr-hero-alt">
      The Agent Factory in 32 s: a labelled issue becomes a sandboxed agent run, watched and steered
      in a room; every call goes through agentgateway under the run's own identity and budget; the
      agent opens a pull request that a human reviews and merges.
    </figcaption>
  </figure>
</div>
<script>
if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  document.querySelectorAll('.anr-hero-video').forEach(function (v) { v.removeAttribute('autoplay'); v.preload = 'none'; v.pause(); });
}
</script>
